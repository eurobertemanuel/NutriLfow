/* ========================= INFRAESTRUTURA ===============================
   Toast, limite de erro e esqueleto de carregamento. Ficam no topo porque
   o resto do app depende deles — inclusive o storage, que avisa por toast
   quando não consegue salvar.
   ====================================================================== */

const barramentoToast = {
  ouvintes: [],
  ouvir(fn) { this.ouvintes.push(fn); return () => { this.ouvintes = this.ouvintes.filter(o => o !== fn); }; },
  emitir(t) { this.ouvintes.forEach(fn => fn({ id: Date.now() + Math.random(), duracao: 3600, ...t })); },
};

/* Chamável de qualquer lugar, inclusive de fora de componente. */
const toast = (texto, tipo = "info", sub = "") => barramentoToast.emitir({ texto, tipo, sub });

function ToastHost() {
  const [fila, setFila] = useState([]);

  useEffect(() => barramentoToast.ouvir(t => {
    setFila(f => [...f, t]);
    setTimeout(() => setFila(f => f.filter(x => x.id !== t.id)), t.duracao);
  }), []);

  if (fila.length === 0) return null;
  const icones = { ok: IconCheck, erro: IconAlert, info: IconBell, xp: IconStar };

  return (
    <div className="nf-toasts">
      {fila.map(t => {
        const Icone = icones[t.tipo] || IconBell;
        return (
          <div key={t.id} className={`nf-toast nf-toast-${t.tipo}`} role="status">
            <span className="nf-toast-icone"><Icone width={16} height={16} /></span>
            <span style={{ minWidth: 0, flex: 1 }}>
              <span className="nf-toast-texto">{t.texto}</span>
              {t.sub && <span className="nf-toast-sub">{t.sub}</span>}
            </span>
            <button onClick={() => setFila(f => f.filter(x => x.id !== t.id))}
              className="nf-toast-fechar nf-focus" aria-label="Fechar aviso">
              <IconX width={13} height={13} />
            </button>
          </div>
        );
      })}
    </div>
  );
}

/* Se um componente quebrar, o app inteiro não vai junto. */
class LimiteDeErro extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro, info) { console.error("NutriFlow quebrou:", erro, info); }
  render() {
    if (!this.state.erro) return this.props.children;
    return (
      <div className="nf-card" style={{ padding: 34, textAlign: "center", margin: 16 }}>
        <div style={{ width: 52, height: 52, borderRadius: 16, background: "var(--danger-tint)", color: "var(--danger)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
          <IconAlert width={24} height={24} />
        </div>
        <h2 className="nf-h1" style={{ fontSize: 20 }}>Algo quebrou nesta tela</h2>
        <p style={{ color: "var(--ink-soft)", fontSize: 14.5, marginTop: 8, maxWidth: 420, marginInline: "auto" }}>
          Seus dados continuam salvos no aparelho. Volte para o início ou recarregue a página.
        </p>
        <p className="nf-erro-detalhe">{String(this.state.erro?.message || this.state.erro)}</p>
        <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 20, flexWrap: "wrap" }}>
          <button onClick={() => this.setState({ erro: null })} className="nf-btn nf-btn-ghost">Tentar de novo</button>
          <button onClick={() => window.location.reload()} className="nf-btn nf-btn-primary">Recarregar</button>
        </div>
      </div>
    );
  }
}

function Esqueleto({ linhas = 3, altura = 14 }) {

  );
}

function Carregando({ texto = "Carregando…" }) {

}

/* ======================== STORAGE HELPERS ================================ */

function storageGet(key, fallback) {
  try {
    const raw = localStorage.getItem("nf_" + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function storageSet(key, value) {
  try {
    localStorage.setItem("nf_" + key, JSON.stringify(value));
    return true;
  } catch (e) {
    /* Cota estourada é quase sempre foto. Solta as mais antigas e tenta de
       novo, em vez de perder o registro inteiro em silêncio. */
    const comFoto = { diario: "diario", desafios_custom: "desafios_custom" };
    if (comFoto[key]) {
      try {
        localStorage.setItem("nf_" + key, JSON.stringify(descartarFotosAntigas(key, value)));
        return true;
      } catch {}
    }
    console.warn("Não consegui salvar", key, e);
    toast("Não consegui salvar no aparelho", "erro", "A memória do navegador encheu. Libere espaço ou apague registros antigos.");
    return false;
  }
}

/* Mantém as fotos mais recentes e libera o resto. */
function descartarFotosAntigas(key, valor, manter = 5) {
  if (key === "desafios_custom") {
    const todos = [];
    Object.entries(valor || {}).forEach(([pac, lista]) =>
      (lista || []).forEach(d => { if (d.submissao?.fotoBase64) todos.push(pac + "|" + d.id); })
    );
    const soltar = new Set(todos.slice(0, Math.max(0, todos.length - manter)));
    const saida = {};
    Object.entries(valor || {}).forEach(([pac, lista]) => {
      saida[pac] = (lista || []).map(d =>
        soltar.has(pac + "|" + d.id)
          ? { ...d, submissao: { ...d.submissao, fotoBase64: "", fotoRemovida: true } }
          : d
      );
    });
    return saida;
  }
  const todos = [];
  Object.entries(valor || {}).forEach(([pac, dias]) =>
    Object.entries(dias || {}).forEach(([dia, itens]) =>
      (itens || []).forEach(r => { if (r.foto) todos.push(pac + "|" + dia + "|" + r.id); })
    )
  );
  const soltar = new Set(todos.slice(0, Math.max(0, todos.length - manter)));
  const saida = {};
  Object.entries(valor || {}).forEach(([pac, dias]) => {
    saida[pac] = {};
    Object.entries(dias || {}).forEach(([dia, itens]) => {
      saida[pac][dia] = (itens || []).map(r =>
        soltar.has(pac + "|" + dia + "|" + r.id) ? { ...r, foto: "", fotoRemovida: true } : r
      );
    });
  });
  return saida;
}

/* Reduz a imagem antes de guardar. Foto de iPhone tem ~4 MB em base64 e
   estoura sozinha o limite do localStorage; a 520px fica em ~40 KB. */
function comprimirImagem(file, maxLado = 520, qualidade = 0.66) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onerror = () => reject(new Error("Não consegui ler a imagem."));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Arquivo de imagem inválido."));
      img.onload = () => {
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", qualidade));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(file);
  });
}

function diasAtras(n, base = HOJE) {

function nivelDoXp(xp) {
  let atual = NIVEIS[0];
  for (const nv of NIVEIS) if (xp >= nv.xp) atual = nv;
  const proximo = NIVEIS.find(nv => nv.xp > xp) || null;
  const base = atual.xp;
  const teto = proximo ? proximo.xp : atual.xp;
  const faixa = teto - base || 1;
  return {
    ...atual,
    proximo,
    noNivel: xp - base,
    faltam: proximo ? proximo.xp - xp : 0,
    progresso: proximo ? Math.min(100, ((xp - base) / faixa) * 100) : 100,
  };
}

/* Histórico determinístico: índice 0 = hoje, "1" = dia com registro. */
const PADROES_DIAS = {1: "11111111111101111011101101011011010", 2: "11111111111111111111111011110111011", 3: "00010110001000100011000100010001000", 4: "11111011011101100101101101011011000", 5: "00000100000010000001000000100000010"};

function historicoDeDias(pacienteId) {
  const p = PADROES_DIAS[pacienteId] || PADROES_DIAS[1];
  const dias = [];
  for (let i = 0; i < p.length; i++) if (p[i] === "1") dias.push(diasAtras(i));
  return dias;
}

function streakDe(pacienteId) {
  const p = PADROES_DIAS[pacienteId] || PADROES_DIAS[1];
  let s = 0;
  while (s < p.length && p[s] === "1") s++;
  return s;
}

/* Regras de desbloqueio — leem só contadores de hábito e sequência. */
function checarConquistas(g, streak) {
  const c = g.contadores || {};
  const regras = {
    "primeiro-passo":  true,
    "semana-cheia":    streak >= 7,
    "quinzena":        streak >= 15,
    "mes-inteiro":     streak >= 30,
    "hidratada":       (c.agua || 0) >= 10,
    "em-movimento":    (c.movimento || 0) >= 10,
    "diario-fiel":     (c.refeicoes || 0) >= 14,
    "boa-noite":       (c.sono || 0) >= 10,
    "volta-por-cima":  !!g.retomou,
    "parceira":        (c.consultas || 0) >= 5,
    "desafiante":      (c.desafiosDiarios || 0) >= 10,
    "semana-perfeita": DESAFIOS_SEMANAIS.some(d => (g.semanais?.[d.id] || 0) >= d.meta),
  };
  return CONQUISTAS.filter(k => regras[k.id]).map(k => k.id);
}

   lendo os dados que já estão no app. Chamamos de NutriAI na interface,
   mas a tela diz em que se baseia, e nada aqui substitui avaliação
   clínica. Quando/se entrar uma API de verdade, ela entra em
   `nutriaiSugerirDesafios` sem mexer no resto.
   ====================================================================== */

function nutriaiAlertas(appState) {
  const { pacientes, gamificacao, diario, checkins, desafiosCustom } = appState;
  const saida = [];

  pacientes.forEach(p => {
    const g = gamificacao[p.id] || {};
    const streak = streakDe(p.id);
    const regs = diario[p.id] || {};
    const diasComRegistro = Object.values(regs).filter(l => (l || []).length).length;
    const ultimoCheckin = (checkins[p.id] || []).slice(-1)[0];
    const pendentes = (desafiosCustom[p.id] || []).filter(d => d.submissao?.status === "pendente_aprovacao").length;

    if (pendentes > 0)
      saida.push({ pacienteId: p.id, nivel: "acao", titulo: `${pendentes} envio${pendentes > 1 ? "s" : ""} esperando sua aprovação`, motivo: `${p.nome} mandou prova de desafio e ainda não foi avaliada.`, ir: "desafios" });

    if (p.status === "pendente")
      saida.push({ pacienteId: p.id, nivel: "acao", titulo: "Anamnese não confirmada", motivo: `${p.nome} ainda não concluiu o cadastro inicial.` });

    if ((p.adesao || 0) < 50)
      saida.push({ pacienteId: p.id, nivel: "risco", titulo: `Adesão em ${p.adesao}%`, motivo: "Abaixo do mínimo do protocolo há mais de uma semana." });
    else if ((p.adesao || 0) < 70)
      saida.push({ pacienteId: p.id, nivel: "atencao", titulo: `Adesão em ${p.adesao}%`, motivo: "Caiu em relação ao período anterior." });

    if (streak === 0 && diasComRegistro > 0)
      saida.push({ pacienteId: p.id, nivel: "atencao", titulo: "Sequência interrompida", motivo: `${p.nome} parou de registrar. Um contato costuma resolver.` });

    if (ultimoCheckin && ultimoCheckin.energia <= 2)
      saida.push({ pacienteId: p.id, nivel: "atencao", titulo: "Relatou energia baixa", motivo: `No último check-in: “${(ultimoCheckin.nota || "sem observação").slice(0, 90)}”` });

    if (!ultimoCheckin && p.status === "ativo")
      saida.push({ pacienteId: p.id, nivel: "info", titulo: "Nunca fez check-in", motivo: "Vale explicar como funciona o check-in semanal." });
  });

  const ordem = { acao: 0, risco: 1, atencao: 2, info: 3 };
  return saida.sort((a, b) => ordem[a.nivel] - ordem[b.nivel]);
}

function nutriaiResumoPaciente(p, appState) {
  const g = appState.gamificacao[p.id] || {};
  const streak = streakDe(p.id);
  const nv = nivelDoXp(g.xp || 0);
  const regs = (appState.registrosPeso[p.id] || []).slice().sort((a, b) => a.data.localeCompare(b.data));
  const dif = regs.length >= 2 ? regs[regs.length - 1].peso - regs[0].peso : null;
  const cks = appState.checkins[p.id] || [];
  const ultimo = cks.slice(-1)[0];
  const refeicoes = Object.values(appState.diario[p.id] || {}).reduce((s, l) => s + (l || []).length, 0);

  const frases = [];
  frases.push(`${p.nome.split(" ")[0]} está no nível ${nv.n} (${nv.nome}), com ${g.xp || 0} XP acumulados.`);
  frases.push(streak > 0
    ? `Sequência atual de ${streak} dia${streak > 1 ? "s" : ""} de registro.`
    : `A sequência de registros está interrompida no momento.`);
  if (refeicoes) frases.push(`Registrou ${refeicoes} refeição${refeicoes > 1 ? "ões" : ""} no diário.`);
  if (dif != null) frases.push(`Variação de peso desde o primeiro registro: ${dif > 0 ? "+" : ""}${dif.toFixed(1).replace(".", ",")} kg.`);
  if (ultimo) frases.push(`No último check-in marcou energia ${ultimo.energia}/5, sono ${ultimo.sono}/5 e fome ${ultimo.fome}/5.`);
  if (ultimo?.nota) frases.push(`Nas palavras dela: “${ultimo.nota}”`);

  const pontos = [];
  if ((g.contadores?.agua || 0) >= 10) pontos.push("hidratação constante");
  if ((g.contadores?.movimento || 0) >= 10) pontos.push("movimento regular");
  if ((g.contadores?.refeicoes || 0) >= 14) pontos.push("diário bem alimentado");
  const atritos = [];
  if ((g.contadores?.sono || 0) < 5) pontos.length && atritos.push("sono pouco registrado");
  if ((p.adesao || 0) < 70) atritos.push("adesão abaixo do esperado");
  if (streak === 0) atritos.push("sequência interrompida");

  return { frases, pontos, atritos, nivel: nv, streak };
}

function nutriaiSugerirDesafios(p, appState) {
  const g = appState.gamificacao[p.id] || {};
  const c = g.contadores || {};
  const ultimo = (appState.checkins[p.id] || []).slice(-1)[0];
  const sugestoes = [];

  if ((c.agua || 0) < 8)
    sugestoes.push({ titulo: "Foto da garrafa cheia", desc: "Envie uma foto da sua garrafa no começo do dia, por 5 dias.", xp: 40, tipo: "foto", porque: "A hidratação é o hábito com menos marcações registradas." });
  if ((c.movimento || 0) < 8)
    sugestoes.push({ titulo: "Três caminhadas na semana", desc: "Marque aqui quando completar três caminhadas de 20 minutos.", xp: 50, tipo: "checkin", porque: "Movimento aparece pouco no histórico dela." });
  if (ultimo && ultimo.fome >= 4)
    sugestoes.push({ titulo: "Como está a fome à noite?", desc: "Escreva por três dias como você se sentiu depois do jantar.", xp: 40, tipo: "texto", porque: "No último check-in a fome apareceu alta." });
  if (ultimo && ultimo.sono <= 2)
    sugestoes.push({ titulo: "Uma hora sem tela antes de dormir", desc: "Conte como foi tentar isso por três noites.", xp: 40, tipo: "texto", porque: "O sono foi avaliado como ruim no último check-in." });
  if ((c.refeicoes || 0) < 10)
    sugestoes.push({ titulo: "Foto do almoço", desc: "Registre com foto o almoço de três dias diferentes.", xp: 45, tipo: "foto", porque: "O diário ainda tem poucos registros." });
  if (p.objetivo === "Hipertrofia")
    sugestoes.push({ titulo: "Proteína no café da manhã", desc: "Fotografe o café da manhã incluindo uma fonte de proteína, por 4 dias.", xp: 45, tipo: "foto", porque: "Objetivo de hipertrofia com café da manhã pouco proteico é padrão comum." });

  if (sugestoes.length === 0)
    sugestoes.push({ titulo: "Uma receita nova na semana", desc: "Escolha uma receita que você nunca fez e conte como foi.", xp: 40, tipo: "texto", porque: "Os hábitos estão em dia — variedade evita o enjoo que derruba plano." });

  return sugestoes.slice(0, 3);
}

/* ================= ATENDIMENTO ONLINE — CAMADA DE SERVIÇO ==============
   A interface NUNCA fala com uma biblioteca de vídeo direto: fala com este
   adaptador. Hoje existe só a implementação simulada. Para ligar um serviço
   real (Daily, LiveKit, Twilio, Jitsi), escreva outro objeto com os mesmos
   seis métodos e troque a linha do ServicoVideo lá embaixo — nenhum
   componente precisa mudar.

   Contrato:
     conectar(sala, aoEvento) -> Promise
     desconectar()
     definirMicrofone(bool)
     definirCamera(bool)
     definirCompartilhamento(bool)
     enviarMensagem(texto)

   Eventos entregues em aoEvento({ tipo, ... }):
     "estado"   -> { estado: "conectando" | "conectado" | "encerrado" }
     "remoto"   -> { falando: bool }
     "mensagem" -> { de, texto, em }
     "aviso"    -> { texto }
   ====================================================================== */

function criarServicoSimulado() {
  let ouvinte = null;
  let timers = [];
  const limpar = () => { timers.forEach(clearTimeout); timers = []; };
  const agendar = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const emitir = (ev) => { if (ouvinte) ouvinte(ev); };

  const RESPOSTAS = [
    "Consigo te ouvir bem, pode seguir.",
    "Perfeito. Vou anotar isso no prontuário.",
    "Deixa eu abrir o seu plano aqui rapidinho.",
    "Entendi. E como você tem se sentido depois do almoço?",
    "Ótimo. Vamos ajustar isso para a próxima semana.",
  ];

  return {
    nome: "simulado",
    simulado: true,

    conectar(sala, aoEvento) {
      ouvinte = aoEvento;
      emitir({ tipo: "estado", estado: "conectando" });
      agendar(() => {
        emitir({ tipo: "estado", estado: "conectado" });
        emitir({ tipo: "aviso", texto: "Sala simulada — nenhum áudio ou vídeo é transmitido." });
      }, 1400);

      /* Fala intermitente do outro lado, só para a interface ter vida. */
      const pulsar = () => {
        emitir({ tipo: "remoto", falando: true });
        agendar(() => {
          emitir({ tipo: "remoto", falando: false });
          agendar(pulsar, 1200 + Math.random() * 2600);
        }, 900 + Math.random() * 1800);
      };
      agendar(pulsar, 2600);
      return Promise.resolve({ sala });
    },

    desconectar() { limpar(); ouvinte = null; },
    definirMicrofone() {},
    definirCamera() {},
    definirCompartilhamento() {},

    enviarMensagem(texto) {
      agendar(() => emitir({
        tipo: "mensagem",
        de: "remoto",
        texto: RESPOSTAS[Math.floor(Math.random() * RESPOSTAS.length)],
        em: new Date().toISOString().slice(11, 16),
      }), 1500 + Math.random() * 900);
      return true;
    },
  };
}

/* Troque esta linha quando o serviço real entrar. */
const ServicoVideo = criarServicoSimulado();

/* A sala abre 15 minutos antes e fecha 1 hora depois do horário marcado. */
function estadoDaSala(consulta) {
  if (!consulta) return { aberta: false, rotulo: "Sem consulta marcada", tom: "neutro" };
  if (consulta.data > HOJE) return { aberta: false, rotulo: "Ainda não liberada", tom: "neutro" };
  if (consulta.data < HOJE) return { aberta: false, rotulo: "Consulta encerrada", tom: "neutro" };
  if ((consulta.status || "confirmada") === "concluida") return { aberta: false, rotulo: "Já realizada", tom: "neutro" };
  return { aberta: true, rotulo: "Sala aberta", tom: "ok" };
}

/* ========================= ESTADO GLOBAL ================================= */

function useAppState() {
  const [pacientes, setPacientes] = useState(() => storageGet("pacientes", PACIENTES_INIT));
  const [registrosPeso, setRegistrosPeso] = useState(() => storageGet("registros_peso", REGISTROS_PESO_INIT));
  const [consultas, setConsultas] = useState(() => storageGet("consultas", CONSULTAS_INIT));
  const [anamneses, setAnamneses] = useState(() => storageGet("anamneses", ANAMNESE_INIT));
  const [planos, setPlanos] = useState(() => storageGet("planos", PLANOS_INIT));
  const [metas, setMetas] = useState(() => storageGet("metas", METAS_INIT));
  const [gamificacao, setGamificacao] = useState(() => storageGet("gamificacao", GAMIFICACAO_INIT));
  const [desafiosCustom, setDesafiosCustom] = useState(() => storageGet("desafios_custom", DESAFIOS_CUSTOM_INIT));
  const [diario, setDiario] = useState(() => storageGet("diario", DIARIO_INIT));
  const [hidratacao, setHidratacao] = useState(() => storageGet("hidratacao", HIDRATACAO_INIT));
  const [checkins, setCheckins] = useState(() => storageGet("checkins", CHECKINS_INIT));
  const [mensagens, setMensagens] = useState(() => storageGet("mensagens", MENSAGENS_INIT));
  const [notificacoes, setNotificacoes] = useState(() => storageGet("notificacoes", NOTIFICACOES_INIT));
  const [financeiro, setFinanceiro] = useState(() => storageGet("financeiro", FINANCEIRO_INIT_DADOS));
  const [agenda, setAgenda] = useState(() =>
    // compatibilidade: dados salvos antes do campo "status" continuam válidos
    storageGet("agenda", AGENDA_INIT).map(a => ({ status: "confirmada", ...a }))
  );

  useEffect(() => { storageSet("pacientes", pacientes); }, [pacientes]);
  useEffect(() => { storageSet("registros_peso", registrosPeso); }, [registrosPeso]);
  useEffect(() => { storageSet("consultas", consultas); }, [consultas]);
  useEffect(() => { storageSet("anamneses", anamneses); }, [anamneses]);
  useEffect(() => { storageSet("planos", planos); }, [planos]);
  useEffect(() => { storageSet("metas", metas); }, [metas]);
  useEffect(() => { storageSet("agenda", agenda); }, [agenda]);
  useEffect(() => { storageSet("gamificacao", gamificacao); }, [gamificacao]);
  useEffect(() => { storageSet("desafios_custom", desafiosCustom); }, [desafiosCustom]);
  useEffect(() => { storageSet("diario", diario); }, [diario]);
  useEffect(() => { storageSet("hidratacao", hidratacao); }, [hidratacao]);
  useEffect(() => { storageSet("checkins", checkins); }, [checkins]);
  useEffect(() => { storageSet("mensagens", mensagens); }, [mensagens]);
  useEffect(() => { storageSet("notificacoes", notificacoes); }, [notificacoes]);
  useEffect(() => { storageSet("financeiro", financeiro); }, [financeiro]);

  const addPaciente = useCallback((p) => {
    const id = Date.now();
    const novo = { ...p, id, adesao: 0, created: new Date().toISOString().slice(0, 10) };
    setPacientes(prev => [...prev, novo]);
    setRegistrosPeso(prev => ({ ...prev, [id]: [] }));
    setConsultas(prev => ({ ...prev, [id]: [] }));
    setAnamneses(prev => ({ ...prev, [id]: { preenchido: false } }));
    setPlanos(prev => ({ ...prev, [id]: null }));
    setMetas(prev => ({ ...prev, [id]: [] }));
    return id;
  }, []);

  const updatePaciente = useCallback((id, dados) => {
    setPacientes(prev => prev.map(p => p.id === id ? { ...p, ...dados } : p));
  }, []);

  const addRegistroPeso = useCallback((pacId, reg) => {
    setRegistrosPeso(prev => {
      const lista = [...(prev[pacId] || []), { ...reg, id: Date.now() }];
      lista.sort((a, b) => a.data.localeCompare(b.data));
      const ultimo = lista[lista.length - 1];
      updatePaciente(pacId, { peso: ultimo.peso });
      return { ...prev, [pacId]: lista };
    });
  }, [updatePaciente]);

  const addConsulta = useCallback((pacId, c) => {
    setConsultas(prev => ({
      ...prev,
      [pacId]: [...(prev[pacId] || []), { ...c, id: Date.now() }].sort((a, b) => b.data.localeCompare(a.data)),
    }));
  }, []);

  const saveAnamnese = useCallback((pacId, dados) => {
    setAnamneses(prev => ({ ...prev, [pacId]: { ...dados, preenchido: true } }));
  }, []);

  const savePlano = useCallback((pacId, plano) => {
    setPlanos(prev => ({ ...prev, [pacId]: plano }));
  }, []);

  const addMeta = useCallback((pacId, meta) => {
    setMetas(prev => ({
      ...prev,
      [pacId]: [...(prev[pacId] || []), { ...meta, id: Date.now(), concluida: false }],
    }));
  }, []);

  const toggleMeta = useCallback((pacId, metaId) => {
    setMetas(prev => ({
      ...prev,
      [pacId]: (prev[pacId] || []).map(m => m.id === metaId ? { ...m, concluida: !m.concluida } : m),
    }));
  }, []);

  const removeMeta = useCallback((pacId, metaId) => {
    setMetas(prev => ({
      ...prev,
      [pacId]: (prev[pacId] || []).filter(m => m.id !== metaId),
    }));
  }, []);

  const addAgenda = useCallback((item) => {
    setAgenda(prev => [...prev, { ...item, id: Date.now() }]);
  }, []);

  const removeAgenda = useCallback((id) => {
    setAgenda(prev => prev.filter(a => a.id !== id));
  }, []);

  /* ---- Gamificação -----------------------------------------------------
     Toda ação devolve o que aconteceu (XP, nível, conquistas) para a tela
     poder comemorar. Desmarcar um hábito devolve o XP, sem punição extra.
     -------------------------------------------------------------------- */

  const estadoGamificacao = useCallback((pacId) => {
    return gamificacao[pacId] || {
      xp: 0, escudos: 0, contadores: {}, habitosHoje: {}, desafiosHoje: [],
      semanais: {}, conquistas: [],
    };
  }, [gamificacao]);

  const alternarHabito = useCallback((pacId, habitoId) => {
    const h = HABITOS.find(x => x.id === habitoId);
    if (!h) return null;
    const antes = gamificacao[pacId] || { xp: 0, contadores: {}, habitosHoje: {}, conquistas: [] };
    const marcado = !antes.habitosHoje?.[habitoId];
    const xpNovo = Math.max(0, (antes.xp || 0) + (marcado ? h.xp : -h.xp));
    const contadores = { ...(antes.contadores || {}) };
    contadores[habitoId] = Math.max(0, (contadores[habitoId] || 0) + (marcado ? 1 : -1));

    const depois = {
      ...antes,
      xp: xpNovo,
      contadores,
      habitosHoje: { ...(antes.habitosHoje || {}), [habitoId]: marcado },
    };
    const streak = streakDe(pacId);
    const desbloqueadas = checarConquistas(depois, streak);
    const novas = desbloqueadas.filter(id => !(antes.conquistas || []).includes(id));
    depois.conquistas = Array.from(new Set([...(antes.conquistas || []), ...desbloqueadas]));

    setGamificacao(prev => ({ ...prev, [pacId]: depois }));

    return {
      marcado,
      xpGanho: marcado ? h.xp : -h.xp,
      subiuNivel: marcado && nivelDoXp(xpNovo).n > nivelDoXp(antes.xp || 0).n ? nivelDoXp(xpNovo) : null,
      novasConquistas: novas.map(id => CONQUISTAS.find(c => c.id === id)).filter(Boolean),
    };
  }, [gamificacao]);

  const concluirDesafio = useCallback((pacId, desafioId) => {
    const d = DESAFIOS_DIARIOS.find(x => x.id === desafioId);
    if (!d) return null;
    const antes = gamificacao[pacId] || { xp: 0, contadores: {}, desafiosHoje: [], conquistas: [] };
    if ((antes.desafiosHoje || []).includes(desafioId)) return null;

    const xpNovo = (antes.xp || 0) + d.xp;
    const contadores = { ...(antes.contadores || {}) };
    contadores.desafiosDiarios = (contadores.desafiosDiarios || 0) + 1;

    const depois = {
      ...antes,
      xp: xpNovo,
      contadores,
      desafiosHoje: [...(antes.desafiosHoje || []), desafioId],
    };
    const desbloqueadas = checarConquistas(depois, streakDe(pacId));
    const novas = desbloqueadas.filter(id => !(antes.conquistas || []).includes(id));
    depois.conquistas = Array.from(new Set([...(antes.conquistas || []), ...desbloqueadas]));

    setGamificacao(prev => ({ ...prev, [pacId]: depois }));

    return {
      xpGanho: d.xp,
      subiuNivel: nivelDoXp(xpNovo).n > nivelDoXp(antes.xp || 0).n ? nivelDoXp(xpNovo) : null,
      novasConquistas: novas.map(id => CONQUISTAS.find(c => c.id === id)).filter(Boolean),
    };
  }, [gamificacao]);

  /* ---------------------------------------------------------------------
     MOTOR CENTRAL DE PROGRESSO
     Todo ganho de XP do app passa por aqui — refeição registrada, água,
     meta, desafio diário, desafio da nutricionista, check-in. É isso que
     faz uma ação feita em qualquer tela aparecer no nível, na jornada e
     nas conquistas de todas as outras. Devolve sempre o mesmo formato de
     evento, para a tela poder comemorar.
     --------------------------------------------------------------------- */
  const aplicarGanho = useCallback((pacId, { xp = 0, contadores = {}, habitos = {}, semanais = {}, extras = {} }) => {
    const antes = gamificacao[pacId] || { xp: 0, contadores: {}, habitosHoje: {}, desafiosHoje: [], semanais: {}, conquistas: [] };

    const novosContadores = { ...(antes.contadores || {}) };
    Object.entries(contadores).forEach(([k, v]) => {
      novosContadores[k] = Math.max(0, (novosContadores[k] || 0) + v);
    });
    const novosSemanais = { ...(antes.semanais || {}) };
    Object.entries(semanais).forEach(([k, v]) => {
      novosSemanais[k] = Math.max(0, (novosSemanais[k] || 0) + v);
    });

    const xpNovo = Math.max(0, (antes.xp || 0) + xp);
    const depois = {
      ...antes, ...extras,
      xp: xpNovo,
      contadores: novosContadores,
      semanais: novosSemanais,
      habitosHoje: { ...(antes.habitosHoje || {}), ...habitos },
    };

    const desbloqueadas = checarConquistas(depois, streakDe(pacId));
    const novas = desbloqueadas.filter(id => !(antes.conquistas || []).includes(id));
    depois.conquistas = Array.from(new Set([...(antes.conquistas || []), ...desbloqueadas]));

    setGamificacao(prev => ({ ...prev, [pacId]: depois }));

    return {
      xpGanho: xp,
      subiuNivel: xp > 0 && nivelDoXp(xpNovo).n > nivelDoXp(antes.xp || 0).n ? nivelDoXp(xpNovo) : null,
      novasConquistas: novas.map(id => CONQUISTAS.find(c => c.id === id)).filter(Boolean),
    };
  }, [gamificacao]);

  const notificar = useCallback((pacId, n) => {
    setNotificacoes(prev => ({
      ...prev,
      [pacId]: [{ id: Date.now() + Math.floor(Math.random() * 999), em: new Date().toISOString().slice(0, 16), lida: false, ...n }, ...(prev[pacId] || [])],
    }));
  }, []);

  /* ---- Diário alimentar ---- */
  const addRefeicao = useCallback((pacId, dia, refeicao) => {
    const nova = { id: Date.now(), foto: "", nota: "", ...refeicao };
    const primeiraDoDia = ((diario[pacId] || {})[dia] || []).length === 0;
    setDiario(prev => {
      const doPac = prev[pacId] || {};
      return { ...prev, [pacId]: { ...doPac, [dia]: [...(doPac[dia] || []), nova].sort((a, b) => a.hora.localeCompare(b.hora)) } };
    });
    return aplicarGanho(pacId, {
      xp: XP_REFEICAO,
      contadores: primeiraDoDia ? { refeicoes: 1 } : {},
      habitos: primeiraDoDia ? { refeicoes: true } : {},
    });
  }, [diario, aplicarGanho]);

  const removerRefeicao = useCallback((pacId, dia, id) => {
    setDiario(prev => {
      const doPac = prev[pacId] || {};
      return { ...prev, [pacId]: { ...doPac, [dia]: (doPac[dia] || []).filter(r => r.id !== id) } };
    });
  }, []);

  /* ---- Hidratação: XP só quando fecha a meta do dia ---- */
  const definirCopos = useCallback((pacId, dia, copos) => {
    const antes = (hidratacao[pacId] || {})[dia] || 0;
    const valor = Math.max(0, Math.min(16, copos));
    setHidratacao(prev => ({ ...prev, [pacId]: { ...(prev[pacId] || {}), [dia]: valor } }));
    if (antes < META_COPOS && valor >= META_COPOS)
      return aplicarGanho(pacId, { xp: XP_AGUA_META, contadores: { agua: 1 }, habitos: { agua: true } });
    if (antes >= META_COPOS && valor < META_COPOS)
      return aplicarGanho(pacId, { xp: -XP_AGUA_META, contadores: { agua: -1 }, habitos: { agua: false } });
    return null;
  }, [hidratacao, aplicarGanho]);

  /* ---- Metas: mesmo XP para toda categoria, para nenhuma "pagar mais" ---- */
  const concluirMeta = useCallback((pacId, metaId) => {
    const meta = (metas[pacId] || []).find(m => m.id === metaId);
    if (!meta) return null;
    const virandoFeita = !meta.concluida;
    setMetas(prev => ({
      ...prev,
      [pacId]: (prev[pacId] || []).map(m => m.id === metaId ? { ...m, concluida: !m.concluida } : m),
    }));
    if (!virandoFeita) return aplicarGanho(pacId, { xp: -XP_META_CONCLUIDA, contadores: { metas: -1 } });
    notificar(pacId, { tipo: "meta", titulo: "Meta concluída", texto: meta.desc, ir: "metas" });
    toast("Meta concluída", "ok", `+${XP_META_CONCLUIDA} XP · ${meta.desc}`);
    return aplicarGanho(pacId, { xp: XP_META_CONCLUIDA, contadores: { metas: 1 } });
  }, [metas, aplicarGanho, notificar]);

  /* ---- Check-in semanal: também alimenta o histórico clínico ---- */
  const addCheckin = useCallback((pacId, dados) => {
    setCheckins(prev => ({ ...prev, [pacId]: [...(prev[pacId] || []), dados] }));
    if (dados.peso) {
      setRegistrosPeso(prev => ({
        ...prev,
        [pacId]: [...(prev[pacId] || []), { data: dados.data, peso: dados.peso, cintura: dados.cintura || null }],
      }));
      setPacientes(prev => prev.map(p => p.id === pacId ? { ...p, peso: dados.peso } : p));
    }
    notificar(pacId, { tipo: "checkin", titulo: "Check-in enviado", texto: "A Dra. Letícia recebe o seu resumo da semana.", ir: "evolucao" });
    toast("Check-in enviado", "ok", `+${XP_CHECKIN} XP`);
    return aplicarGanho(pacId, { xp: XP_CHECKIN, semanais: { "s-registro": 1 } });
  }, [aplicarGanho, notificar]);

  /* ---- Mensagens ---- */
  const enviarMensagem = useCallback((pacId, texto) => {
    setMensagens(prev => ({
      ...prev,
      [pacId]: [...(prev[pacId] || []), { id: Date.now(), de: "paciente", texto, em: new Date().toISOString().slice(0, 16) }],
    }));
  }, []);

  const responderAutomatico = useCallback((pacId) => {
    const texto = RESPOSTAS_MOCK[Math.floor(Math.random() * RESPOSTAS_MOCK.length)];
    setMensagens(prev => ({
      ...prev,
      [pacId]: [...(prev[pacId] || []), { id: Date.now() + 1, de: "nutri", texto, em: new Date().toISOString().slice(0, 16) }],
    }));
    notificar(pacId, { tipo: "mensagem", titulo: "Nova mensagem", texto: "A Dra. Letícia respondeu você.", ir: "mensagens" });
  }, [notificar]);

  /* ---- Notificações ---- */
  const lerNotificacao = useCallback((pacId, id) => {
    setNotificacoes(prev => {
      const lista = prev[pacId] || [];
      const existe = lista.some(n => n.id === id);
      return {
        ...prev,
        [pacId]: existe
          ? lista.map(n => n.id === id ? { ...n, lida: true } : n)
          : [...lista, { id, lida: true }],   /* alerta derivado: guarda só a marca de lido */
      };
    });
  }, []);
  const lerTodasNotificacoes = useCallback((pacId, ids) => {
    setNotificacoes(prev => {
      const lista = (prev[pacId] || []).map(n => ({ ...n, lida: true }));
      const conhecidos = new Set(lista.map(n => n.id));
      const extras = (ids || []).filter(i => !conhecidos.has(i)).map(i => ({ id: i, lida: true }));
      return { ...prev, [pacId]: [...lista, ...extras] };
    });
  }, []);

  /* ---- Desafios personalizados ----------------------------------------- */

  const addDesafioCustom = useCallback((pacId, desafio) => {
    const novo = { ...desafio, id: "dc-" + Date.now(), criado: new Date().toISOString().slice(0, 10), submissao: null, ativo: true };
    setDesafiosCustom(prev => ({ ...prev, [pacId]: [...(prev[pacId] || []), novo] }));
  }, []);

  const submitDesafioCustom = useCallback((pacId, desafioId, submissao) => {
    // submissao: { tipo, texto?, fotoBase64?, data, status: "pendente_aprovacao" }
    setDesafiosCustom(prev => ({
      ...prev,
      [pacId]: (prev[pacId] || []).map(d =>
        d.id === desafioId ? { ...d, submissao: { ...submissao, data: new Date().toISOString().slice(0, 10), status: "pendente_aprovacao" } } : d
      ),
    }));
  }, []);

  const aprovarDesafioCustom = useCallback((pacId, desafioId) => {
    let xpGanho = 0;
    setDesafiosCustom(prev => {
      const desafio = (prev[pacId] || []).find(d => d.id === desafioId);
      xpGanho = desafio?.xp || 0;
      return {
        ...prev,
        [pacId]: (prev[pacId] || []).map(d =>
          d.id === desafioId ? { ...d, submissao: { ...d.submissao, status: "aprovado" } } : d
        ),
      };
    });
    /* XP pelo motor central: assim a aprovação também acende conquista,
       nível e jornada, igual a qualquer outra ação do app. */
    if (xpGanho > 0) {
      aplicarGanho(pacId, { xp: xpGanho, contadores: { desafiosDiarios: 1 } });
      notificar(pacId, { tipo: "conquista", titulo: "Desafio aprovado", texto: `A Dra. Letícia aprovou seu envio. +${xpGanho} XP`, ir: "desafios" });
    }
    return xpGanho;
  }, [aplicarGanho, notificar]);

  const rejeitarDesafioCustom = useCallback((pacId, desafioId) => {
    setDesafiosCustom(prev => ({
      ...prev,
      [pacId]: (prev[pacId] || []).map(d =>
        d.id === desafioId ? { ...d, submissao: { ...d.submissao, status: "rejeitado" } } : d
      ),
    }));
  }, []);

  const removeDesafioCustom = useCallback((pacId, desafioId) => {
    setDesafiosCustom(prev => ({
      ...prev,
      [pacId]: (prev[pacId] || []).filter(d => d.id !== desafioId),
    }));
  }, []);

  return {
    pacientes, registrosPeso, consultas, anamneses, planos, metas, agenda,
    gamificacao, desafiosCustom,
    diario, hidratacao, checkins, mensagens, notificacoes, financeiro,
    addPaciente, updatePaciente, addRegistroPeso, addConsulta,
    saveAnamnese, savePlano, addMeta, toggleMeta, removeMeta, addAgenda, removeAgenda,
    estadoGamificacao, alternarHabito, concluirDesafio,
    addDesafioCustom, submitDesafioCustom, aprovarDesafioCustom, rejeitarDesafioCustom, removeDesafioCustom,
    aplicarGanho, notificar, addRefeicao, removerRefeicao, definirCopos, concluirMeta,
    addCheckin, enviarMensagem, responderAutomatico, lerNotificacao, lerTodasNotificacoes,
    marcarCobranca: (id, status) => setFinanceiro(f => ({ ...f, cobrancas: f.cobrancas.map(c => c.id === id ? { ...c, status } : c) })),
    responderComoNutri: (pacId, texto) => {
      setMensagens(prev => ({ ...prev, [pacId]: [...(prev[pacId] || []), { id: Date.now(), de: "nutri", texto, em: new Date().toISOString().slice(0, 16) }] }));
      setNotificacoes(prev => ({ ...prev, [pacId]: [{ id: Date.now() + 1, tipo: "mensagem", titulo: "Nova mensagem", texto: "A Dra. Letícia respondeu você.", em: new Date().toISOString().slice(0, 16), lida: false, ir: "mensagens" }, ...(prev[pacId] || [])] }));
    },
  };
}

/* ========================= GROWTH RING =================================== */

function GrowthRing({ value = 70, size = 56, stroke = 4, children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (value / 100) * c;
  const tone = value >= 70 ? "var(--primary)" : value >= 40 ? "var(--accent)" : "var(--danger)";
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} stroke="var(--border)" strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={tone} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset .6s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        {children}
      </div>
    </div>
  );
}

function Avatar({ nome, size = 56, ring }) {
  const iniciais = nome.split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const inner = (
    <div style={{
      width: size - (ring != null ? 10 : 0), height: size - (ring != null ? 10 : 0), borderRadius: "50%",
      background: "linear-gradient(145deg, var(--primary-soft), var(--primary))",
      color: "#fff", display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: "var(--font-display)", fontWeight: 600, fontSize: size * 0.32,
    }}>{iniciais}</div>
  );
  if (ring == null) return <div style={{ width: size, height: size, display:"flex", alignItems:"center", justifyContent:"center" }}>{inner}</div>;
  return <GrowthRing value={ring} size={size}>{inner}</GrowthRing>;
}
