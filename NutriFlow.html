}

/* ================= TELAS DO PACIENTE ==================================== */

/* =======================================================================
   HOME DO PACIENTE
   -----------------------------------------------------------------------
   Ordem pensada para o celular, de cima para baixo:
   quem você é hoje (saudação, nível, XP, sequência) → números rápidos →
   a única coisa a fazer agora (desafio do dia) → hábitos → água e diário →
   metas → consulta, plano e conversa → conquistas.

   Nada aqui inventa dado novo: tudo já vinha do useJornada e do appState.
   ======================================================================= */
function JornadaPaciente({ paciente, appState, setActive }) {
  const pacId = paciente?.id || 1;
  const j = useJornada(appState, pacId);
  const [modal, setModal] = useState(false);
  const abrirRegistro = useCallback(() => setModal(true), []);
  useRegistroRapido(abrirRegistro);

  const nv = j.nivel;
  const primeiro = (paciente?.nome || "").split(" ")[0];
  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  const feitos = HABITOS.filter(h => j.g.habitosHoje?.[h.id]).length;
  const pctDia = Math.round((feitos / HABITOS.length) * 100);
  const escudos = j.g.escudos || 0;

  const metasAbertas = j.metas.filter(m => !m.concluida);
  const feitasHoje = j.g.desafiosHoje || [];

  /* Desafio do dia: o da nutricionista vem primeiro; depois o diário que
     ainda estiver aberto; se não sobrou nada, vira cartão de "feito". */
  const custom = (appState.desafiosCustom[pacId] || []).filter(d => d.ativo && !d.submissao);
  const desafioNutri = custom[0] || null;
  const desafioDoDia = DESAFIOS_DIARIOS.find(d => !feitasHoje.includes(d.id)) || null;

  const proxima = (appState.agenda || [])
    .filter(a => a.pacienteId === pacId && a.data >= HOJE)
    .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora))[0];

  /* Próxima refeição do plano, pela hora do relógio. Depois da última,
     volta para a primeira do dia seguinte. */
  const refeicoesPlano = j.plano?.refeicoes || [];
  const agora = new Date().toTimeString().slice(0, 5);
  const proximaRefeicao = refeicoesPlano.find(r => (r.horario || "") >= agora) || refeicoesPlano[0] || null;
  const viraDia = !!(refeicoesPlano.length && !refeicoesPlano.find(r => (r.horario || "") >= agora));

  const ultimaMsg = j.conversas[j.conversas.length - 1];
  const dataCurta = new Date(HOJE + "T12:00:00")
    .toLocaleDateString("pt-BR", { day: "numeric", month: "long" });

  const raio = 34;
  const volta = 2 * Math.PI * raio;

  return (
    <div className="nf-cascata" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Celebracao evento={j.festa} onClose={j.fecharFesta} />

      {/* ---------- 1. Quem você é hoje ---------- */}
      <div className="nf-card nf-hero">
        <div className="nf-hero-linha">
          <div className="nf-hero-anel">
            <svg width="100%" height="100%" viewBox="0 0 76 76" aria-hidden="true">
              <circle cx="38" cy="38" r={raio} fill="none" stroke="rgba(255,255,255,.18)" strokeWidth="5" />
              <circle
                cx="38" cy="38" r={raio} fill="none" stroke="#EBCE84" strokeWidth="5" strokeLinecap="round"
                strokeDasharray={volta} strokeDashoffset={volta * (1 - nv.progresso / 100)}
                style={{ transition: "stroke-dashoffset .9s cubic-bezier(.32,.72,0,1)" }}
              />
            </svg>
            <span style={{ position: "relative", textAlign: "center" }}>
              <span className="nf-hero-anel-n">{nv.n}</span>
              <span className="nf-hero-anel-rot">NÍVEL</span>
            </span>
          </div>
          <div style={{ minWidth: 0, flex: 1 }}>
            <p className="nf-hero-sauda">{saudacao} · {dataCurta}</p>
            <h2 className="nf-hero-nome">Oi, {primeiro}.</h2>
            <p className="nf-hero-frase">Você é {nv.nome} — {nv.frase.toLowerCase()}</p>
          </div>
        </div>

        <div className="nf-hero-xp">
          <div className="nf-hero-xp-topo">
            <span className="nf-hero-xp-nivel">{nv.nome}</span>
            <span className="nf-hero-xp-valor">{j.g.xp} XP</span>
          </div>
          <div className="nf-hero-trilho">
            <span className="nf-hero-preenche" style={{ width: nv.progresso + "%" }} />
          </div>
          <p className="nf-hero-falta">
            {nv.proximo ? `Faltam ${nv.faltam} XP para ${nv.proximo.nome}` : "Você chegou ao topo da trilha."}
          </p>
        </div>

        <div className="nf-chama">
          <span className="nf-chama-fogo"><IconFlame width={17} height={17} /></span>
          <b>{j.streak}</b>
          <span>{j.streak === 1 ? "dia seguido" : "dias seguidos"}</span>
          {escudos > 0 && <span>· {escudos} escudo{escudos > 1 ? "s" : ""} guardado{escudos > 1 ? "s" : ""}</span>}
        </div>

        <button className="nf-hero-passos nf-focus" onClick={() => setActive("jornada")} aria-label="Ver a trilha completa">
          {NIVEIS.map(n => (
            <span key={n.n} className={`nf-hero-passo ${n.n < nv.n ? "on" : ""} ${n.n === nv.n ? "atual" : ""}`} />
          ))}
        </button>
      </div>

      {/* ---------- 2. Números rápidos ---------- */}
      <div className="nf-atalhos">
        <AtalhoRapido icone={IconFlame}  titulo="Sequência" valor={`${j.streak} dias`} onClick={() => setActive("jornada")} />
        <AtalhoRapido icone={IconDrop}   titulo="Água"      valor={`${j.copos}/${META_COPOS}`} onClick={() => setActive("diario")} />
        <AtalhoRapido icone={IconFood}   titulo="Refeições" valor={`${j.refeicoesHoje.length} hoje`} onClick={() => setActive("diario")} />
        <AtalhoRapido icone={IconTarget} titulo="Metas"     valor={metasAbertas.length ? `${metasAbertas.length} abertas` : "em dia"} onClick={() => setActive("metas")} />
      </div>

      {/* ---------- 3. Desafio do dia ---------- */}
      {desafioNutri ? (
        <div className="nf-card nf-destaque">
          <span className="nf-destaque-tag"><IconSpark width={13} height={13} />Da Dra. Letícia</span>
          <p className="nf-destaque-titulo">{desafioNutri.titulo}</p>
          <p className="nf-destaque-desc">{desafioNutri.desc}</p>
          <div className="nf-destaque-pe">
            <button onClick={() => setActive("desafios")} className="nf-btn nf-btn-primary nf-focus">
              Responder · +{desafioNutri.xp} XP
            </button>
            {custom.length > 1 && (
              <span style={{ fontSize: 12.5, color: "var(--ink-faint)" }}>
                +{custom.length - 1} esperando você
              </span>
            )}
          </div>
        </div>
      ) : desafioDoDia ? (
        <div className="nf-card nf-destaque">
          <span className="nf-destaque-tag"><IconTrophy width={13} height={13} />Desafio do dia</span>
          <p className="nf-destaque-titulo">{desafioDoDia.titulo}</p>
          <p className="nf-destaque-desc">{desafioDoDia.desc}</p>
          <div className="nf-destaque-pe">
            <button onClick={() => j.concluir(desafioDoDia.id)} className="nf-btn nf-btn-primary nf-focus">
              Marcar como feito · +{desafioDoDia.xp} XP
            </button>
            <button onClick={() => setActive("desafios")} className="nf-verlink">Ver todos</button>
          </div>
        </div>
      ) : (
        <div className="nf-card nf-destaque feito">
          <span className="nf-destaque-tag"><IconCheck width={13} height={13} />Desafios do dia</span>
          <p className="nf-destaque-titulo">Tudo feito por hoje.</p>
          <p className="nf-destaque-desc">
            {feitasHoje.length} desafio{feitasHoje.length > 1 ? "s" : ""} concluído{feitasHoje.length > 1 ? "s" : ""}.
            As missões da semana continuam correndo.
          </p>
          <div className="nf-destaque-pe">
            <button onClick={() => setActive("desafios")} className="nf-btn nf-btn-ghost nf-focus">Ver as missões da semana</button>
          </div>
        </div>
      )}

      {/* ---------- 4. Hábitos de hoje ---------- */}
      <div className="nf-card" style={{ padding: 20 }}>
        <div className="nf-secao">
          <div style={{ minWidth: 0 }}>
            <h3>Hoje</h3>
            <p className="nf-secao-sub">{feitos} de {HABITOS.length} marcados</p>
          </div>
          <span style={{ fontFamily: "var(--font-display)", fontSize: 19, fontWeight: 600, color: pctDia === 100 ? "var(--primary)" : "var(--ink-faint)" }}>
            {pctDia}%
          </span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {HABITOS.map(h => (
            <HabitoLinha key={h.id} habito={h} marcado={!!j.g.habitosHoje?.[h.id]} onToggle={() => j.marcar(h.id)} />
          ))}
        </div>
        <div className="nf-barra-dia"><i style={{ width: pctDia + "%" }} /></div>
      </div>

      {/* ---------- 5. Água e diário ---------- */}
      <div className="nf-grid-2">
        <div className="nf-card" style={{ padding: 20 }}>
          <div className="nf-secao">
            <div><h3>Hidratação</h3><p className="nf-secao-sub">Meta de {META_COPOS} copos</p></div>
          </div>
          <CoposDeAgua copos={j.copos} onMudar={j.beber} />
        </div>

        <div className="nf-card" style={{ padding: 20 }}>
          <div className="nf-secao">
            <div><h3>Diário</h3><p className="nf-secao-sub">{j.refeicoesHoje.length ? `${j.refeicoesHoje.length} registro${j.refeicoesHoje.length > 1 ? "s" : ""} hoje` : "Nada anotado ainda"}</p></div>
            <button onClick={() => setModal(true)} className="nf-btn nf-btn-primary nf-focus" style={{ padding: "7px 12px", fontSize: 13 }}>
              <IconPlus width={14} height={14} />Registrar
            </button>
          </div>
          {j.refeicoesHoje.length === 0 ? (
            <p style={{ fontSize: 13.5, color: "var(--ink-faint)", lineHeight: 1.5, padding: "4px 0" }}>
              Anote do seu jeito — não precisa pesar nem contar nada.
            </p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {j.refeicoesHoje.slice(0, 3).map(r => <RefeicaoItem key={r.id} refeicao={r} />)}
              {j.refeicoesHoje.length > 3 && (
                <button onClick={() => setActive("diario")} className="nf-verlink" style={{ textAlign: "left" }}>
                  Ver o diário completo
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ---------- 6. Metas ---------- */}
      <div className="nf-card" style={{ padding: 20 }}>
        <div className="nf-secao">
          <div>
            <h3>Suas metas</h3>
            <p className="nf-secao-sub">
              {metasAbertas.length ? `${metasAbertas.length} aberta${metasAbertas.length > 1 ? "s" : ""} · combinadas na consulta` : "Nenhuma meta aberta agora"}
            </p>
          </div>
          <button onClick={() => setActive("metas")} className="nf-verlink">Ver todas</button>
        </div>
        {metasAbertas.length === 0 ? (
          <p style={{ fontSize: 13.5, color: "var(--ink-faint)", lineHeight: 1.5 }}>
            Na próxima consulta vocês definem os próximos passos juntas.
          </p>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {metasAbertas.slice(0, 2).map(m => (
              <button key={m.id} onClick={() => j.alternarMeta(m.id)} className="nf-linha-toque nf-focus">
                <span className="nf-linha-marca" />
                <span style={{ minWidth: 0, flex: 1 }}>
                  <span className="nf-linha-titulo">{m.desc}</span>
                  <span className="nf-linha-sub">
                    até {new Date(m.prazo + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "long" })}
                  </span>
                </span>
                <span className="nf-meta-xp">+{XP_META_CONCLUIDA} XP</span>
              </button>
            ))}
          </div>
        )}
      </div>

      {/* ---------- 7. Consulta, plano e conversa ---------- */}
      <div className="nf-card" style={{ padding: 20 }}>
        <div className="nf-secao"><div><h3>Seu acompanhamento</h3></div></div>
        <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
          <button onClick={() => setActive("agenda")} className="nf-linha-toque nf-focus">
            <span className="nf-linha-icone ouro"><IconCalendar width={17} height={17} /></span>
            <span style={{ minWidth: 0, flex: 1 }}>
              <span className="nf-linha-titulo">
                {proxima
                  ? (proxima.data === HOJE
                      ? "Consulta hoje"
                      : `Consulta em ${new Date(proxima.data + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "long" })}`)
                  : "Sem consulta marcada"}
              </span>
              <span className="nf-linha-sub">
                {proxima ? `${proxima.hora} · ${proxima.tipo} com a Dra. Letícia` : "Combine o retorno pela agenda"}
              </span>
            </span>
            <IconChevron width={15} height={15} style={{ color: "var(--ink-faint)", flexShrink: 0 }} />
          </button>

          <button onClick={() => setActive("planos")} className="nf-linha-toque nf-focus">
            <span className="nf-linha-icone"><IconFood width={17} height={17} /></span>
            <span style={{ minWidth: 0, flex: 1 }}>
              <span className="nf-linha-titulo">
                {proximaRefeicao
                  ? `${viraDia ? "Amanhã" : "A seguir"}: ${proximaRefeicao.nome} · ${proximaRefeicao.horario}`
                  : "Plano alimentar"}
              </span>
              <span className="nf-linha-sub">
                {proximaRefeicao ? proximaRefeicao.alimentos : "Assim que a Dra. Letícia liberar, ele aparece aqui."}
              </span>
            </span>
            <IconChevron width={15} height={15} style={{ color: "var(--ink-faint)", flexShrink: 0 }} />
          </button>

          <button onClick={() => setActive("mensagens")} className="nf-linha-toque nf-focus">
            <span className="nf-linha-icone"><IconMessage width={17} height={17} /></span>
            <span style={{ minWidth: 0, flex: 1 }}>
              <span className="nf-linha-titulo">Conversa com a Dra. Letícia</span>
              <span className="nf-linha-sub" style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {ultimaMsg ? (ultimaMsg.de === "nutri" ? ultimaMsg.texto : "Você: " + ultimaMsg.texto) : "Mande uma dúvida quando precisar"}
              </span>
            </span>
            <IconChevron width={15} height={15} style={{ color: "var(--ink-faint)", flexShrink: 0 }} />
          </button>
        </div>
      </div>

      {/* ---------- 8. Conquistas ---------- */}
      <div className="nf-card" style={{ padding: 20 }}>
        <div className="nf-secao">
          <div>
            <h3>Conquistas</h3>
            <p className="nf-secao-sub">{(j.g.conquistas || []).length} de {CONQUISTAS.length}</p>
          </div>
          <button onClick={() => setActive("jornada")} className="nf-verlink">Ver a trilha</button>
        </div>
        <div className="nf-badges">
          {CONQUISTAS.slice(0, 4).map(c => <BadgeItem key={c.id} conquista={c} ganha={(j.g.conquistas || []).includes(c.id)} />)}
        </div>
      </div>

      <p className="nf-nota-peso">
        Os pontos vêm do que você faz, não do que a balança diz. Peso é conversa de
        consulta, com a Dra. Letícia.
      </p>

      {modal && <ModalRefeicao onClose={() => setModal(false)} onSalvar={j.registrarRefeicao} />}
    </div>
  );
}

function TrilhaPaciente({ paciente, appState }) {
  const j = useJornada(appState, paciente?.id || 1);
  const ganhas = j.g.conquistas || [];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <Celebracao evento={j.festa} onClose={j.fecharFesta} />
      <div className="nf-card" style={{ padding: 22 }}>
        <p className="nf-eyebrow" style={{ marginBottom: 6 }}>Onde você está</p>
        <h2 className="nf-h1" style={{ fontSize: 21, marginBottom: 18 }}>A trilha inteira</h2>
        <TrilhaNiveis xp={j.g.xp} />
      </div>
      <div className="nf-card" style={{ padding: 22 }}>
        <div style={{ marginBottom: 16 }}>
          <h3 className="nf-h1" style={{ fontSize: 17 }}>Todas as conquistas</h3>
          <p style={{ fontSize: 12.5, color: "var(--ink-faint)", marginTop: 2 }}>
            {ganhas.length} de {CONQUISTAS.length} — as bloqueadas mostram como conseguir
          </p>
        </div>
        <div className="nf-badges">
          {CONQUISTAS.map(c => <BadgeItem key={c.id} conquista={c} ganha={ganhas.includes(c.id)} />)}
        </div>
      </div>
    </div>
  );
}

/* ========================= DESAFIO CUSTOM CARD (PACIENTE) ================ */

function DesafioCustomCard({ desafio, pacienteId, appState }) {
  const [expandido, setExpandido] = useState(false);
  const [fotoBase64, setFotoBase64] = useState(null);
  const [fotoPreview, setFotoPreview] = useState(null);
  const [texto, setTexto] = useState("");
  const [enviando, setEnviando] = useState(false);
  const { submissao, tipo } = desafio;
  const status = submissao?.status || null;

  async function handleFoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const reduzida = await comprimirImagem(file);
      setFotoBase64(reduzida);
      setFotoPreview(reduzida);
    } catch (err) {
      console.warn(err);
    }
  }

  function enviar() {
    setEnviando(true);
    const sub = tipo === "foto"
      ? { tipo: "foto", fotoBase64 }
      : tipo === "texto"
      ? { tipo: "texto", texto }
      : { tipo: "checkin" };
    appState.submitDesafioCustom(pacienteId, desafio.id, sub);
    setEnviando(false);
    setExpandido(false);
  }

  const tipoLabel = { foto: "Foto", texto: "Texto", checkin: "Check-in" }[tipo];
  const TipoIcon = { foto: IconCamera, texto: IconTextDoc, checkin: IconCheck }[tipo];

  const chipStatus = status === "aprovado"
    ? <span className="nf-status-chip nf-status-aprovado"><IconCheck width={11} height={11} />Aprovado · +{desafio.xp} XP</span>
    : status === "pendente_aprovacao"
    ? <span className="nf-status-chip nf-status-pendente"><IconHourglass width={11} height={11} />Aguardando aprovação</span>
    : status === "rejeitado"
    ? <span className="nf-status-chip nf-status-rejeitado"><IconX width={11} height={11} />Não aprovado — tente novamente</span>
    : null;

  const podeConcluir = !status || status === "rejeitado";

  return (
    <div className={`nf-desafio-custom ${status || ""}`}>
      <div className="nf-desafio-custom-head">
        <span className={`nf-desafio-custom-tipo ${tipo}`}><TipoIcon width={17} height={17} /></span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <p style={{ fontWeight: 700, fontSize: 14.5 }}>{desafio.titulo}</p>
            {chipStatus}
          </div>
          <p style={{ fontSize: 12.5, color: "var(--ink-faint)", marginTop: 3 }}>{desafio.desc}</p>
          <p style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--primary)", marginTop: 5, fontWeight: 600 }}>+{desafio.xp} XP · {tipoLabel}</p>
        </div>
        {status === "pendente_aprovacao" ? null : podeConcluir && (
          <button
            onClick={() => { if (tipo === "checkin") enviar(); else setExpandido(e => !e); }}
            className="nf-btn nf-btn-primary nf-btn-sm nf-focus"
            style={{ flexShrink: 0, alignSelf: "flex-start" }}
          >
            {tipo === "checkin" ? "Check-in" : expandido ? "Fechar" : "Responder"}
          </button>
        )}
      </div>

      {/* Foto enviada em aprovação — mostra miniatura */}
      {status === "pendente_aprovacao" && tipo === "foto" && submissao?.fotoBase64 && (
        <div style={{ padding: "0 16px 14px" }}>
          <img src={submissao.fotoBase64} alt="Foto enviada" style={{ width: "100%", maxHeight: 180, objectFit: "cover", borderRadius: 10 }} />
        </div>
      )}

      {/* Texto enviado em aprovação */}
      {status === "pendente_aprovacao" && tipo === "texto" && submissao?.texto && (
        <div style={{ padding: "0 16px 14px" }}>
          <div style={{ background: "var(--surface-2)", borderRadius: 10, padding: "10px 14px", fontSize: 13.5, color: "var(--ink-soft)", lineHeight: 1.6 }}>
            "{submissao.texto}"
          </div>
        </div>
      )}

      {/* Painel de resposta expandido */}
      {expandido && podeConcluir && tipo !== "checkin" && (
        <div style={{ borderTop: "1px solid var(--border)", padding: "14px 16px", display: "flex", flexDirection: "column", gap: 12 }}>
          {tipo === "foto" && (
            <>
              <label className={`nf-foto-upload-area ${fotoPreview ? "tem-foto" : ""}`} style={{ display: "block" }}>
                {fotoPreview ? (
                  <img src={fotoPreview} alt="Pré-visualização" className="nf-foto-preview" />
                ) : (
                  <>
                    <IconCamera width={28} height={28} style={{ color: "var(--ink-faint)", margin: "0 auto 10px" }} />
                    <p style={{ fontWeight: 600, fontSize: 14, color: "var(--ink-soft)" }}>Toque para tirar foto ou escolher da galeria</p>
                    <p style={{ fontSize: 12, color: "var(--ink-faint)", marginTop: 4 }}>Câmera · Galeria · Arquivos</p>
                  </>
                )}
                <input type="file" accept="image/*" capture="environment" onChange={handleFoto} style={{ display: "none" }} />
              </label>
              {fotoPreview && (
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => { setFotoBase64(null); setFotoPreview(null); }} className="nf-btn nf-btn-ghost nf-btn-sm" style={{ flex: 1 }}>
                    <IconCamera width={14} height={14} />Nova foto
                  </button>
                  <button onClick={enviar} disabled={!fotoBase64} className="nf-btn nf-btn-primary nf-btn-sm" style={{ flex: 2 }}>
                    <IconSend width={14} height={14} />Enviar para aprovação
                  </button>
                </div>
              )}
            </>
          )}
          {tipo === "texto" && (
            <>
              <textarea
                className="nf-textarea"
                placeholder="Escreva sua resposta aqui…"
                rows={4}
                value={texto}
                onChange={e => setTexto(e.target.value)}
              />
              <button onClick={enviar} disabled={!texto.trim()} className="nf-btn nf-btn-primary nf-btn-sm nf-focus">
                <IconSend width={14} height={14} />Enviar resposta
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* ---- Diário alimentar + hidratação ---- */
function DiarioPaciente({ paciente, appState }) {
  const pacId = paciente?.id || 1;
  const j = useJornada(appState, pacId);
  const [modal, setModal] = useState(false);
  const [dia, setDia] = useState(HOJE);
  /* O "+" da barra inferior cai aqui: volta para o dia de hoje e abre o
     formulário, venha de qual tela vier. */
  const abrirRegistro = useCallback(() => { setDia(HOJE); setModal(true); }, []);
  useRegistroRapido(abrirRegistro);

  const ultimos = Array.from({ length: 7 }).map((_, k) => diasAtras(6 - k));
  const doDia = (j.diarioTodo[dia] || []).slice().sort((a, b) => a.hora.localeCompare(b.hora));
  const ehHoje = dia === HOJE;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Celebracao evento={j.festa} onClose={j.fecharFesta} />

      <div className="nf-card" style={{ padding: 20 }}>
        <p className="nf-eyebrow" style={{ marginBottom: 12 }}>Hidratação de hoje</p>
        <CoposDeAgua copos={j.copos} onMudar={j.beber} />
      </div>

      <div className="nf-dias-fita nf-scroll">
        {ultimos.map(d => {
          const qtd = (j.diarioTodo[d] || []).length;
          const data = new Date(d + "T12:00:00");
          return (
            <button key={d} onClick={() => setDia(d)} className={`nf-dia-pill nf-focus ${dia === d ? "on" : ""}`}>
              <span className="nf-dia-pill-dia">{data.toLocaleDateString("pt-BR", { weekday: "short" }).slice(0, 3)}</span>
              <span className="nf-dia-pill-num">{data.getDate()}</span>
              <span className={`nf-dia-pill-ponto ${qtd ? "on" : ""}`} />
            </button>
          );
        })}
      </div>

      <div className="nf-card" style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: 14 }}>
          <div>
            <h3 className="nf-h1" style={{ fontSize: 17 }}>{ehHoje ? "Hoje" : new Date(dia + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "long" })}</h3>
            <p style={{ fontSize: 12.5, color: "var(--ink-faint)", marginTop: 2 }}>
              {doDia.length === 0 ? "Nenhum registro" : `${doDia.length} registro${doDia.length > 1 ? "s" : ""}`}
            </p>
          </div>
          {ehHoje && (
            <button onClick={() => setModal(true)} className="nf-btn nf-btn-primary nf-focus" style={{ padding: "8px 13px", fontSize: 13.5 }}>
              <IconPlus width={14} height={14} />Registrar
            </button>
          )}
        </div>

        {doDia.length === 0 ? (
          <EmptyState title="Dia em branco" desc={ehHoje ? "Anote o que você comeu. Sem pesar, sem contar caloria — só registrar." : "Não houve registro neste dia. Tudo bem, acontece."} />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {doDia.map(r => (
              <RefeicaoItem key={r.id} refeicao={r} onRemover={ehHoje ? () => j.apagarRefeicao(dia, r.id) : null} />
            ))}
          </div>
        )}
      </div>

      {/* Sem botão flutuante: no celular quem registra é o "+" central da
          barra inferior, e no computador o botão fica no próprio cartão. */}
      {modal && <ModalRefeicao onClose={() => setModal(false)} onSalvar={j.registrarRefeicao} />}
    </div>
  );
}

/* ---- Plano alimentar do paciente ---- */
/* =======================================================================
   PLANO ALIMENTAR — DOCUMENTO PDF
   -----------------------------------------------------------------------
   Estrutura: capa + páginas de conteúdo com cabeçalho corrido e rodapé.

   Duas regras governam o layout inteiro:
   1. Toda medida sai da grade (MG, UTIL, BASE). Nada de número solto.
   2. Todo bloco calcula a própria altura ANTES de desenhar e pede espaço
      a `espacoPara()`. É isso que garante que nenhuma refeição, orientação
      ou assinatura seja cortada, por mais longo que o plano fique.
   ======================================================================= */

function montarPlanoPDF(plano, paciente, opcoes) {
  const jsPDF = window.jspdf?.jsPDF;
  if (!jsPDF) throw new Error("A biblioteca de PDF ainda não carregou. Aguarde alguns segundos e tente de novo.");
  if (!plano) throw new Error("Não há plano alimentar para gerar.");

  const prof = (opcoes && opcoes.profissional) || PROFISSIONAL;
  const doc = new jsPDF({ unit: "mm", format: "a4", compress: true });

  /* ---------------- Grade ---------------- */
  const LARG = 210, ALT = 297;
  const MG = 20;                 /* margem generosa: respiro de documento impresso */
  const DIR = LARG - MG;
  const UTIL = LARG - MG * 2;    /* 170 mm de coluna útil */
  const BASE = 4;                /* unidade de espaçamento; tudo é múltiplo */
  const TOPO = 38;               /* onde o conteúdo começa nas páginas internas */
  const LIMITE = 262;            /* nada de conteúdo abaixo desta linha */

  /* ---------------- Paleta do NutriFlow ---------------- */
  const VERDE   = [31, 61, 43];
  const VERDE_M = [46, 90, 64];
  const VERDE_C = [143, 168, 148];
  const AREIA   = [245, 246, 241];
  const LINHA   = [223, 226, 214];
  const TINTA   = [26, 32, 25];
  const TINTA_S = [92, 100, 89];
  const TINTA_F = [139, 146, 133];
  const DOURADO = [192, 145, 61];
  const BRANCO  = [255, 255, 255];

  /* ---------------- Tipografia ----------------
     Serif nos títulos, sans no texto: é o mesmo par Fraunces + Inter da
     interface, traduzido para as fontes que o PDF tem nativamente. */
  const SERIF = "times", SANS = "helvetica";

  const fonte = (familia, estilo, tam, cor) => {
    doc.setFont(familia, estilo);
    doc.setFontSize(tam);
    doc.setTextColor(...(cor || TINTA));
  };
  const caixa = (x, y, w, h, cor, r) => {
    doc.setFillColor(...cor);
    r ? doc.roundedRect(x, y, w, h, r, r, "F") : doc.rect(x, y, w, h, "F");
  };
  const fio = (y, cor, x1, x2, esp) => {
    doc.setDrawColor(...(cor || LINHA));
    doc.setLineWidth(esp || 0.2);
    doc.line(x1 ?? MG, y, x2 ?? DIR, y);
  };
  const quebrar = (txt, larg) => doc.splitTextToSize(String(txt ?? ""), larg);

  /* Marca desenhada em vetor: círculo com nervura de folha. */
  function marca(x, y, raio, corFundo, corTraco) {
    doc.setFillColor(...corFundo);
    doc.circle(x, y, raio, "F");
    doc.setDrawColor(...corTraco);
    doc.setLineWidth(raio * 0.2);
    doc.line(x - raio * 0.42, y + raio * 0.46, x + raio * 0.42, y - raio * 0.5);
    doc.setLineWidth(raio * 0.12);
    doc.line(x, y + raio * 0.02, x + raio * 0.3, y - raio * 0.28);
    doc.line(x - raio * 0.2, y + raio * 0.24, x + raio * 0.06, y - raio * 0.02);
  }

  /* ---------------- Dados ---------------- */
  const agora = new Date();
  const dataExtenso = agora.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
  const nomePaciente = paciente?.nome || "Paciente";
  const iniciais = nomePaciente.split(" ").filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase();
  const codigo = "NF-" + agora.toISOString().slice(0, 10).replace(/-/g, "") + "-" + iniciais;
  const tituloPlano = plano.titulo || "Plano Alimentar";

  let y = 0;
  let paginasConteudo = 0;

  /* =====================================================================
     CAPA
     Faixa superior em verde com a marca e o título; metade inferior clara
     com identificação e assinatura. Fundo cheio só na faixa — página
     inteira colorida gasta tinta e sai ruim em impressora doméstica.
     ===================================================================== */
  function desenharCapa() {
    caixa(0, 0, LARG, 118, VERDE);
    caixa(0, 118, LARG, 1.6, DOURADO);

    /* Marca */
    marca(MG + 5, 30, 5, BRANCO, VERDE);
    fonte(SANS, "bold", 13, BRANCO);
    doc.text("NutriFlow", MG + 13, 31.6);
    fonte(SANS, "normal", 7, VERDE_C);
    doc.text("ACOMPANHAMENTO NUTRICIONAL", MG + 13, 36.4, { charSpace: 0.35 });

    /* Selo do tipo de documento */
    fonte(SANS, "bold", 7, VERDE_C);
    doc.text("DOCUMENTO INDIVIDUAL", DIR, 31.6, { align: "right", charSpace: 0.3 });
    fonte(SANS, "normal", 7.5, VERDE_C);
    doc.text(codigo, DIR, 36.4, { align: "right" });

    /* Título */
    const linhasTitulo = quebrar(tituloPlano, UTIL - 10);
    fonte(SERIF, "bold", 30, BRANCO);
    doc.text(linhasTitulo, MG, 74 - (linhasTitulo.length - 1) * 5);

    fio(88, [70, 100, 78], MG, MG + 26, 0.8);

    fonte(SANS, "normal", 9.5, VERDE_C);
    doc.text("Elaborado para", MG, 98);
    fonte(SERIF, "bold", 16, BRANCO);
    doc.text(nomePaciente, MG, 107);

    /* --- Metade clara: ficha --- */
    const fichaY = 138;
    const linhas = [
      ["Objetivo", paciente?.objetivo || "—"],
      ["Emitido em", dataExtenso],
      paciente?.idade ? ["Idade", paciente.idade + " anos"] : null,
      paciente?.altura ? ["Altura", (paciente.altura / 100).toFixed(2).replace(".", ",") + " m"] : null,
      (paciente?.alergias && paciente.alergias !== "Nenhuma") ? ["Restrições alimentares", paciente.alergias] : null,
      plano.calorias ? ["Meta calórica", plano.calorias + " kcal por dia"] : null,
    ].filter(Boolean);

    let ly = fichaY;
    linhas.forEach(([rot, val], i) => {
      if (i > 0) fio(ly - 7, LINHA);
      fonte(SANS, "normal", 7.5, TINTA_F);
      doc.text(rot.toUpperCase(), MG, ly, { charSpace: 0.3 });
      fonte(SERIF, "bold", 12, VERDE);
      doc.text(quebrar(val, UTIL - 60)[0], DIR, ly, { align: "right" });
      ly += 14;
    });

    /* --- Pé da capa: quem assina --- */
    const peY = 246;
    fio(peY, LINHA);
    fonte(SANS, "normal", 7.5, TINTA_F);
    doc.text("RESPONSÁVEL TÉCNICA", MG, peY + 8, { charSpace: 0.3 });
    fonte(SERIF, "bold", 13, VERDE);
    doc.text(prof.nome, MG, peY + 16);
    fonte(SANS, "normal", 8.5, TINTA_S);
    doc.text(prof.titulo + "   ·   " + prof.registro, MG, peY + 21.5);

    marca(DIR - 6, peY + 13, 6, AREIA, VERDE_M);

    fonte(SANS, "italic", 6.8, TINTA_F);
    doc.text(
      "Documento de uso individual e intransferível. Não substitui a consulta nutricional.",
      MG, ALT - 14
    );
  }

  /* =====================================================================
     PÁGINAS DE CONTEÚDO
     ===================================================================== */
  function novaPaginaConteudo() {
    doc.addPage();
    paginasConteudo++;
    /* Cabeçalho corrido: discreto, some no fundo, mas identifica a folha
       solta caso o documento seja desgrampeado. */
    fonte(SANS, "bold", 8, VERDE);
    doc.text("NutriFlow", MG, 18);
    fonte(SANS, "normal", 8, TINTA_F);
    doc.text(tituloPlano + "  ·  " + nomePaciente, DIR, 18, { align: "right" });
    fio(22, LINHA);
    y = TOPO;
  }

  function espacoPara(altura) {
    if (paginasConteudo === 0 || y + altura > LIMITE) novaPaginaConteudo();
  }

  /* Título de seção: filete dourado + rótulo espaçado. */
  function secao(titulo, legenda, reservaAbaixo) {
    /* Reserva o título MAIS o começo do conteúdo: título sozinho no pé da
       página é o erro de diagramação mais visível num documento impresso. */
    espacoPara((legenda ? 22 : 16) + (reservaAbaixo || 18));
    doc.setDrawColor(...DOURADO);
    doc.setLineWidth(0.7);
    doc.line(MG, y - 3.2, MG + 10, y - 3.2);
    fonte(SANS, "bold", 8, VERDE);
    doc.text(titulo.toUpperCase(), MG, y + 1.5, { charSpace: 0.4 });
    y += BASE * 2;
    if (legenda) {
      fonte(SANS, "normal", 8.5, TINTA_F);
      doc.text(quebrar(legenda, UTIL), MG, y);
      y += BASE * 1.5;
    }
    y += BASE;
  }

  /* --------------------- Resumo nutricional --------------------- */
  const kcal = Number(plano.calorias) || 0;
  const prot = Number(plano.proteinas) || 0;
  const carb = Number(plano.carboidratos) || 0;
  const gord = Number(plano.gorduras) || 0;
  const somaKcalMacros = prot * 4 + carb * 4 + gord * 9;

  function desenharResumo() {
    if (!kcal && !somaKcalMacros) return;

    const macros = [
      { rot: "Proteínas",    g: prot, kc: prot * 4, cor: VERDE },
      { rot: "Carboidratos", g: carb, kc: carb * 4, cor: VERDE_M },
      { rot: "Gorduras",     g: gord, kc: gord * 9, cor: DOURADO },
    ].filter(m => m.g > 0);

    const temBarra = macros.length === 3 && somaKcalMacros > 0;
    const altura = 44 + (temBarra ? 16 : 0);
    espacoPara(altura + 16);
    secao("Resumo nutricional", "Metas diárias definidas para este plano.", altura);

    caixa(MG, y, UTIL, altura, AREIA, 3);

    /* Bloco da esquerda: energia total */
    const larguraEnergia = 54;
    caixa(MG, y, larguraEnergia, altura, VERDE, 3);
    caixa(MG + larguraEnergia - 3, y, 3, altura, VERDE);   /* remenda o canto */

    fonte(SANS, "normal", 7, VERDE_C);
    doc.text("ENERGIA", MG + BASE * 2, y + 13, { charSpace: 0.3 });
    fonte(SERIF, "bold", 26, BRANCO);
    doc.text(String(kcal || Math.round(somaKcalMacros)), MG + BASE * 2, y + 27);
    fonte(SANS, "normal", 9, VERDE_C);
    doc.text("kcal / dia", MG + BASE * 2, y + 34);

    /* Bloco da direita: macros */
    const x0 = MG + larguraEnergia + BASE * 2;
    const largMacro = (UTIL - larguraEnergia - BASE * 4) / macros.length;

    macros.forEach((m, i) => {
      const mx = x0 + i * largMacro;
      fonte(SANS, "normal", 7, TINTA_F);
      doc.text(m.rot.toUpperCase(), mx, y + 13, { charSpace: 0.25 });
      fonte(SERIF, "bold", 17, VERDE);
      doc.text(m.g + " g", mx, y + 24);
      if (somaKcalMacros > 0) {
        fonte(SANS, "normal", 8, TINTA_F);
        doc.text(Math.round((m.kc / somaKcalMacros) * 100) + "% do total", mx, y + 30);
      }
      if (i < macros.length - 1) {
        doc.setDrawColor(...LINHA);
        doc.setLineWidth(0.2);
        doc.line(mx + largMacro - BASE, y + 9, mx + largMacro - BASE, y + 32);
      }
    });

    /* Barra de distribuição calórica */
    if (temBarra) {
      const bx0 = x0, largBarra = UTIL - larguraEnergia - BASE * 4;
      let bx = bx0;
      macros.forEach((m, i) => {
        const w = (m.kc / somaKcalMacros) * largBarra;
        doc.setFillColor(...m.cor);
        if (i === 0)                    doc.roundedRect(bx, y + 38, w, 4, 2, 2, "F");
        else if (i === macros.length - 1) doc.roundedRect(bx, y + 38, w, 4, 2, 2, "F");
        else                             doc.rect(bx, y + 38, w, 4, "F");
        bx += w;
      });
      /* emenda os cantos arredondados do meio */
      let cx = bx0 + (macros[0].kc / somaKcalMacros) * largBarra;
      doc.setFillColor(...macros[0].cor);
      doc.rect(cx - 2, y + 38, 2, 4, "F");
      doc.setFillColor(...macros[1].cor);
      doc.rect(cx, y + 38, 2, 4, "F");
    }

    y += altura + BASE * 3;
  }

  /* --------------------- Refeições --------------------- */
  const refeicoes = plano.refeicoes || [];

  /* Medidas fixas do bloco de refeição, num lugar só. */
  const REF = {
    gutter: 26,        /* coluna da esquerda: número e horário */
    lhItem: 4.6,       /* altura de linha de um item */
    gapItem: 1.8,      /* respiro entre itens */
    padTopo: 9,
    padBase: 7,
  };

  function alturaRefeicao(itens, larguraItem) {
    const linhas = itens.map(t => quebrar(t, larguraItem));
    const corpo = linhas.reduce((s, l) => s + l.length * REF.lhItem, 0)
                + Math.max(0, itens.length - 1) * REF.gapItem;
    return { linhas, altura: REF.padTopo + corpo + REF.padBase };
  }

  function desenharRefeicoes() {
    if (!refeicoes.length) return;
    secao("Refeições do dia", "Horários e composição sugeridos. As quantidades são referência.", 34);

    const larguraItem = UTIL - REF.gutter - BASE;

    refeicoes.forEach((r, idx) => {
      const itens = String(r.alimentos || "")
        .split(/[,;]\s*(?![^(]*\))|\n/)
        .map(s => s.trim())
        .filter(Boolean);

      const { linhas, altura } = alturaRefeicao(itens, larguraItem);

      /* Se o bloco inteiro não cabe, tenta a próxima página. Se nem numa
         página inteira couber (plano muito longo numa refeição só), ele é
         desenhado assim mesmo e os itens seguem na página seguinte. */
      const cabeNumaPagina = altura <= LIMITE - TOPO;
      if (cabeNumaPagina) espacoPara(altura + BASE);
      else espacoPara(REF.padTopo + REF.lhItem * 3);

      const topo = y;

      /* Coluna da esquerda */
      doc.setFillColor(...VERDE);
      doc.circle(MG + 4.5, topo + 4.5, 4.5, "F");
      fonte(SANS, "bold", 8, BRANCO);
      doc.text(String(idx + 1).padStart(2, "0"), MG + 4.5, topo + 5.9, { align: "center" });

      if (r.horario) {
        fonte(SANS, "bold", 9, VERDE_M);
        doc.text(r.horario, MG, topo + 16);
      }

      /* Nome da refeição */
      fonte(SERIF, "bold", 13, VERDE);
      doc.text(r.nome || "Refeição", MG + REF.gutter, topo + 6);

      /* Itens */
      let iy = topo + REF.padTopo + 5;
      linhas.forEach(bloco => {
        if (!cabeNumaPagina && iy + bloco.length * REF.lhItem > LIMITE) {
          novaPaginaConteudo();
          iy = y + 4;
        }
        doc.setFillColor(...DOURADO);
        doc.circle(MG + REF.gutter + 1, iy - 1.3, 0.6, "F");
        fonte(SANS, "normal", 9.5, TINTA);
        doc.text(bloco, MG + REF.gutter + 4.5, iy);
        iy += bloco.length * REF.lhItem + REF.gapItem;
      });

      y = Math.max(topo + altura, iy + REF.padBase - REF.gapItem);

      /* Fio separador — some na última refeição */
      if (idx < refeicoes.length - 1 && y + 6 < LIMITE) {
        fio(y - 2, LINHA, MG + REF.gutter, DIR);
        y += BASE;
      }
    });

    y += BASE * 2;
  }

  /* --------------------- Observações --------------------- */
  function desenharObservacoes() {
    if (!plano.observacoes) return;
    const linhas = quebrar(plano.observacoes, UTIL - BASE * 6);
    const altura = linhas.length * 5 + BASE * 4;
    espacoPara(altura + 18);
    secao("Observações do plano", null, altura);

    caixa(MG, y, UTIL, altura, AREIA, 3);
    caixa(MG, y, 2.5, altura, DOURADO, 1.2);
    fonte(SERIF, "italic", 11, TINTA_S);
    doc.text(linhas, MG + BASE * 3, y + BASE * 2.6);
    y += altura + BASE * 3;
  }

  /* --------------------- Orientações --------------------- */
  function desenharOrientacoes() {
    const lista = (plano.orientacoes && plano.orientacoes.length) ? plano.orientacoes : ORIENTACOES_PADRAO;
    if (!lista.length) return;

    const recuo = 11;

    /* Mede a lista inteira antes de começar. Se ela não cabe no que sobrou
       mas caberia numa página limpa, vira a página agora — melhor uma
       página nova do que duas orientações órfãs no fim. */
    const alturaLista = lista.reduce((s, o) =>
      s + quebrar(o, UTIL - recuo).length * 5 + BASE * 1.5, 0);
    const alturaTotal = alturaLista + 22 + 34;   /* + título + assinatura */
    if (alturaTotal <= LIMITE - TOPO) espacoPara(alturaTotal);

    secao("Orientações da nutricionista", null, Math.min(alturaLista, 40));

    lista.forEach((o, i) => {
      const linhas = quebrar(o, UTIL - recuo);
      const altura = linhas.length * 5 + BASE * 1.5;
      espacoPara(altura);
      fonte(SERIF, "bold", 11, DOURADO);
      doc.text(String(i + 1).padStart(2, "0"), MG, y);
      fonte(SANS, "normal", 9.5, TINTA_S);
      doc.text(linhas, MG + recuo, y);
      y += altura;
    });
    y += BASE * 2;
  }

  /* --------------------- Assinatura --------------------- */
  function desenharAssinatura() {
    espacoPara(30);
    y += BASE * 2;
    fio(y, TINTA_F, DIR - 78, DIR, 0.3);
    fonte(SERIF, "bold", 12, VERDE);
    doc.text(prof.nome, DIR, y + 7, { align: "right" });
    fonte(SANS, "normal", 8, TINTA_F);
    doc.text(prof.titulo + "   ·   " + prof.registro, DIR, y + 12, { align: "right" });
    y += 18;
  }

  /* =====================================================================
     MONTAGEM
     ===================================================================== */
  desenharCapa();
  desenharResumo();
  desenharRefeicoes();
  desenharObservacoes();
  desenharOrientacoes();
  desenharAssinatura();

  /* ---- Rodapé: só nas páginas de conteúdo, a capa tem o próprio pé ---- */
  const total = doc.internal.getNumberOfPages();
  for (let p = 2; p <= total; p++) {
    doc.setPage(p);
    fio(ALT - 18, LINHA);
    fonte(SANS, "normal", 7, TINTA_F);
    doc.text(codigo + "   ·   emitido em " + dataExtenso, MG, ALT - 13);
    fonte(SANS, "bold", 7.5, VERDE);
    doc.text(String(p).padStart(2, "0"), DIR - 9, ALT - 13, { align: "right" });
    fonte(SANS, "normal", 7.5, TINTA_F);
    doc.text("/ " + String(total).padStart(2, "0"), DIR, ALT - 13, { align: "right" });
    fonte(SANS, "italic", 6.5, TINTA_F);
    doc.text("Uso individual. Não substitui a consulta nutricional.", MG, ALT - 8.6);
  }

  doc.setProperties({
    title: tituloPlano + " — " + nomePaciente,
    subject: "Plano alimentar individual",
    author: prof.nome,
    keywords: codigo,
    creator: "NutriFlow",
  });

  const semAcento = nomePaciente.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w]+/g, "_");
  return { doc, nomeArquivo: `PlanoAlimentar_${semAcento}_${agora.toISOString().slice(0, 10)}.pdf` };
}

/* Entrega do arquivo — mantida simples, como antes. */
function gerarPlanoPDF(plano, paciente, opcoes) {
  const { doc, nomeArquivo } = montarPlanoPDF(plano, paciente, opcoes);
  doc.save(nomeArquivo);
  return { nomeArquivo, paginas: doc.internal.getNumberOfPages() };
}

            style={{ width: "100%", justifyContent: "center", fontSize: 15, padding: "14px 0", borderRadius: 12 }}
          >
            {baixando
              ? <><span className="nf-spinner" style={{ width: 16, height: 16, borderWidth: 2, borderTopColor: "#fff", borderColor: "rgba(255,255,255,0.3)", display: "inline-block", marginRight: 8 }} />Gerando PDF…</>
              : <>⬇️ Baixar PDF</>
            }
          </button>

          <p style={{ fontSize: 12, color: "var(--ink-faint)", margin: 0 }}>
            Gerado diretamente no seu dispositivo. Nenhum dado é enviado para a internet.
          </p>
        </div>
      )}

      {prefill && (
        <ModalRefeicao inicial={prefill} onClose={() => setPrefill(null)} onSalvar={j.registrarRefeicao} />
      )}
    </div>
  );
}

/* ---- Evolução ---- */
function EvolucaoPaciente({ paciente, appState }) {
  const pacId = paciente?.id || 1;
  const j = useJornada(appState, pacId);
  const regs = (appState.registrosPeso[pacId] || []).slice().sort((a, b) => a.data.localeCompare(b.data));
  const pesos = regs.map(r => r.peso);
  const primeiro = pesos[0];
  const atual = pesos[pesos.length - 1];
  const dif = primeiro != null && atual != null ? atual - primeiro : 0;

  const ultimos = j.checkins.slice(-6);
  const energia = ultimos.map(c => c.energia * 20);
  const sono = ultimos.map(c => c.sono * 20);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="nf-card" style={{ padding: 22 }}>
        <p className="nf-eyebrow" style={{ marginBottom: 6 }}>Seu histórico</p>
        <h2 className="nf-h1" style={{ fontSize: 21, marginBottom: 16 }}>Evolução</h2>
        {pesos.length < 2 ? (
          <EmptyState title="Poucos dados ainda" desc="Depois de alguns check-ins o gráfico começa a fazer sentido." />
        ) : (
          <>
            <div style={{ display: "flex", gap: 22, flexWrap: "wrap", marginBottom: 16 }}>
              <div><p className="nf-eyebrow">Início</p><p className="nf-evo-num">{primeiro} kg</p></div>
              <div><p className="nf-eyebrow">Agora</p><p className="nf-evo-num">{atual} kg</p></div>
              <div>
                <p className="nf-eyebrow">Diferença</p>
                <p className="nf-evo-num" style={{ color: "var(--ink-soft)" }}>
                  {dif > 0 ? "+" : ""}{dif.toFixed(1).replace(".", ",")} kg
                </p>
              </div>
            </div>

  );
}

/* ---- Check-in semanal ---- */
function CheckinPaciente({ paciente, appState }) {
  const pacId = paciente?.id || 1;
  const j = useJornada(appState, pacId);
  const [peso, setPeso] = useState("");
  const [cintura, setCintura] = useState("");
  const [energia, setEnergia] = useState(3);
  const [sono, setSono] = useState(3);
  const [fome, setFome] = useState(3);
  const [nota, setNota] = useState("");
  const [enviado, setEnviado] = useState(false);

  const ultimo = j.checkins[j.checkins.length - 1];
  const diasDesde = ultimo ? Math.round((new Date(HOJE) - new Date(ultimo.data)) / 86400000) : null;

  function enviar() {
    j.enviarCheckin({
      data: HOJE,
      peso: peso ? parseFloat(peso.replace(",", ".")) : null,
      cintura: cintura ? parseFloat(cintura.replace(",", ".")) : null,
      energia, sono, fome, nota: nota.trim(),
    });
    setEnviado(true);
  }

  if (enviado) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Celebracao evento={j.festa} onClose={j.fecharFesta} />
        <div className="nf-card" style={{ padding: 40, textAlign: "center" }}>
          <div style={{ width: 56, height: 56, borderRadius: 18, background: "var(--primary-tint)", color: "var(--primary)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
            <IconCheck width={26} height={26} />
          </div>
          <h2 className="nf-h1" style={{ fontSize: 21 }}>Check-in enviado</h2>
          <p style={{ color: "var(--ink-soft)", fontSize: 14.5, marginTop: 8, maxWidth: 380, marginInline: "auto" }}>
            A Dra. Letícia recebe o seu resumo. Obrigado por contar como foi a semana —
            é isso que faz o plano ficar mais seu a cada ajuste.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Celebracao evento={j.festa} onClose={j.fecharFesta} />

      <div className="nf-card" style={{ padding: 22 }}>
        <p className="nf-eyebrow" style={{ marginBottom: 6 }}>Uma vez por semana</p>
        <h2 className="nf-h1" style={{ fontSize: 21 }}>Como foi a sua semana?</h2>
        <p style={{ color: "var(--ink-soft)", fontSize: 14, marginTop: 8 }}>
          {diasDesde != null ? `Seu último check-in foi há ${diasDesde} dias.` : "Este é o seu primeiro check-in."}
          {" "}Nada aqui é obrigatório — responda o que fizer sentido.
        </p>
      </div>

      <div className="nf-card" style={{ padding: 22, display: "flex", flexDirection: "column", gap: 20 }}>
        <div className="nf-grid-2">
          <Field label="Peso (opcional)" type="text" inputMode="decimal" placeholder="68,2"
            value={peso} onChange={e => setPeso(e.target.value)} />
          <Field label="Cintura em cm (opcional)" type="text" inputMode="decimal" placeholder="82"
            value={cintura} onChange={e => setCintura(e.target.value)} />
        </div>

        <EscalaCarinha label="Como estava sua energia?" valor={energia} onMudar={setEnergia} extremos={["Muito baixa", "Ótima"]} />
        <EscalaCarinha label="Como você dormiu?" valor={sono} onMudar={setSono} extremos={["Muito mal", "Muito bem"]} />
        <EscalaCarinha label="Como estava sua fome?" valor={fome} onMudar={setFome} extremos={["Descontrolada", "Tranquila"]} />

        <Field label="Quer contar mais alguma coisa?" textarea rows={4}
          placeholder="O que funcionou, o que atrapalhou, o que você quer ajustar…"
          value={nota} onChange={e => setNota(e.target.value)} />

        <button onClick={enviar} className="nf-btn nf-btn-primary" style={{ height: 50, width: "100%" }}>
          Enviar check-in · +{XP_CHECKIN} XP
        </button>
      </div>

      <p className="nf-nota-peso">
        O peso é opcional de propósito. Se pesar não te faz bem, pule esse campo —
        o resto do check-in continua valendo igual.

}

/* ---- Mensagens ---- */
function MensagensPaciente({ paciente, appState }) {
  const pacId = paciente?.id || 1;
  const j = useJornada(appState, pacId);
  const [texto, setTexto] = useState("");
  const [digitando, setDigitando] = useState(false);
  const fim = useRef(null);
  const timer = useRef(null);

  useEffect(() => {
    if (fim.current) fim.current.scrollIntoView({ block: "end" });
  }, [j.conversas.length, digitando]);

  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);

  function mandar() {
    const t = texto.trim();
    if (!t) return;
    j.mandarMensagem(t);
    setTexto("");
    setDigitando(true);
    timer.current = setTimeout(() => { setDigitando(false); j.responder(); }, 1600);
  }

  return (
    <div className="nf-chat">
      <div className="nf-chat-topo">
        <Avatar nome="Dra. Letícia Silva" size={40} />
        <div style={{ minWidth: 0 }}>
          <p style={{ fontWeight: 600, fontSize: 15 }}>Dra. Letícia Silva</p>
          <p style={{ fontSize: 12.5, color: "var(--ink-faint)" }}>Nutricionista clínica</p>
        </div>
      </div>

      <div className="nf-chat-corpo nf-scroll">
        {j.conversas.length === 0 && (
          <EmptyState title="Comece a conversa" desc="Dúvida sobre o plano, dificuldade na semana, uma vitória para contar — tudo cabe aqui." />
        )}
        {j.conversas.map(m => <BolhaMensagem key={m.id} msg={m} />)}
        {digitando && (
          <div className="nf-bolha-linha">
            <Avatar nome="Dra. Letícia Silva" size={30} />
            <div className="nf-bolha nf-digitando"><span /><span /><span /></div>
          </div>
        )}
        <div ref={fim} />
      </div>

      <div className="nf-chat-barra">
        <input
          className="nf-focus" value={texto} placeholder="Escreva uma mensagem…"
          onChange={e => setTexto(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandar(); } }}
        />
        <button onClick={mandar} disabled={!texto.trim()} className="nf-chat-enviar nf-focus" aria-label="Enviar mensagem">
          <IconSend width={18} height={18} />
        </button>
      </div>
    </div>
  );
}

function MensagensNutri({ appState }) {
  const [aberto, setAberto] = useState(null);
  const [texto, setTexto] = useState("");
  const fim = useRef(null);

  const conversas = appState.pacientes.map(p => {
    const msgs = appState.mensagens[p.id] || [];
    return { paciente: p, msgs, ultima: msgs[msgs.length - 1] };
  }).sort((a, b) => (b.ultima?.em || "").localeCompare(a.ultima?.em || ""));

  const atual = conversas.find(c => c.paciente.id === aberto);

  useEffect(() => { if (fim.current) fim.current.scrollIntoView({ block: "end" }); }, [atual?.msgs.length]);

  function responder() {
    const t = texto.trim();
    if (!t || !atual) return;
    appState.responderComoNutri(atual.paciente.id, t);
    setTexto("");
    toast("Mensagem enviada", "ok");
  }

  if (atual) {
    return (
      <div className="nf-chat">
        <div className="nf-chat-topo">
          <button onClick={() => setAberto(null)} className="nf-btn nf-btn-ghost nf-focus" style={{ padding: 7, borderRadius: 999 }} aria-label="Voltar">
            <IconBack width={17} height={17} />
          </button>
          <Avatar nome={atual.paciente.nome} size={38} ring={atual.paciente.adesao} />
          <div style={{ minWidth: 0 }}>
            <p style={{ fontWeight: 600, fontSize: 15 }}>{atual.paciente.nome}</p>
            <p style={{ fontSize: 12.5, color: "var(--ink-faint)" }}>{atual.paciente.objetivo}</p>
          </div>
        </div>
        <div className="nf-chat-corpo nf-scroll">
          {atual.msgs.length === 0 && <EmptyState title="Sem mensagens ainda" desc="Escreva a primeira — muita gente só destrava quando é chamada." />}
          {atual.msgs.map(m => (
            <div key={m.id} className={`nf-bolha-linha ${m.de === "nutri" ? "minha" : ""}`}>
              {m.de !== "nutri" && <Avatar nome={atual.paciente.nome} size={30} />}
              <div className={`nf-bolha ${m.de === "nutri" ? "minha" : ""}`}>
                <p>{m.texto}</p>
                <span className="nf-bolha-hora">{(m.em || "").slice(11, 16)}</span>
              </div>
            </div>
          ))}
          <div ref={fim} />
        </div>
        <div className="nf-chat-barra">
          <input className="nf-focus" value={texto} placeholder="Responder…"
            onChange={e => setTexto(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); responder(); } }} />
          <button onClick={responder} disabled={!texto.trim()} className="nf-chat-enviar nf-focus" aria-label="Enviar">
            <IconSend width={18} height={18} />
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="nf-card" style={{ padding: 0, overflow: "hidden" }}>
      <div style={{ padding: "20px 22px 14px", borderBottom: "1px solid var(--border)" }}>
        <h2 className="nf-h1" style={{ fontSize: 19 }}>Conversas</h2>
        <p style={{ fontSize: 12.5, color: "var(--ink-faint)", marginTop: 3 }}>Mensagens trocadas dentro da plataforma</p>
      </div>
      {conversas.length === 0 ? (
        <div style={{ padding: 20 }}><EmptyState title="Nenhuma conversa" desc="Quando um paciente escrever, aparece aqui." /></div>
      ) : (
        <div style={{ padding: 8 }}>
          {conversas.map(c => (
            <button key={c.paciente.id} onClick={() => setAberto(c.paciente.id)} className="nf-conversa nf-focus">
              <Avatar nome={c.paciente.nome} size={44} ring={c.paciente.adesao} />
              <span style={{ minWidth: 0, flex: 1, textAlign: "left" }}>
                <span className="nf-conversa-nome">{c.paciente.nome}</span>
                <span className="nf-conversa-ultima">
                  {c.ultima ? `${c.ultima.de === "nutri" ? "Você: " : ""}${c.ultima.texto}` : "Nenhuma mensagem ainda"}
                </span>
              </span>
              {c.ultima && <span className="nf-conversa-data">{(c.ultima.em || "").slice(5, 10).split("-").reverse().join("/")}</span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* Painel lateral do prontuário — vira folha inferior no celular. */
function ProntuarioLateral({ paciente, appState, onFechar }) {
  const g = appState.gamificacao[paciente.id] || {};
  const regs = (appState.registrosPeso[paciente.id] || []).slice().sort((a, b) => a.data.localeCompare(b.data));
  const pesos = regs.map(r => r.peso);
  const metas = (appState.metas[paciente.id] || []);
  const abertas = metas.filter(m => !m.concluida);
  const ultima = (appState.agenda || [])
    .filter(a => a.pacienteId === paciente.id && a.data <= HOJE)
    .sort((a, b) => b.data.localeCompare(a.data))[0];
  const variacao = pesos.length >= 2 ? pesos[pesos.length - 1] - pesos[0] : null;

  return (
    <div className="nf-sala-painel" role="dialog" aria-label="Prontuário da paciente">
      <div className="nf-sala-painel-topo">
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <Avatar nome={paciente.nome} size={36} ring={paciente.adesao} />
          <div style={{ minWidth: 0 }}>
            <p style={{ fontWeight: 700, fontSize: 14.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{paciente.nome}</p>
            <p style={{ fontSize: 12, color: "var(--ink-faint)" }}>{paciente.objetivo}</p>
          </div>
        </div>
        <button onClick={onFechar} className="nf-btn nf-btn-ghost nf-focus" style={{ padding: 8, borderRadius: 999 }} aria-label="Fechar prontuário">
          <IconX width={15} height={15} />
        </button>
      </div>

      <div className="nf-sala-painel-corpo nf-scroll">
        <div className="nf-pront-numeros">
          <div><span>Peso atual</span><b>{paciente.peso} kg</b></div>
          <div><span>Adesão</span><b style={{ color: paciente.adesao >= 70 ? "var(--primary)" : "var(--danger)" }}>{paciente.adesao}%</b></div>
          <div><span>Nível</span><b>{nivelDoXp(g.xp || 0).n}</b></div>
          <div><span>Sequência</span><b>{streakDe(paciente.id)} d</b></div>
        </div>

        <div className="nf-pront-bloco">
          <p className="nf-eyebrow">Última consulta</p>
          <p className="nf-pront-texto">
            {ultima
              ? `${new Date(ultima.data + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "long" })} · ${ultima.tipo}`
              : "Nenhuma consulta anterior registrada."}
          </p>
        </div>

        <div className="nf-pront-bloco">
          <p className="nf-eyebrow">Evolução de peso</p>
          {pesos.length >= 2 ? (
            <>
              <p className="nf-pront-texto">
                {pesos[0]} kg → {pesos[pesos.length - 1]} kg
                <span style={{ color: "var(--ink-faint)" }}>
                  {"  ("}{variacao > 0 ? "+" : ""}{variacao.toFixed(1).replace(".", ",")} kg{")"}
                </span>
              </p>
              <AreaSeries data={pesos} color="var(--primary)" height={64} />
            </>
          ) : (
            <p className="nf-pront-texto" style={{ color: "var(--ink-faint)" }}>Poucos registros para traçar a curva.</p>
          )}
        </div>

        <div className="nf-pront-bloco">
          <p className="nf-eyebrow">Metas em aberto</p>
          {abertas.length === 0 ? (
            <p className="nf-pront-texto" style={{ color: "var(--ink-faint)" }}>Nenhuma meta aberta no momento.</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 7, marginTop: 6 }}>
              {abertas.map(m => (
                <div key={m.id} className="nf-pront-meta">
                  <span />
                  <span style={{ minWidth: 0 }}>
                    <b>{m.desc}</b>
                    <i>até {new Date(m.prazo + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "short" })}</i>
                  </span>
                </div>
              ))}
            </div>
          )}
          {metas.length > abertas.length && (
            <p className="nf-pront-texto" style={{ color: "var(--ink-faint)", marginTop: 8 }}>
              {metas.length - abertas.length} já concluída{metas.length - abertas.length > 1 ? "s" : ""}.
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

/* Chat da chamada — mesmo painel lateral, outro conteúdo. */
function ChatDaSala({ mensagens, onEnviar, onFechar, nomeOutro }) {
  const [texto, setTexto] = useState("");
  const fim = useRef(null);
  useEffect(() => { if (fim.current) fim.current.scrollIntoView({ block: "end" }); }, [mensagens.length]);

  return (
    <div className="nf-sala-painel" role="dialog" aria-label="Mensagens da consulta">
      <div className="nf-sala-painel-topo">
        <div>
          <p style={{ fontWeight: 700, fontSize: 14.5 }}>Mensagens</p>
          <p style={{ fontSize: 12, color: "var(--ink-faint)" }}>Só durante esta consulta</p>
        </div>
        <button onClick={onFechar} className="nf-btn nf-btn-ghost nf-focus" style={{ padding: 8, borderRadius: 999 }} aria-label="Fechar chat">
          <IconX width={15} height={15} />
        </button>
      </div>

      <div className="nf-sala-painel-corpo nf-scroll" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {mensagens.length === 0 && (
          <EmptyState title="Nada por aqui ainda" desc={`Use para mandar um link ou um número enquanto conversa com ${nomeOutro}.`} />
        )}
        {mensagens.map((m, k) => (
          <div key={k} className={`nf-bolha-linha ${m.de === "eu" ? "minha" : ""}`}>
            <div className={`nf-bolha ${m.de === "eu" ? "minha" : ""}`}>
              <p>{m.texto}</p>
              <span className="nf-bolha-hora">{m.em}</span>
            </div>
          </div>
        ))}
        <div ref={fim} />
      </div>

      <div className="nf-chat-barra">
        <input className="nf-focus" value={texto} placeholder="Escreva uma mensagem…"
          onChange={e => setTexto(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (texto.trim()) { onEnviar(texto.trim()); setTexto(""); } } }} />
        <button onClick={() => { if (texto.trim()) { onEnviar(texto.trim()); setTexto(""); } }}
          disabled={!texto.trim()} className="nf-chat-enviar nf-focus" aria-label="Enviar">
          <IconSend width={18} height={18} />
        </button>
      </div>
    </div>
  );
}

/* A sala em si. Toda comunicação passa pelo ServicoVideo. */
function SalaAtendimento({ consulta, paciente, role, appState, onSair }) {
  const [estado, setEstado] = useState("conectando");
  const [micLigado, setMic] = useState(true);
  const [camLigada, setCam] = useState(true);
  const [compartilhando, setCompartilhando] = useState(false);
  const [falandoRemoto, setFalandoRemoto] = useState(false);
  const [painel, setPainel] = useState(null);          /* null | "chat" | "prontuario" */
  const [mensagens, setMensagens] = useState([]);
  const [naoLidas, setNaoLidas] = useState(0);
  const [segundos, setSegundos] = useState(0);

  const souNutri = role === "nutricionista";
  const nomeOutro = souNutri ? (paciente?.nome || "Paciente") : PROFISSIONAL.nome;
  const meuNome = souNutri ? PROFISSIONAL.nome : (paciente?.nome || "Você");

  /* Conexão: entra ao montar, sai ao desmontar. */
  useEffect(() => {
    ServicoVideo.conectar({ id: consulta?.id, paciente: paciente?.id }, (ev) => {
      if (ev.tipo === "estado") setEstado(ev.estado);
      if (ev.tipo === "remoto") setFalandoRemoto(ev.falando);
      if (ev.tipo === "aviso") toast(ev.texto, "info");
      if (ev.tipo === "mensagem") {
        setMensagens(m => [...m, { de: "outro", texto: ev.texto, em: ev.em }]);
        setNaoLidas(n => n + 1);
      }
    });
    return () => ServicoVideo.desconectar();
  }, [consulta?.id]);

  /* Cronômetro só corre depois de conectar. */
  useEffect(() => {
    if (estado !== "conectado") return;
    const t = setInterval(() => setSegundos(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [estado]);

  useEffect(() => { if (painel === "chat") setNaoLidas(0); }, [painel, mensagens.length]);

  const relogio = `${String(Math.floor(segundos / 60)).padStart(2, "0")}:${String(segundos % 60).padStart(2, "0")}`;

  function alternarMic() { const v = !micLigado; setMic(v); ServicoVideo.definirMicrofone(v); }
  function alternarCam() { const v = !camLigada; setCam(v); ServicoVideo.definirCamera(v); }
  function alternarTela() {
    const v = !compartilhando;
    setCompartilhando(v); ServicoVideo.definirCompartilhamento(v);
    toast(v ? "Compartilhamento iniciado" : "Compartilhamento encerrado", "info", v ? "Simulado — nada da sua tela é enviado." : "");
  }
  function enviar(texto) {
    setMensagens(m => [...m, { de: "eu", texto, em: new Date().toISOString().slice(11, 16) }]);
    ServicoVideo.enviarMensagem(texto);
  }
  function encerrar() {
    ServicoVideo.desconectar();
    toast("Consulta encerrada", "ok", relogio + " de duração");
    onSair();
  }

  return (
    <div className="nf-sala">
      {/* Barra superior */}
      <div className="nf-sala-topo">
        <button onClick={encerrar} className="nf-sala-voltar nf-focus" aria-label="Sair da consulta">
          <IconBack width={17} height={17} />
        </button>
        <div style={{ minWidth: 0, flex: 1 }}>
          <p className="nf-sala-nome">{nomeOutro}</p>
          <p className="nf-sala-estado">
            <span className={`nf-sala-ponto ${estado}`} />
            {estado === "conectando" ? "Conectando…" : estado === "conectado" ? relogio : "Encerrada"}
          </p>
        </div>
        <span className="nf-sala-selo">SIMULAÇÃO</span>
      </div>

      {/* Palco */}
      <div className="nf-sala-palco">
        {compartilhando ? (
          <div className="nf-sala-tela">
            <IconScreen width={30} height={30} />
            <p>Você está compartilhando a tela</p>
            <span>Nesta versão nada é transmitido de verdade.</span>
          </div>
        ) : (
          <div className={`nf-sala-remoto ${falandoRemoto ? "falando" : ""}`}>
            <div className="nf-sala-avatar">
              <Avatar nome={nomeOutro} size={92} />
            </div>
            <p className="nf-sala-remoto-nome">{nomeOutro}</p>
            <p className="nf-sala-remoto-sub">
              {estado === "conectando" ? "Entrando na sala…" : falandoRemoto ? "Falando" : "Na chamada"}
            </p>
            {estado === "conectando" && <div className="nf-sala-carregando"><span /><span /><span /></div>}
          </div>
        )}

        {/* Vídeo pequeno: eu */}
        <div className={`nf-sala-eu ${camLigada ? "" : "sem-camera"}`}>
          {camLigada ? (
            <>
              <Avatar nome={meuNome} size={40} />
              <span className="nf-sala-eu-rotulo">Você</span>
            </>
          ) : (
            <>
              <IconVideoOff width={20} height={20} />
              <span className="nf-sala-eu-rotulo">Câmera desligada</span>
            </>
          )}
          {!micLigado && <span className="nf-sala-eu-mudo"><IconMicOff width={12} height={12} /></span>}
        </div>
      </div>

      {/* Controles */}
      <div className="nf-sala-controles">
        <button onClick={alternarMic} className={`nf-sala-btn nf-focus ${micLigado ? "" : "desligado"}`} aria-pressed={!micLigado} aria-label={micLigado ? "Desligar microfone" : "Ligar microfone"}>
          {micLigado ? <IconMic width={20} height={20} /> : <IconMicOff width={20} height={20} />}
          <i>{micLigado ? "Microfone" : "Mudo"}</i>
        </button>

        <button onClick={alternarCam} className={`nf-sala-btn nf-focus ${camLigada ? "" : "desligado"}`} aria-pressed={!camLigada} aria-label={camLigada ? "Desligar câmera" : "Ligar câmera"}>
          {camLigada ? <IconVideo width={20} height={20} /> : <IconVideoOff width={20} height={20} />}
          <i>Câmera</i>
        </button>

        <button onClick={alternarTela} className={`nf-sala-btn nf-focus ${compartilhando ? "ativo" : ""}`} aria-pressed={compartilhando} aria-label="Compartilhar tela">
          <IconScreen width={20} height={20} /><i>Tela</i>
        </button>

        <button onClick={() => setPainel(painel === "chat" ? null : "chat")} className={`nf-sala-btn nf-focus ${painel === "chat" ? "ativo" : ""}`} aria-label="Mensagens">
          <IconMessage width={20} height={20} /><i>Chat</i>
          {naoLidas > 0 && <span className="nf-sala-badge">{naoLidas}</span>}
        </button>

        {souNutri && (
          <button onClick={() => setPainel(painel === "prontuario" ? null : "prontuario")} className={`nf-sala-btn nf-focus ${painel === "prontuario" ? "ativo" : ""}`} aria-label="Prontuário">
            <IconFolder width={20} height={20} /><i>Prontuário</i>
          </button>
        )}

        <button onClick={encerrar} className="nf-sala-btn encerrar nf-focus" aria-label="Encerrar chamada">
          <IconPhoneOff width={20} height={20} /><i>Encerrar</i>
        </button>
      </div>

      {painel === "chat" && (
        <ChatDaSala mensagens={mensagens} onEnviar={enviar} onFechar={() => setPainel(null)} nomeOutro={nomeOutro} />
      )}
      {painel === "prontuario" && paciente && (
        <ProntuarioLateral paciente={paciente} appState={appState} onFechar={() => setPainel(null)} />
      )}
    </div>
  );
}

/* Antessala: lista de consultas e botão de entrar. */
function AtendimentoOnline({ role, appState, pacienteAtivo }) {
  const [emChamada, setEmChamada] = useState(null);
  const souNutri = role === "nutricionista";

  const consultas = useMemo(() => {
    const lista = (appState.agenda || [])
      .filter(a => (souNutri ? true : a.pacienteId === (pacienteAtivo?.id || 1)))
      .filter(a => a.data >= HOJE && (a.status || "confirmada") !== "concluida")
      .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
    return lista;
  }, [appState.agenda, souNutri, pacienteAtivo]);

  const proxima = consultas[0];

  if (emChamada) {
    const pac = appState.pacientes.find(p => p.id === emChamada.pacienteId) || pacienteAtivo;
    return (
      <SalaAtendimento
        consulta={emChamada}
        paciente={pac}
        role={role}
        appState={appState}
        onSair={() => setEmChamada(null)}
      />
    );
  }

  function cartao(c, destaque) {
    const pac = appState.pacientes.find(p => p.id === c.pacienteId);
    const sala = estadoDaSala(c);
    const quando = c.data === HOJE
      ? "Hoje"
      : new Date(c.data + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

    return (
      <div key={c.id} className={`nf-card nf-consulta-online ${destaque ? "destaque" : ""}`}>
        {destaque && <span className="nf-eyebrow" style={{ display: "block", marginBottom: 12 }}>Próxima consulta</span>}

        <div style={{ display: "flex", alignItems: "center", gap: 13, marginBottom: destaque ? 18 : 12 }}>
          <Avatar nome={souNutri ? (pac?.nome || "?") : PROFISSIONAL.nome} size={destaque ? 52 : 40} ring={souNutri ? pac?.adesao : undefined} />
          <div style={{ minWidth: 0, flex: 1 }}>
            <p style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: destaque ? 19 : 15.5 }}>
              {souNutri ? (pac?.nome || "Paciente") : PROFISSIONAL.nome}
            </p>
            <p style={{ fontSize: 13, color: "var(--ink-faint)", marginTop: 2 }}>
              {souNutri ? (pac?.objetivo || c.tipo) : PROFISSIONAL.titulo}
            </p>
          </div>
          <StatusConsulta status={c.status || "confirmada"} />
        </div>

        <div className="nf-consulta-online-info">
          <div><span>Data</span><b style={{ textTransform: "capitalize" }}>{quando}</b></div>
          <div><span>Horário</span><b>{c.hora}</b></div>
          <div><span>Tipo</span><b>{c.tipo}</b></div>
          <div><span>Sala</span><b style={{ color: sala.aberta ? "var(--primary)" : "var(--ink-faint)" }}>{sala.rotulo}</b></div>
        </div>

        <button
          onClick={() => setEmChamada(c)}
          className={`nf-btn ${sala.aberta ? "nf-btn-primary" : "nf-btn-secondary"} nf-focus`}
          style={{ width: "100%", marginTop: 16, height: destaque ? 50 : 44 }}
        >
          <IconVideo width={17} height={17} />
          {sala.aberta ? "Entrar na consulta" : "Entrar mesmo assim"}
        </button>

        {!sala.aberta && (
          <p style={{ fontSize: 12, color: "var(--ink-faint)", textAlign: "center", marginTop: 8 }}>
            A sala abre no dia da consulta. Você pode entrar antes para testar.
          </p>
        )}
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {!proxima ? (
        <div className="nf-card" style={{ padding: 34 }}>
          <EmptyState
            title="Nenhuma consulta marcada"
            desc={souNutri
              ? "Quando houver consulta agendada, a sala aparece aqui."
              : "Assim que a Dra. Letícia marcar seu retorno, o botão de entrar aparece nesta tela."}
          />
        </div>
      ) : (
        cartao(proxima, true)
      )}

      {consultas.length > 1 && (
        <>
          <p className="nf-eyebrow" style={{ marginTop: 4 }}>Depois dessa</p>
          {consultas.slice(1, 5).map(c => cartao(c, false))}
        </>
      )}

      <p className="nf-nota-peso">
        Interface de demonstração: a sala funciona, mas nenhum áudio ou vídeo é
        transmitido. A troca por um serviço real acontece num ponto só do código,
        sem mexer nestas telas.
      </p>
    </div>
  );
}

/* ---- Primitivos de gráfico ---------------------------------------------
   viewBox fixo + preserveAspectRatio="none" para ocupar toda a largura;
   vector-effect impede que o traço estique junto.
   ---------------------------------------------------------------------- */

function AreaSeries({ data, labels, color = "var(--primary)", height = 108, suffix = "" }) {
  if (!data || data.length < 2) return null;
  const w = 300, h = height, pad = 10;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const px = (idx) => (idx / (data.length - 1)) * w;
  const py = (v) => h - pad - ((v - min) / range) * (h - pad * 2);
  const linha = data.map((v, k) => `${px(k)},${py(v)}`).join(" ");
  const area = `0,${h} ${linha} ${w},${h}`;
  const uid = `g-${color.replace(/[^a-z]/gi, "")}-${data.length}-${Math.round(max)}`;

  return (
    <div>
      <svg className="nf-chart-svg" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: "100%", height: h, display: "block" }} role="img" aria-label={`Série de ${data.length} pontos, de ${min}${suffix} a ${max}${suffix}`}>
        <defs>
          <linearGradient id={uid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.20" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        <polygon points={area} fill={`url(#${uid})`} />
        <polyline points={linha} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
        <circle cx={px(data.length - 1)} cy={py(data[data.length - 1])} r="3.4" fill={color} vectorEffect="non-scaling-stroke" />
      </svg>
      {labels && (
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
          {labels.map(m => <span key={m} style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--ink-faint)" }}>{m}</span>)}
        </div>
      )}
    </div>
  );
}

function BarSeries({ data, labels, height = 108, suffix = "" }) {
  if (!data || data.length === 0) return null;
  const max = Math.max(...data) || 1;
  return (
    <div>
      <div className="nf-chart-bars" style={{ display: "flex", alignItems: "flex-end", gap: 6, height }}>
        {data.map((v, k) => (
          <div key={k} className="nf-chart-bar" title={`${v}${suffix}`}
            style={{ height: `${Math.max(8, (v / max) * 100)}%`, background: k === data.length - 1 ? "var(--primary)" : undefined }} />
        ))}
      </div>
      {labels && (
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          {labels.map(m => <span key={m} style={{ flex: 1, textAlign: "center", fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--ink-faint)" }}>{m}</span>)}
        </div>
      )}
    </div>
  );
}

function ChartCard({ titulo, valor, legenda, children }) {
  return (
    <div className="nf-card" style={{ padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
      <div>
        <p className="nf-eyebrow" style={{ marginBottom: 6 }}>{titulo}</p>
        <p style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 600, lineHeight: 1.1 }}>{valor}</p>

/* ---- Indicador com comparação ------------------------------------------ */

function StatCard({ icon: Icon, label, valor, delta, tom = "up", nota }) {
  const cor = tom === "up" ? "var(--primary)" : tom === "down" ? "var(--danger)" : "var(--ink-faint)";
