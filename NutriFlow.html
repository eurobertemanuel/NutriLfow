      .nf-habito:hover { border-color: var(--ink-faint); }
      .nf-habito.feito { border-color: var(--primary); background: var(--primary-tint); }
      .nf-habito-caixa { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border); background: var(--surface); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }
      .nf-habito.feito .nf-habito-caixa { background: var(--primary); border-color: var(--primary); }
      .nf-habito-icone { color: var(--ink-faint); flex-shrink: 0; display: flex; }
      .nf-habito.feito .nf-habito-icone { color: var(--primary); }
      .nf-habito-nome { display: block; font-weight: 600; font-size: 14.5px; }
      .nf-habito-desc { display: block; font-size: 12.5px; color: var(--ink-faint); }
      .nf-habito-xp { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--ink-faint); flex-shrink: 0; }
      .nf-habito.feito .nf-habito-xp { color: var(--primary); }

      .nf-desafio { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: var(--radius-md); background: var(--surface-2); }
      .nf-desafio.feito { background: var(--primary-tint); }
      .nf-desafio-titulo { font-weight: 600; font-size: 14.5px; }
      .nf-desafio-desc { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; line-height: 1.45; }
      .nf-desafio-ok { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--primary); flex-shrink: 0; }
      .nf-semanal { padding: 14px; border-radius: var(--radius-md); background: var(--surface-2); }

      .nf-grid-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
      .nf-dia { aspect-ratio: 1; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }
      .nf-dia.on { background: var(--primary); border-color: var(--primary); }
      .nf-dia.hoje { outline: 2px solid var(--accent); outline-offset: 1px; }

      .nf-trilha { display: flex; flex-direction: column; }
      .nf-trilha-etapa { display: flex; align-items: center; gap: 14px; padding: 11px 0; position: relative; }
      .nf-trilha-etapa::before { content: ""; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: var(--border); }
      .nf-trilha-etapa:first-child::before { top: 50%; }
      .nf-trilha-etapa:last-child::before { bottom: 50%; }
      .nf-trilha-etapa.on::before { background: var(--primary-tint); }
      .nf-trilha-no { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; z-index: 1; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 2px solid var(--border); color: var(--ink-faint); font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
      .nf-trilha-etapa.on .nf-trilha-no { background: var(--primary); border-color: var(--primary); color: #fff; }
      .nf-trilha-etapa.atual .nf-trilha-no { box-shadow: 0 0 0 4px var(--primary-tint); }
      .nf-trilha-nome { font-weight: 600; font-size: 14.5px; color: var(--ink-faint); }
      .nf-trilha-etapa.on .nf-trilha-nome { color: var(--ink); }
      .nf-trilha-frase { font-size: 12.5px; color: var(--ink-faint); }

      .nf-badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .nf-badge { padding: 16px 14px; border-radius: var(--radius-md); background: var(--surface-2); text-align: center; opacity: .55; }
      .nf-badge.on { background: var(--primary-tint); opacity: 1; }
      .nf-badge-icone { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: 0 auto 9px; border-radius: 12px; background: var(--surface); font-size: 19px; color: var(--ink-faint); }
      .nf-badge.on .nf-badge-icone { color: var(--primary); }
      .nf-badge-nome { font-weight: 700; font-size: 13.5px; }
      .nf-badge-desc { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; line-height: 1.4; }

      .nf-meta-linha { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-2); }
      .nf-meta-circulo { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }
      .nf-meta-circulo.on { background: var(--primary); border-color: var(--primary); }

      .nf-nota-peso { font-size: 12.5px; color: var(--ink-faint); line-height: 1.6; text-align: center; max-width: 520px; margin: 4px auto 0; }

      /* Comemoração: aviso passageiro, nunca modal que bloqueia a tela. */
      .nf-festa { position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; z-index: 70; display: flex; align-items: center; gap: 12px; max-width: min(420px, calc(100vw - 32px)); padding: 13px 16px; border-radius: 16px; background: var(--primary); color: #fff; box-shadow: var(--shadow-pop); animation: nfSobe .3s cubic-bezier(.32,.72,0,1) both; }
      .nf-festa-icone { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .nf-festa-titulo { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
      .nf-festa-sub { font-size: 12.5px; opacity: .82; margin-top: 1px; }
      @keyframes nfSobe { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
      @media (min-width: 901px) { .nf-festa { bottom: 28px; } }
      @media (prefers-reduced-motion: reduce) { .nf-festa { animation: none; } }

      @media (max-width: 620px) {
        .nf-badges { grid-template-columns: 1fr 1fr; gap: 10px; }
        .nf-jornada-topo { padding: 18px; }
        .nf-habito { padding: 11px 12px; gap: 10px; }
      }

      /* ================= ÁREA DO PACIENTE — APARÊNCIA DE APP ============ */

      .nf-atalhos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      @media (max-width: 620px) { .nf-atalhos { grid-template-columns: repeat(2, 1fr); } }
      .nf-atalho { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--border); transition: transform .16s ease, border-color .16s ease; }
      .nf-atalho:hover { transform: translateY(-2px); border-color: var(--primary); }
      .nf-atalho-icone { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--primary-tint); color: var(--primary); margin-bottom: 5px; }
      .nf-atalho-titulo { font-size: 11.5px; color: var(--ink-faint); }
      .nf-atalho-valor { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; }

      .nf-proxima { display: flex; align-items: center; gap: 13px; padding: 15px 18px; width: 100%; text-align: left; }
      .nf-proxima-icone { width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--accent-tint); color: #8A6620; }
      .nf-proxima-titulo { display: block; font-weight: 600; font-size: 14.5px; }
      .nf-proxima-sub { display: block; font-size: 12.5px; color: var(--ink-faint); }

      /* Água */
      .nf-agua-num { font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.1; }
      .nf-agua-num span { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink-soft); }
      .nf-agua-btn { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); font-size: 18px; line-height: 1; color: var(--ink); }
      .nf-agua-btn:disabled { opacity: .4; }
      .nf-agua-btn.primaria { background: var(--primary); border-color: var(--primary); color: #fff; }
      .nf-copos { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
      .nf-copo { aspect-ratio: 3/4; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface-2); color: var(--ink-faint); display: flex; align-items: center; justify-content: center; transition: all .18s ease; }
      .nf-copo.cheio { background: #E7F1F5; border-color: var(--accent); color: var(--accent); }

      /* Refeições */
      .nf-refeicao { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px; border-radius: var(--radius-md); background: var(--surface-2); }
      .nf-refeicao-foto { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
      .nf-refeicao-emoji { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
      .nf-refeicao-tipo { font-weight: 600; font-size: 14px; }
      .nf-refeicao-hora { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); }
      .nf-refeicao-desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin-top: 2px; }
      .nf-refeicao-nota { font-size: 12px; color: var(--ink-faint); font-style: italic; margin-top: 3px; }
      .nf-refeicao-lixo { background: none; border: none; color: var(--ink-faint); padding: 6px; border-radius: 8px; flex-shrink: 0; }
      .nf-refeicao-lixo:hover { color: var(--danger); background: var(--danger-tint); }

      .nf-tipos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      @media (max-width: 480px) { .nf-tipos { grid-template-columns: repeat(2, 1fr); } }
      .nf-tipo { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 11px 6px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface); font-size: 11.5px; font-weight: 500; text-align: center; line-height: 1.25; }
      .nf-tipo.on { border-color: var(--primary); background: var(--primary-tint); color: var(--primary); font-weight: 700; }

      .nf-foto-botao { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 42px; padding: 0 13px; border-radius: var(--radius-md); border: 1.5px dashed var(--border); background: var(--surface); font-size: 13.5px; color: var(--ink-soft); cursor: pointer; }
      .nf-foto-botao:hover { border-color: var(--primary); color: var(--primary); }
      .nf-foto-previa { display: flex; align-items: center; gap: 12px; }
      .nf-foto-previa img { width: 86px; height: 86px; object-fit: cover; border-radius: var(--radius-md); }

      /* Fita de dias do diário */
      .nf-dias-fita { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }
      .nf-dia-pill { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; padding: 9px 4px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); flex-shrink: 0; }
      .nf-dia-pill.on { border-color: var(--primary); background: var(--primary-tint); }
      .nf-dia-pill-dia { font-size: 10.5px; color: var(--ink-faint); text-transform: capitalize; }
      .nf-dia-pill-num { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
      .nf-dia-pill-ponto { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
      .nf-dia-pill-ponto.on { background: var(--primary); }

      /* Plano */
      .nf-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
      @media (max-width: 560px) { .nf-macros { grid-template-columns: repeat(2, 1fr); } }
      .nf-macro { padding: 12px; border-radius: var(--radius-md); background: var(--surface-2); font-size: 11.5px; color: var(--ink-faint); text-align: center; }
      .nf-macro span { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }

      /* Evolução e check-in */
      .nf-evo-num { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
      .nf-checkin-passado { padding: 13px 14px; border-radius: var(--radius-md); background: var(--surface-2); }
      .nf-checkin-data { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-bottom: 5px; }
      .nf-escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
      .nf-cara { aspect-ratio: 1; max-height: 54px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); font-size: 22px; line-height: 1; transition: all .16s ease; }
      .nf-cara.on { border-color: var(--primary); background: var(--primary-tint); transform: scale(1.06); }

      .nf-meta-xp { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--primary); flex-shrink: 0; }

      /* Chat */
      .nf-chat { display: flex; flex-direction: column; height: calc(100vh - var(--h-header) - 92px); min-height: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
      @media (max-width: 900px) { .nf-chat { height: calc(100vh - var(--h-header) - var(--h-mobilenav) - 40px); } }
      .nf-chat-topo { display: flex; align-items: center; gap: 11px; padding: 13px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .nf-chat-corpo { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .nf-bolha-linha { display: flex; align-items: flex-end; gap: 8px; }
      .nf-bolha-linha.minha { justify-content: flex-end; }
      .nf-bolha { max-width: 78%; padding: 10px 14px; border-radius: 18px 18px 18px 5px; background: var(--surface-2); }
      .nf-bolha p { font-size: 14.5px; line-height: 1.5; }
      .nf-bolha.minha { background: var(--primary); color: #fff; border-radius: 18px 18px 5px 18px; }
      .nf-bolha-hora { display: block; font-family: var(--font-mono); font-size: 10px; opacity: .6; margin-top: 4px; text-align: right; }
      .nf-digitando { display: flex; gap: 4px; padding: 14px; }
      .nf-digitando span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); animation: nfPula 1.2s infinite; }
      .nf-digitando span:nth-child(2) { animation-delay: .18s; }
      .nf-digitando span:nth-child(3) { animation-delay: .36s; }
      @keyframes nfPula { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
      .nf-chat-barra { display: flex; gap: 9px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); flex-shrink: 0; }
      .nf-chat-barra input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface-2); font-family: var(--font-body); font-size: 14.5px; outline: none; }
      .nf-chat-barra input:focus { border-color: var(--primary); background: var(--surface); }
      .nf-chat-enviar { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary); color: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
      .nf-chat-enviar:disabled { opacity: .4; }

      /* Notificações */
      .nf-sino-contador { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--danger); color: #fff; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .nf-notif-overlay { position: fixed; inset: 0; background: rgba(26,32,25,.42); z-index: 75; display: flex; justify-content: flex-end; }
      .nf-notif { width: min(400px, 100vw); background: #FFFFFF; height: 100%; overflow-y: auto; box-shadow: var(--shadow-pop); animation: nfEntraDireita .24s cubic-bezier(.32,.72,0,1) both; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
      @keyframes nfEntraDireita { from { transform: translateX(18px); opacity: 0; } to { transform: none; opacity: 1; } }
      .nf-notif-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(16px + env(safe-area-inset-top)) 14px 16px; position: sticky; top: 0; background: #FFFFFF; border-bottom: 1px solid var(--border); z-index: 1; flex-shrink: 0; }
      .nf-notif-item { display: flex; align-items: flex-start; gap: 11px; width: 100%; padding: 12px; border-radius: var(--radius-md); border: none; background: none; margin-bottom: 4px; }
      .nf-notif-item:hover { background: var(--surface-2); }
      .nf-notif-item.nova { background: var(--primary-tint); }
      .nf-notif-icone { width: 32px; height: 32px; border-radius: 10px; background: var(--surface); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .nf-notif-titulo { display: block; font-weight: 600; font-size: 14px; }
      .nf-notif-texto { display: block; font-size: 12.5px; color: var(--ink-faint); line-height: 1.45; margin-top: 2px; }
      .nf-notif-ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex-shrink: 0; margin-top: 6px; }
      @media (max-width: 560px) { .nf-notif { width: 100vw; } }

      /* Botão flutuante — some no desktop, onde já há botão no cartão */
      .nf-fab { position: fixed; right: 18px; bottom: calc(var(--h-mobilenav) + 16px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 50%; border: none; background: var(--primary); color: #fff; box-shadow: 0 8px 24px rgba(31,61,43,.34); display: flex; align-items: center; justify-content: center; z-index: 30; }
      @media (min-width: 901px) { .nf-fab { display: none; } }

      /* ================= HOME DO PACIENTE — VERSÃO APP ================= */

      /* Este arquivo nunca zerou a margem de h2/h3/p. Dentro de um flex a
         margem não colapsa, então o cabeçalho de seção saía desalinhado do
         link à direita. O :where() zera a especificidade: cada classe
         abaixo continua mandando na própria margem. */
      :where(.nf-cascata) :where(h2, h3, p) { margin: 0; }

      /* Cabeçalho: saudação, nível, XP e sequência em um bloco só. */
      .nf-hero { position: relative; overflow: hidden; padding: 22px; border: none; color: #fff;
        background: linear-gradient(150deg, #1F3D2B 0%, #2A5239 55%, #35674B 100%); }
      .nf-hero::after { content: ""; position: absolute; top: -110px; right: -80px; width: 240px; height: 240px; border-radius: 50%;
        background: radial-gradient(circle, rgba(192,145,61,.34), rgba(192,145,61,0) 70%); pointer-events: none; }
      .nf-hero-linha { display: flex; align-items: center; gap: 15px; position: relative; }
      .nf-hero-sauda { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6); }
      .nf-hero-nome { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.1; margin-top: 4px; }
      .nf-hero-frase { font-size: 13px; color: rgba(255,255,255,.76); margin-top: 4px; line-height: 1.45; }
      .nf-hero-anel { position: relative; width: 76px; height: 76px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
      .nf-hero-anel svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .nf-hero-anel-n { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1; display: block; }
      .nf-hero-anel-rot { font-size: 8.5px; letter-spacing: .12em; color: rgba(255,255,255,.62); display: block; margin-top: 3px; }
      .nf-hero-xp { margin-top: 18px; position: relative; }
      .nf-hero-xp-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
      .nf-hero-xp-nivel { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; }
      .nf-hero-xp-valor { font-family: var(--font-mono); font-size: 11.5px; color: rgba(255,255,255,.66); }
      .nf-hero-trilho { height: 9px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; }
      .nf-hero-preenche { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #EBCE84, var(--accent));
        transition: width .9s cubic-bezier(.32,.72,0,1); }
      .nf-hero-falta { font-size: 12px; color: rgba(255,255,255,.66); margin-top: 8px; }
      .nf-hero-passos { display: flex; gap: 4px; width: 100%; margin-top: 15px; padding: 0; background: none; border: none; }
      .nf-hero-passo { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,.18); transition: background .3s ease; }
      .nf-hero-passo.on { background: var(--accent); }
      .nf-hero-passo.atual { background: #fff; }

      .nf-chama { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; margin-top: 16px;
        background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.17); position: relative; }
      .nf-chama-fogo { display: flex; color: #F2B95E; animation: nfPulsa 2.6s ease-in-out infinite; }
      @keyframes nfPulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.16); } }
      .nf-chama b { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
      .nf-chama span { font-size: 12.5px; color: rgba(255,255,255,.72); }

      /* Cabeçalho de seção reaproveitado por todos os cartões da home. */
      .nf-secao { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
      .nf-secao h3 { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
      .nf-secao-sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
      .nf-verlink { background: none; border: none; padding: 0; color: var(--primary); font-weight: 600; font-size: 13.5px; flex-shrink: 0; white-space: nowrap; }

      /* Desafio do dia — o único cartão dourado da tela. */
      .nf-destaque { padding: 20px; border: 1.5px solid var(--accent);
        background: linear-gradient(155deg, var(--accent-tint) 0%, var(--surface) 66%); }
      .nf-destaque-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px;
        letter-spacing: .09em; text-transform: uppercase; color: #8A6620; margin-bottom: 10px; }
      .nf-destaque-titulo { font-family: var(--font-display); font-weight: 600; font-size: 18.5px; line-height: 1.25; }
      .nf-destaque-desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin-top: 6px; }
      .nf-destaque-pe { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
      .nf-destaque.feito { border-color: var(--primary); background: linear-gradient(155deg, var(--primary-tint) 0%, var(--surface) 66%); }

      .nf-barra-dia { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 11px; }
      .nf-barra-dia i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary-soft), var(--primary));
        transition: width .7s cubic-bezier(.32,.72,0,1); }

      /* Linha tocável: consulta, plano, metas, conversa. */
      .nf-linha-toque { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px;
        border-radius: var(--radius-md); background: var(--surface-2); border: none; transition: background .16s ease, transform .16s ease; }
      .nf-linha-toque:hover { background: var(--primary-tint); transform: translateX(2px); }
      .nf-linha-icone { width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        background: var(--surface); color: var(--primary); }
      .nf-linha-icone.ouro { background: var(--accent-tint); color: #8A6620; }
      .nf-linha-titulo { display: block; font-weight: 600; font-size: 14.5px; }
      .nf-linha-sub { display: block; font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; line-height: 1.45; }
      .nf-linha-marca { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border); background: var(--surface);
        flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }

      /* Entrada em cascata dos cartões da home. O :not() é o que impede a
         animação de pegar o modal e a faixa de comemoração: enquanto ela
         roda, o elemento vira contexto de empilhamento e o modal acabaria
         desenhado ATRÁS da barra inferior. */
      .nf-cascata > *:not(.nf-modal-overlay):not(.nf-festa) { animation: nfSobeCard .42s cubic-bezier(.32,.72,0,1) backwards; }
      .nf-cascata > *:nth-child(1) { animation-delay: .02s; }
      .nf-cascata > *:nth-child(2) { animation-delay: .06s; }
      .nf-cascata > *:nth-child(3) { animation-delay: .10s; }
      .nf-cascata > *:nth-child(4) { animation-delay: .14s; }
      .nf-cascata > *:nth-child(5) { animation-delay: .18s; }
      .nf-cascata > *:nth-child(6) { animation-delay: .22s; }
      .nf-cascata > *:nth-child(7) { animation-delay: .26s; }
      .nf-cascata > *:nth-child(8) { animation-delay: .30s; }
      .nf-cascata > *:nth-child(n+9) { animation-delay: .34s; }
      @keyframes nfSobeCard { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

      /* Botão central "+" da barra inferior do paciente. */
      .nf-bottomnav button.nf-mais { flex: 0 0 68px; justify-content: flex-start; }
      .nf-mais-bolha { width: 50px; height: 50px; border-radius: 50%; margin-top: -24px; margin-bottom: 1px;
        background: var(--primary); color: #fff; border: 4px solid var(--surface); box-shadow: 0 8px 20px rgba(31,61,43,.36);
        display: flex; align-items: center; justify-content: center; transition: transform .16s ease; }
      .nf-bottomnav button.nf-mais:active .nf-mais-bolha { transform: scale(.9); }
      .nf-bottomnav button.nf-mais svg { width: 23px; height: 23px; }

      @media (prefers-reduced-motion: reduce) {
        .nf-cascata > *:not(.nf-modal-overlay):not(.nf-festa) { animation: none; }
        .nf-chama-fogo { animation: none; }
        .nf-hero-preenche, .nf-barra-dia i { transition: none; }
      }

      @media (max-width: 620px) {
        .nf-hero { padding: 19px; }
        .nf-hero-nome { font-size: 22px; }
        .nf-hero-anel { width: 68px; height: 68px; }
        /* Quatro chips numa linha só: a home cabe na tela sem empurrar o
           conteúdo de verdade para baixo da dobra. */
        .nf-atalhos { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .nf-atalho { padding: 11px 9px; }
        .nf-atalho-icone { width: 28px; height: 28px; border-radius: 9px; margin-bottom: 4px; }
        .nf-atalho-icone svg { width: 15px; height: 15px; }
        .nf-atalho-titulo { font-size: 10.5px; }
        .nf-atalho-valor { font-size: 13.5px; }
      }

      /* ================= POLIMENTO FINAL ============================== */

      /* Toasts — canto inferior, acima da barra de navegação do celular */
      .nf-toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--h-mobilenav) + 78px + env(safe-area-inset-bottom)); z-index: 95; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100vw - 28px)); pointer-events: none; }
      @media (min-width: 901px) { .nf-toasts { bottom: 24px; left: auto; right: 24px; transform: none; } }
      .nf-toast { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid var(--border); box-shadow: var(--shadow-pop); pointer-events: auto; animation: nfToastEntra .26s cubic-bezier(.32,.72,0,1) both; }
      @keyframes nfToastEntra { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
      .nf-toast-icone { width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--ink-soft); }
      .nf-toast-ok .nf-toast-icone { background: var(--primary-tint); color: var(--primary); }
      .nf-toast-erro .nf-toast-icone { background: var(--danger-tint); color: var(--danger); }
      .nf-toast-texto { display: block; font-weight: 600; font-size: 14px; }
      .nf-toast-sub { display: block; font-size: 12.5px; color: var(--ink-faint); line-height: 1.45; margin-top: 2px; }
      .nf-toast-fechar { background: none; border: none; color: var(--ink-faint); padding: 4px; border-radius: 6px; flex-shrink: 0; }

      /* Loading */
      .nf-esqueleto { display: block; border-radius: 7px; background: linear-gradient(90deg, var(--surface-2) 25%, #EDEFE8 50%, var(--surface-2) 75%); background-size: 300% 100%; animation: nfBrilho 1.4s ease-in-out infinite; }
      @keyframes nfBrilho { from { background-position: 130% 0; } to { background-position: -30% 0; } }
      .nf-carregando { display: flex; align-items: center; gap: 11px; padding: 22px; color: var(--ink-faint); font-size: 13.5px; }
      .nf-spin { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: nfGira .7s linear infinite; flex-shrink: 0; }
      @keyframes nfGira { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .nf-esqueleto { animation: none; }
        .nf-spin { animation-duration: 2.4s; }
      }
      .nf-erro-detalhe { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; margin-top: 16px; word-break: break-word; text-align: left; }

      /* NutriAI */
      .nf-ai-topo { padding: 22px; }
      .nf-ai-selo { width: 46px; height: 46px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(140deg, var(--primary), #3E7A58); color: #fff; }
      .nf-ai-aviso { font-size: 12.5px; color: var(--ink-faint); line-height: 1.55; margin-top: 16px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-2); border-left: 3px solid var(--accent); }
      .nf-ai-controles { display: grid; grid-template-columns: 1fr 1.15fr; gap: 10px; align-items: end; }
      @media (max-width: 620px) { .nf-ai-controles { grid-template-columns: 1fr; } }
      .nf-ai-alerta { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); transition: border-color .16s ease, transform .16s ease; }
      .nf-ai-alerta:hover { border-color: var(--primary); transform: translateX(2px); }
      .nf-ai-alerta-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .nf-ai-alerta-nome { font-weight: 600; font-size: 14px; }
      .nf-ai-tag { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; }
      .nf-ai-alerta-titulo { display: block; font-size: 13.5px; font-weight: 600; margin-top: 1px; }
      .nf-ai-alerta-motivo { display: block; font-size: 12.5px; color: var(--ink-faint); line-height: 1.45; margin-top: 2px; }
      .nf-ai-vazio { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 30px 20px; color: var(--ink-faint); text-align: center; font-size: 13.5px; }
      .nf-ai-resposta { padding: 18px; border-radius: var(--radius-md); background: var(--surface-2); animation: nfSurge .3s var(--e-out, ease) both; }
      @keyframes nfSurge { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .nf-ai-frase { font-size: 14px; color: var(--ink-soft); line-height: 1.65; margin-bottom: 7px; }
      .nf-ai-listas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
      @media (max-width: 560px) { .nf-ai-listas { grid-template-columns: 1fr; } }
      .nf-ai-sugestao { padding: 15px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); animation: nfSurge .3s ease both; }
      .nf-ai-sugestao-tipo { width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--primary-tint); color: var(--primary); }
      .nf-ai-porque { font-size: 12.5px; color: var(--ink-faint); line-height: 1.5; margin-top: 7px; }
      .nf-ai-porque b { color: var(--ink-soft); }

      /* Conversas e cobranças */
      .nf-conversa, .nf-cobranca { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: var(--radius-md); border: none; background: none; transition: background .15s ease; }
      .nf-conversa:hover, .nf-cobranca:not(:disabled):hover { background: var(--surface-2); }
      .nf-cobranca:disabled { opacity: .72; }
      .nf-conversa-nome { display: block; font-weight: 600; font-size: 14.5px; }
      .nf-conversa-ultima { display: block; font-size: 12.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
      .nf-conversa-data { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
      .nf-cobranca-valor { font-family: var(--font-mono); font-weight: 700; font-size: 14px; }

      /* Tabela de relatório */
      .nf-tabela-rolagem { overflow-x: auto; }
      .nf-tabela { width: 100%; border-collapse: collapse; min-width: 560px; }
      .nf-tabela th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; padding: 12px 22px; border-bottom: 1px solid var(--border); }
      .nf-tabela td { padding: 13px 22px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
      .nf-tabela tr:last-child td { border-bottom: none; }
      .nf-tabela .nf-num { font-family: var(--font-mono); }

      /* Planos de assinatura */
      .nf-planos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
      @media (max-width: 900px) { .nf-planos { grid-template-columns: 1fr; } }
      .nf-plano { padding: 24px; position: relative; }
      .nf-plano.destaque { border-color: var(--primary); box-shadow: var(--shadow-pop); }
      .nf-plano-flag { position: absolute; top: -10px; left: 24px; background: var(--primary); color: #fff; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
      .nf-plano-preco { font-family: var(--font-display); font-size: 32px; font-weight: 600; line-height: 1; }
      .nf-plano-preco span { font-family: var(--font-body); font-size: 13.5px; font-weight: 500; color: var(--ink-faint); }
      .nf-plano-lista { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 9px; }
      .nf-plano-lista li { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: var(--ink-soft); }
      .nf-plano-lista li svg { color: var(--primary); flex-shrink: 0; margin-top: 3px; }

      .nf-modulo-onde { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--primary-tint); max-width: 440px; margin-inline: auto; }

      /* Impressão: só o conteúdo, sem menu nem barra */
      @media print {
        .nf-sidebar, .nf-topbar, .nf-bottomnav, .nf-fab, .nf-toasts, .nf-festa { display: none !important; }
        .nf-content { padding: 0 !important; }
        .nf-card { break-inside: avoid; box-shadow: none !important; }
        body { background: #fff !important; }
      }

      /* ================= ATENDIMENTO ONLINE ==========================
         A sala é a única tela escura do app, de propósito: vídeo pede
         fundo escuro para o rosto ganhar contraste. Tudo aqui é pensado
         primeiro para o celular em pé. */

      .nf-consulta-online { padding: 20px; }
      .nf-consulta-online.destaque { padding: 22px; border-color: var(--primary); box-shadow: var(--shadow-pop); }
      .nf-consulta-online-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px; border-radius: var(--radius-md); background: var(--surface-2); }
      @media (max-width: 560px) { .nf-consulta-online-info { grid-template-columns: 1fr 1fr; } }
      .nf-consulta-online-info span { display: block; font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
      .nf-consulta-online-info b { font-size: 13.5px; font-weight: 600; }

      /* ---- A sala ---- */
      .nf-sala {
        position: relative;
        display: flex; flex-direction: column;
        background: #0E1511; color: #fff;
        border-radius: var(--radius-lg); overflow: hidden;
        height: calc(100vh - var(--h-header) - 92px); min-height: 460px;
      }
      @media (max-width: 900px) {
        .nf-sala {
          position: fixed; inset: 0; z-index: 60;
          height: 100vh; min-height: 0; border-radius: 0;
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      .nf-sala-topo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; flex-shrink: 0; }
      .nf-sala-voltar { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.1); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .nf-sala-nome { font-family: var(--font-display); font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nf-sala-estado { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: rgba(255,255,255,.6); font-family: var(--font-mono); }
      .nf-sala-ponto { width: 7px; height: 7px; border-radius: 50%; background: #C0913D; }
      .nf-sala-ponto.conectado { background: #4ADE80; }
      .nf-sala-ponto.conectando { animation: nfPisca 1s ease-in-out infinite; }
      @keyframes nfPisca { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      .nf-sala-selo { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; padding: 4px 8px; border-radius: 999px; background: rgba(192,145,61,.22); color: #E8C77F; flex-shrink: 0; }

      .nf-sala-palco { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
      .nf-sala-remoto { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
      .nf-sala-avatar { padding: 6px; border-radius: 50%; border: 3px solid transparent; transition: border-color .25s ease, transform .25s ease; }
      .nf-sala-remoto.falando .nf-sala-avatar { border-color: #4ADE80; transform: scale(1.04); }
      .nf-sala-remoto-nome { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
      .nf-sala-remoto-sub { font-size: 13px; color: rgba(255,255,255,.55); }
      .nf-sala-carregando { display: flex; gap: 5px; margin-top: 4px; }
      .nf-sala-carregando span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); animation: nfPula 1.2s infinite; }
      .nf-sala-carregando span:nth-child(2) { animation-delay: .18s; }
      .nf-sala-carregando span:nth-child(3) { animation-delay: .36s; }

      .nf-sala-tela { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: rgba(255,255,255,.75); border: 1.5px dashed rgba(255,255,255,.2); border-radius: var(--radius-lg); padding: 34px 26px; width: 100%; max-width: 460px; }
      .nf-sala-tela p { font-size: 15px; font-weight: 600; color: #fff; }
      .nf-sala-tela span { font-size: 12.5px; color: rgba(255,255,255,.5); }

      .nf-sala-eu {
        position: absolute; right: 14px; bottom: 14px;
        width: 96px; height: 128px; border-radius: 14px;
        background: #1B2620; border: 1px solid rgba(255,255,255,.12);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        color: rgba(255,255,255,.6); overflow: hidden;
      }
      .nf-sala-eu.sem-camera { background: #15201A; }
      .nf-sala-eu-rotulo { font-size: 10.5px; text-align: center; padding: 0 4px; }
      .nf-sala-eu-mudo { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%; background: #B3492F; color: #fff; display: flex; align-items: center; justify-content: center; }
      @media (max-width: 560px) { .nf-sala-eu { width: 78px; height: 104px; right: 10px; bottom: 10px; } }

      .nf-sala-controles {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        padding: 12px 10px 16px; flex-shrink: 0;
        background: rgba(0,0,0,.28); overflow-x: auto;
      }
      .nf-sala-btn {
        position: relative; flex: 0 0 auto;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        min-width: 62px; min-height: 58px; padding: 8px 6px;
        border: none; border-radius: 16px;
        background: rgba(255,255,255,.1); color: #fff;
        transition: background .16s ease, transform .16s ease;
      }
      .nf-sala-btn:active { transform: scale(.95); }
      .nf-sala-btn i { font-style: normal; font-size: 10px; opacity: .8; }
      .nf-sala-btn.ativo { background: #2E5A40; }
      .nf-sala-btn.desligado { background: #B3492F; }
      .nf-sala-btn.encerrar { background: #B3492F; }
      .nf-sala-btn.encerrar:hover { background: #953C26; }
      .nf-sala-badge { position: absolute; top: 5px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #C0913D; color: #1A2019; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

      /* ---- Painéis laterais: gaveta no desktop, folha no celular ---- */
      .nf-sala-painel {
        position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 88%);
        background: var(--surface); color: var(--ink);
        display: flex; flex-direction: column;
        box-shadow: var(--shadow-pop);
        animation: nfEntraDireita .24s cubic-bezier(.32,.72,0,1) both;
      }
      @media (max-width: 700px) {
        .nf-sala-painel {
          top: auto; left: 0; width: 100%; height: 74%;
          border-radius: 20px 20px 0 0;
          animation: nfSobeFolha .26s cubic-bezier(.32,.72,0,1) both;
          padding-bottom: env(safe-area-inset-bottom);
        }
        @keyframes nfSobeFolha { from { transform: translateY(24px); opacity: .5; } to { transform: none; opacity: 1; } }
      }
      .nf-sala-painel-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      .nf-sala-painel-corpo { flex: 1; overflow-y: auto; padding: 14px; }

      /* ---- Conteúdo do prontuário ---- */
      .nf-pront-numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
      .nf-pront-numeros > div { padding: 11px 12px; border-radius: var(--radius-md); background: var(--surface-2); }
      .nf-pront-numeros span { display: block; font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; }
      .nf-pront-numeros b { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
      .nf-pront-bloco { padding-top: 14px; border-top: 1px solid var(--border); margin-top: 14px; }

/* ========================= MINI LINE CHART ============================== */

function LineChart({ data, label, color = "var(--primary)", height = 80 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const w = 300, h = height;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 10) - 5;
    return `${x},${y}`;
  }).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: h }}>
        <polyline points={pts} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
        {data.map((v, i) => {
          const x = (i / (data.length - 1)) * w;
          const y = h - ((v - min) / range) * (h - 10) - 5;
          return <circle key={i} cx={x} cy={y} r="3" fill={color} />;
        })}
      </svg>
      {label && <p style={{ fontSize: 12, color: "var(--ink-faint)", marginTop: 4 }}>{label}</p>}
    </div>
  );
}

function AuthScreen({ onEnter }) {
  const [role, setRole] = useState("nutricionista");
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState(contaDoPapel("nutricionista").email);
  const [senha, setSenha] = useState(contaDoPapel("nutricionista").senha);
  const [erro, setErro] = useState("");

  /* Trocar de papel já traz o acesso daquele papel preenchido. */
  function trocarPapel(novo) {
    setRole(novo);
    setErro("");
    const c = contaDoPapel(novo);
    if (mode === "login" && c) { setEmail(c.email); setSenha(c.senha); }
  }

  function trocarModo() {
    const novo = mode === "login" ? "cadastro" : "login";
    setMode(novo);
    setErro("");
    const c = contaDoPapel(role);
    if (novo === "login" && c) { setEmail(c.email); setSenha(c.senha); }
    else { setEmail(""); setSenha(""); }
  }

  function entrar(e) {
    e.preventDefault();
    if (mode === "cadastro") return onEnter(role);

    const conta = CONTAS.find(
      c => c.email.toLowerCase() === email.trim().toLowerCase() && c.senha === senha
    );
    if (!conta) {
      setErro("E-mail ou senha não confere. Use um dos acessos de teste abaixo.");
      return;
    }
    onEnter(conta.role);
  }

  function entrarDireto(conta) {
    setRole(conta.role);
    setEmail(conta.email);
    setSenha(conta.senha);
    setErro("");
    onEnter(conta.role);
  }

  return (
    <div className="nf-root nf-auth">

        <svg style={{ position: "absolute", right: -80, bottom: -80, opacity: .35 }} width="360" height="360" viewBox="0 0 360 360">
          <circle cx="180" cy="180" r="170" stroke="#fff" strokeOpacity=".18" strokeWidth="1.5" fill="none" />
          <circle cx="180" cy="180" r="130" stroke="#fff" strokeOpacity=".18" strokeWidth="1.5" fill="none" />
          <circle cx="180" cy="180" r="90" stroke="#fff" strokeOpacity=".18" strokeWidth="1.5" fill="none" />
        </svg>
      </div>

      <div className="nf-auth-form">
        <div className="nf-fade-in" style={{ width: "100%", maxWidth: 380 }}>
          <div className="nf-auth-brand-mobile"><BrandMark /></div>
          <p className="nf-eyebrow" style={{ marginBottom: 8 }}>{mode === "login" ? "Bem-vindo de volta" : "Criar conta"}</p>
          <h2 className="nf-h1" style={{ fontSize: 27, marginBottom: 22 }}>{mode === "login" ? "Entrar no NutriFlow" : "Comece a usar o NutriFlow"}</h2>

          <div style={{ display: "flex", background: "var(--surface-2)", borderRadius: 999, padding: 4, marginBottom: 22 }}>
            {[{ k: "nutricionista", l: "Sou nutricionista" }, { k: "paciente", l: "Sou paciente" }].map(r => (
              <button key={r.k} onClick={() => trocarPapel(r.k)} className="nf-focus" style={{ flex: 1, border: "none", borderRadius: 999, padding: "9px 10px", fontSize: 13.5, fontWeight: 600, background: role === r.k ? "var(--surface)" : "transparent", color: role === r.k ? "var(--primary)" : "var(--ink-soft)", boxShadow: role === r.k ? "var(--shadow-card)" : "none", transition: "all .15s ease" }}>{r.l}</button>
            ))}

            {mode === "cadastro" && <Field label="Nome completo" placeholder="Como você se chama" icon={<IconUsers />} required />}

/* ---------------------------------------------------------------------
   Ponte do botão "+" da barra inferior do paciente.
   A barra vive no AppShell e o formulário de refeição vive nas telas.
   Em vez de arrastar props por toda a árvore, o botão avisa por evento:
   a tela montada atende na hora; se nenhuma estiver montada, o pedido
   fica pendente e a próxima tela que montar (o Diário) o atende.
   --------------------------------------------------------------------- */
const RegistroRapido = { pendente: false };

function pedirRegistroRapido() {
  RegistroRapido.pendente = true;
  window.dispatchEvent(new Event("nf-registro-rapido"));
}

function useRegistroRapido(abrir) {
  const ref = useRef(abrir);
  ref.current = abrir;
  useEffect(() => {
    const atender = () => { RegistroRapido.pendente = false; ref.current(); };
    window.addEventListener("nf-registro-rapido", atender);
    if (RegistroRapido.pendente) atender();
    return () => window.removeEventListener("nf-registro-rapido", atender);
  }, []);
}

function GridConsistencia({ dias }) {
  /* 5 semanas × 7 dias, do mais antigo para hoje. Mede presença, não resultado. */
  const set = new Set(dias);
  const celulas = [];
  for (let i = 34; i >= 0; i--) {
    const d = diasAtras(i);
    celulas.push({ dia: d, ativo: set.has(d), hoje: i === 0 });
  }
  const rotulos = ["D", "S", "T", "Q", "Q", "S", "S"];
  return (
    <div>
      <div className="nf-grid-dias">
        {celulas.map(c => (
          <span
            key={c.dia}
            className={`nf-dia ${c.ativo ? "on" : ""} ${c.hoje ? "hoje" : ""}`}
            title={`${new Date(c.dia + "T12:00:00").toLocaleDateString("pt-BR")} — ${c.ativo ? "registrado" : "sem registro"}`}
          />
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
        <span style={{ fontSize: 11, color: "var(--ink-faint)" }}>5 semanas atrás</span>
        <span style={{ fontSize: 11, color: "var(--ink-faint)" }}>hoje</span>
      </div>
      <span className="srOnly">{rotulos.join(" ")}</span>
    </div>
  );
}

/* Hook que junta as ações e a fila de comemorações. */
function useJornada(appState, pacienteId) {
  const [festa, setFesta] = useState(null);
  const g = appState.estadoGamificacao(pacienteId);
  const streak = streakDe(pacienteId);
  const dias = historicoDeDias(pacienteId);

  const comemorar = useCallback((res) => {
    if (!res) return;
    if (res.novasConquistas && res.novasConquistas.length) {
      const c = res.novasConquistas[0];
      setFesta({ tipo: "conquista", icone: c.icone, titulo: `Conquista: ${c.nome}`, sub: c.desc });
    } else if (res.subiuNivel) {
      setFesta({ tipo: "nivel", titulo: `Você chegou a ${res.subiuNivel.nome}!`, sub: res.subiuNivel.frase });
    } else if (res.xpGanho > 0) {
      setFesta({ tipo: "xp", icone: "✨", titulo: `+${res.xpGanho} XP`, sub: "Um passo de cada vez." });
    }
  }, []);

  return {
    g, streak, dias, festa, fecharFesta: () => setFesta(null),
    nivel: nivelDoXp(g.xp),
    refeicoesHoje: (appState.diario[pacienteId] || {})[HOJE] || [],
    diarioTodo: appState.diario[pacienteId] || {},
    copos: (appState.hidratacao[pacienteId] || {})[HOJE] || 0,
    metas: appState.metas[pacienteId] || [],
    conversas: appState.mensagens[pacienteId] || [],
    avisos: appState.notificacoes[pacienteId] || [],
    checkins: appState.checkins[pacienteId] || [],
    plano: appState.planos[pacienteId],
    naoLidas: (appState.notificacoes[pacienteId] || []).filter(n => !n.lida).length,

    marcar: (id) => comemorar(appState.alternarHabito(pacienteId, id)),
    concluir: (id) => comemorar(appState.concluirDesafio(pacienteId, id)),
    registrarRefeicao: (r) => comemorar(appState.addRefeicao(pacienteId, HOJE, r)),
    apagarRefeicao: (dia, id) => appState.removerRefeicao(pacienteId, dia, id),
    beber: (n) => comemorar(appState.definirCopos(pacienteId, HOJE, n)),
    alternarMeta: (id) => comemorar(appState.concluirMeta(pacienteId, id)),
    enviarCheckin: (d) => comemorar(appState.addCheckin(pacienteId, d)),
    mandarMensagem: (t) => appState.enviarMensagem(pacienteId, t),
    responder: () => appState.responderAutomatico(pacienteId),
  };
}

function CoposDeAgua({ copos, onMudar }) {

  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10, marginBottom: 12 }}>
        <div>
          <p className="nf-agua-num">{copos} <span>de {META_COPOS} copos</span></p>
          <p style={{ fontSize: 12.5, color: bateu ? "var(--primary)" : "var(--ink-faint)", marginTop: 2 }}>
            {bateu ? "Meta do dia batida 💧" : `${(copos * 0.25).toFixed(2).replace(".", ",")} L até agora`}
          </p>
        </div>
        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
          <button onClick={() => onMudar(copos - 1)} disabled={copos <= 0} className="nf-agua-btn nf-focus" aria-label="Tirar um copo">−</button>

      </div>
      <div className="nf-copos">

function ModalRefeicao({ onClose, onSalvar, inicial }) {
  const ini = inicial || {};
  const [tipo, setTipo] = useState(ini.tipo || "almoco");
  const [hora, setHora] = useState(ini.hora || new Date().toTimeString().slice(0, 5));
  const [descricao, setDescricao] = useState(ini.descricao || "");
  const [nota, setNota] = useState("");
  const [foto, setFoto] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [erroFoto, setErroFoto] = useState("");

  async function escolherFoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setCarregando(true); setErroFoto("");
    try { setFoto(await comprimirImagem(file)); }
    catch { setErroFoto("Não consegui usar essa imagem. Tente outra."); }
    setCarregando(false);
  }

  return (
    <Modal title="Registrar refeição" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
        <div>
          <label className="nf-label">Qual refeição?</label>
          <div className="nf-tipos">
            {TIPOS_REFEICAO.map(t => (
              <button key={t.id} onClick={() => setTipo(t.id)} className={`nf-tipo nf-focus ${tipo === t.id ? "on" : ""}`}>
                <span style={{ fontSize: 16 }}>{t.emoji}</span>{t.nome}
              </button>
            ))}
          </div>
        </div>

        <div className="nf-grid-2">
          <Field label="Horário" type="time" value={hora} onChange={e => setHora(e.target.value)} />
          <div>
            <label className="nf-label">Foto (opcional)</label>
            <label className="nf-foto-botao nf-focus" tabIndex={0}>
              {carregando ? "Preparando…" : foto ? "Trocar foto" : "Tirar ou escolher"}
              <IconCamera width={17} height={17} />
              <input type="file" accept="image/*" capture="environment" onChange={escolherFoto} style={{ display: "none" }} />
            </label>
          </div>
        </div>

        {foto && (
          <div className="nf-foto-previa">
            <img src={foto} alt="Prévia da refeição" />
            <button onClick={() => setFoto("")} className="nf-btn nf-btn-ghost nf-focus">Remover foto</button>
          </div>
        )}
        {erroFoto && <p className="nf-auth-erro">{erroFoto}</p>}

        <Field label="O que você comeu" textarea rows={3}
          placeholder="Descreva do seu jeito. Não precisa pesar nada."
          value={descricao} onChange={e => setDescricao(e.target.value)} />
        <Field label="Como se sentiu (opcional)" placeholder="Saciada, com fome depois, com pressa…"
          value={nota} onChange={e => setNota(e.target.value)} />

        <button
          onClick={() => { if (descricao.trim()) { onSalvar({ tipo, hora, descricao: descricao.trim(), nota: nota.trim(), foto }); onClose(); } }}
          disabled={!descricao.trim()}
          className="nf-btn nf-btn-primary" style={{ height: 50, width: "100%" }}>
          Salvar registro · +{XP_REFEICAO} XP
        </button>
      </div>
    </Modal>
  );
}

function EscalaCarinha({ label, valor, onMudar, extremos }) {
  const caras = ["😞", "😕", "😐", "🙂", "😄"];
  return (
    <div>
      <label className="nf-label">{label}</label>
      <div className="nf-escala">
        {caras.map((c, k) => (
          <button key={k} onClick={() => onMudar(k + 1)} className={`nf-cara nf-focus ${valor === k + 1 ? "on" : ""}`}
            aria-label={`${label}: ${k + 1} de 5`}>{c}</button>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }}>
        <span style={{ fontSize: 11, color: "var(--ink-faint)" }}>{extremos[0]}</span>
        <span style={{ fontSize: 11, color: "var(--ink-faint)" }}>{extremos[1]}</span>
      </div>
    </div>
  );
}

function BolhaMensagem({ msg }) {
  const minha = msg.de === "paciente";
  return (
    <div className={`nf-bolha-linha ${minha ? "minha" : ""}`}>
      {!minha && <Avatar nome="Dra. Letícia Silva" size={30} />}
      <div className={`nf-bolha ${minha ? "minha" : ""}`}>
        <p>{msg.texto}</p>
        <span className="nf-bolha-hora">{(msg.em || "").slice(11, 16) || "agora"}</span>
      </div>
    </div>

}

function PainelNotificacoes({ lista, onFechar, onLerTodas, onIr }) {

    <div className="nf-notif-overlay" onClick={e => { if (e.target === e.currentTarget) onFechar(); }}>
      <div className="nf-notif nf-scroll" role="dialog" aria-label="Notificações">
        <div className="nf-notif-topo">
          <h3 className="nf-h1" style={{ fontSize: 17 }}>Notificações</h3>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={onLerTodas} className="nf-btn nf-btn-ghost nf-focus" style={{ fontSize: 13, padding: "7px 11px" }}>Marcar lidas</button>
            <button onClick={onFechar} className="nf-btn nf-btn-ghost nf-focus" style={{ padding: 8, borderRadius: 999 }} aria-label="Fechar">
              <IconX width={15} height={15} />
            </button>
          </div>
        </div>
        {lista.length === 0 ? (
          <div style={{ padding: 16 }}>
            <EmptyState title="Nada por aqui" desc="Consulta chegando, resposta da nutricionista ou conquista nova aparecem neste painel." />

                  <span className="nf-notif-icone"><Icone width={16} height={16} /></span>
                  <span style={{ minWidth: 0, flex: 1, textAlign: "left" }}>
                    <span className="nf-notif-titulo">{n.titulo}</span>
                    <span className="nf-notif-texto">{n.texto}</span>
                  </span>
                  {!n.lida && <span className="nf-notif-ponto" />}

              );
            })}
          </div>
        )}
      </div>
    </div>

}

function AtalhoRapido({ icone: Icone, titulo, valor, onClick }) {
  return (
    <button onClick={onClick} className="nf-atalho nf-focus">
      <span className="nf-atalho-icone"><Icone width={17} height={17} /></span>
      <span className="nf-atalho-titulo">{titulo}</span>
      <span className="nf-atalho-valor">{valor}</span>
