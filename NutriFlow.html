/* ---- Quem precisa de atenção -------------------------------------------
   O motivo sai dos dados, não de uma lista fixa: assim a seção continua
   verdadeira quando os pacientes reais entrarem.
   ---------------------------------------------------------------------- */

function motivoAtencao(p, registros) {
  const regs = (registros && registros[p.id]) || [];

  if (p.status === "pendente") {
    return { texto: "Check-in pendente", detalhe: "Anamnese ainda não confirmada", tom: "aviso" };
  }
  if (p.adesao < 50) {
    return { texto: `Adesão em ${p.adesao}%`, detalhe: "Abaixo do mínimo do protocolo", tom: "risco" };
  }
  if (regs.length >= 2) {
    const ult = regs[regs.length - 1], pen = regs[regs.length - 2];
    if (Math.abs(ult.peso - pen.peso) < 0.3) {
      const dias = Math.round((new Date(ult.data) - new Date(pen.data)) / 86400000);
      const semanas = Math.max(1, Math.round(dias / 7));
      return { texto: `Peso sem evolução há ${semanas} semana${semanas > 1 ? "s" : ""}`, detalhe: `Parado em ${ult.peso} kg`, tom: "aviso" };
    }
  }
  if (p.adesao < 70) {
    return { texto: `Adesão em ${p.adesao}%`, detalhe: "Caiu em relação ao mês passado", tom: "aviso" };
  }
  if (!p.proxima || p.proxima === "—") {
    return { texto: "Sem retorno agendado", detalhe: "Último contato sem próxima data", tom: "aviso" };
  }
  return null;
}

function LinhaAtencao({ paciente, motivo, onClick }) {
  const cor = motivo.tom === "risco" ? "var(--danger)" : "var(--accent)";
  const fundo = motivo.tom === "risco" ? "var(--danger-tint)" : "var(--accent-tint)";
  return (
    <button onClick={onClick} className="nf-attn nf-focus">
      <Avatar nome={paciente.nome} size={42} ring={paciente.adesao} />
      <div style={{ minWidth: 0, flex: 1 }}>
        <p className="nf-attn-nome">{paciente.nome}</p>
        <p className="nf-attn-motivo" style={{ color: cor }}>{motivo.texto}</p>
        <p className="nf-attn-detalhe">{motivo.detalhe}</p>
      </div>
      <span className="nf-attn-flag" style={{ background: fundo, color: cor }}>
        <IconAlert width={14} height={14} />
      </span>
      <IconChevron width={16} height={16} style={{ color: "var(--ink-faint)", flexShrink: 0 }} />
    </button>
  );
}

function StatusConsulta({ status }) {
  const map = {
    confirmada: ["nf-chip-ativo", "Confirmada"],
    pendente: ["nf-chip-pendente", "A confirmar"],
    concluida: ["nf-chip-neutro", "Concluída"],
  };
  const [cls, label] = map[status] || map.confirmada;
  return <span className={`nf-chip ${cls}`}>{label}</span>;
}

    weekday: "long", day: "numeric", month: "long", year: "numeric",

  const agendaHoje = useMemo(
    () => agenda.filter(a => a.data === HOJE).sort((a, b) => a.hora.localeCompare(b.hora)),

  );
  const consultasOntem = useMemo(() => agenda.filter(a => a.data === ONTEM).length, [agenda]);

    () => agenda
      .filter(a => a.data >= HOJE && (a.status || "confirmada") !== "concluida")

      {/* Gráficos */}

        <ChartCard
          titulo="Evolução de pacientes"

          <BarSeries data={SERIE_CONSULTAS_MES} labels={MESES_SERIE} />
        </ChartCard>
      </div>
    </div>
  );
}

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  function calcIdade(dob) {
    if (!dob) return "";
    const diff = Date.now() - new Date(dob).getTime();
    return Math.floor(diff / (365.25 * 24 * 3600 * 1000));
  }

  function handleSubmit(e) {
    e.preventDefault();
    const idade = calcIdade(form.dataNasc);
    const imc = form.peso && form.altura ? +(form.peso / ((form.altura / 100) ** 2)).toFixed(1) : 0;

          <Field label="Meta de peso (kg)" type="number" step="0.1" value={form.meta} onChange={e => set("meta", e.target.value)} placeholder="65.0" />
        </div>
        <Field label="Descrição da meta" textarea value={form.metaDesc} onChange={e => set("metaDesc", e.target.value)} placeholder="Descreva o objetivo principal do paciente…" />
        <div className="nf-grid-2">
          <Field label="Alergias / intolerâncias" value={form.alergias} onChange={e => set("alergias", e.target.value)} placeholder="Ex: lactose, glúten" />
          <Field label="Medicamentos em uso" value={form.medicamentos} onChange={e => set("medicamentos", e.target.value)} placeholder="Ex: Metformina 500mg" />
        </div>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", paddingTop: 8, borderTop: "1px solid var(--border)" }}>
          <button type="button" onClick={onClose} className="nf-btn nf-btn-ghost">Cancelar</button>
          <button type="submit" className="nf-btn nf-btn-primary"><IconCheck width={16} height={16} />Cadastrar paciente</button>
        </div>
      </form>
    </Modal>
  );
}

  const lista = useMemo(() => pacientes.filter(p =>
    p.nome.toLowerCase().includes(busca.toLowerCase()) &&

  ), [busca, filtro, pacientes]);

        ))}

/* ========================= ABA MEDIDAS E PESO =========================== */

function TabMedidas({ pacienteId, registros, addRegistroPeso, paciente }) {
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({ data: new Date().toISOString().slice(0, 10), peso: "", cintura: "", quadril: "", braco: "", coxa: "" });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  function salvar(e) {
    e.preventDefault();
    const alt = paciente.altura / 100;
    const imc = alt > 0 ? +(+form.peso / (alt * alt)).toFixed(1) : 0;
    addRegistroPeso(pacienteId, { ...form, peso: +form.peso, cintura: +form.cintura, quadril: +form.quadril, braco: +form.braco, coxa: +form.coxa, imc });
    setForm({ data: new Date().toISOString().slice(0, 10), peso: "", cintura: "", quadril: "", braco: "", coxa: "" });
    setShowModal(false);
  }

  const ultimo = registros[registros.length - 1];
  const primeiro = registros[0];
  const diffPeso = ultimo && primeiro ? (ultimo.peso - primeiro.peso).toFixed(1) : null;

  return (
    <div>
      {showModal && (
        <Modal title="Novo registro de medidas" onClose={() => setShowModal(false)}>
          <form onSubmit={salvar} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            <Field label="Data *" type="date" value={form.data} onChange={e => set("data", e.target.value)} required />
            <div className="nf-grid-2">
              <Field label="Peso (kg) *" type="number" step="0.1" value={form.peso} onChange={e => set("peso", e.target.value)} required placeholder="68.5" />
              <Field label="Cintura (cm)" type="number" step="0.5" value={form.cintura} onChange={e => set("cintura", e.target.value)} placeholder="82" />
              <Field label="Quadril (cm)" type="number" step="0.5" value={form.quadril} onChange={e => set("quadril", e.target.value)} placeholder="97" />
              <Field label="Braço (cm)" type="number" step="0.5" value={form.braco} onChange={e => set("braco", e.target.value)} placeholder="28" />
              <Field label="Coxa (cm)" type="number" step="0.5" value={form.coxa} onChange={e => set("coxa", e.target.value)} placeholder="53" />
            </div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button type="button" onClick={() => setShowModal(false)} className="nf-btn nf-btn-ghost">Cancelar</button>
              <button type="submit" className="nf-btn nf-btn-primary"><IconCheck width={15} height={15} />Salvar medidas</button>
            </div>
          </form>
        </Modal>
      )}
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
        <button className="nf-btn nf-btn-primary nf-btn-sm" onClick={() => setShowModal(true)}><IconPlus width={15} height={15} />Novo registro</button>
      </div>
      {registros.length === 0 ? <EmptyState title="Nenhum registro" desc="Adicione o primeiro registro de peso e medidas." /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          {diffPeso !== null && (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
              {[
                { label: "Peso atual", val: `${ultimo.peso} kg`, sub: `Meta: ${paciente.meta} kg` },
                { label: "IMC", val: ultimo.imc || "—", sub: "kg/m²" },
                { label: "Variação total", val: `${+diffPeso > 0 ? "+" : ""}${diffPeso} kg`, sub: `${registros.length} registros`, color: +diffPeso < 0 ? "var(--primary)" : "var(--accent)" },
              ].map(c => (
                <div key={c.label} className="nf-card" style={{ padding: 16, textAlign: "center" }}>
                  <p className="nf-eyebrow" style={{ marginBottom: 6 }}>{c.label}</p>
                  <p style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 22, color: c.color }}>{c.val}</p>
                  <p style={{ fontSize: 12, color: "var(--ink-faint)", marginTop: 4 }}>{c.sub}</p>
                </div>
              ))}
            </div>
          )}
          <div className="nf-card" style={{ padding: 20, overflowX: "auto" }}>
            <p style={{ fontWeight: 700, fontSize: 15, marginBottom: 16 }}>Histórico completo</p>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
              <thead>
                <tr style={{ borderBottom: "2px solid var(--border)" }}>
                  {["Data", "Peso (kg)", "IMC", "Cintura", "Quadril", "Braço", "Coxa"].map(h => (
                    <th key={h} style={{ textAlign: "left", padding: "6px 10px", fontWeight: 700, color: "var(--ink-soft)", whiteSpace: "nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[...registros].reverse().map((r, i) => (
                  <tr key={i} style={{ borderBottom: "1px solid var(--border)", background: i === 0 ? "var(--primary-tint)" : "transparent" }}>
                    {[r.data, r.peso, r.imc || "—", r.cintura ? `${r.cintura} cm` : "—", r.quadril ? `${r.quadril} cm` : "—", r.braco ? `${r.braco} cm` : "—", r.coxa ? `${r.coxa} cm` : "—"].map((v, j) => (
                      <td key={j} style={{ padding: "10px 10px", fontFamily: j === 0 || j === 1 ? "var(--font-mono)" : "inherit", fontWeight: j === 1 ? 700 : 400, color: j === 0 ? "var(--ink-soft)" : "var(--ink)" }}>{v}</td>
                    ))}

        </div>

/* ========================= ABA EVOLUÇÃO (GRÁFICOS) ====================== */

function TabEvolucao({ registros, paciente }) {
  const [metrica, setMetrica] = useState("peso");
  if (registros.length < 2) return <EmptyState title="Dados insuficientes" desc="Adicione pelo menos dois registros de peso e medidas para visualizar a evolução." />;

  const metricas = [
    { key: "peso", label: "Peso (kg)", color: "var(--primary)" },
    { key: "imc", label: "IMC", color: "var(--accent)" },
    { key: "cintura", label: "Cintura (cm)", color: "var(--plum)" },
    { key: "quadril", label: "Quadril (cm)", color: "var(--danger)" },
    { key: "braco", label: "Braço (cm)", color: "#4a8c5c" },
  ];

  const ativa = metricas.find(m => m.key === metrica);
  const valores = registros.map(r => r[metrica]).filter(v => v != null && v > 0);
  const datas = registros.filter(r => r[metrica] > 0).map(r => r.data.slice(5));
  const min = Math.min(...valores);
  const max = Math.max(...valores);

  // Porcentagem de progresso em direção à meta (peso)
  const progresso = metrica === "peso" && paciente.meta && paciente.peso
    ? Math.min(100, Math.max(0, Math.round(
        ((registros[0]?.peso || paciente.peso) - (registros[registros.length - 1]?.peso || paciente.peso)) /
        ((registros[0]?.peso || paciente.peso) - paciente.meta) * 100
      )))
    : null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        {metricas.map(m => (
          <button key={m.key} onClick={() => setMetrica(m.key)}
            style={{ padding: "8px 14px", borderRadius: 999, fontSize: 13, fontWeight: 600, border: `1.5px solid ${metrica === m.key ? m.color : "var(--border)"}`, background: metrica === m.key ? m.color : "var(--surface)", color: metrica === m.key ? "#fff" : "var(--ink-soft)", transition: "all .15s" }}>
            {m.label}
          </button>
        ))}
      </div>

      <div className="nf-card" style={{ padding: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
          <div>
            <p className="nf-eyebrow" style={{ marginBottom: 4 }}>Evolução — {ativa.label}</p>
            <div style={{ display: "flex", gap: 20 }}>
              <span style={{ fontSize: 13, color: "var(--ink-soft)" }}>Mín: <strong>{min}</strong></span>
              <span style={{ fontSize: 13, color: "var(--ink-soft)" }}>Máx: <strong>{max}</strong></span>
              <span style={{ fontSize: 13, color: "var(--ink-soft)" }}>Atual: <strong>{valores[valores.length - 1]}</strong></span>
            </div>
          </div>
          {progresso !== null && (
            <div style={{ textAlign: "right" }}>
              <p style={{ fontSize: 12, color: "var(--ink-faint)", marginBottom: 4 }}>Progresso à meta</p>
              <div style={{ width: 120, height: 8, borderRadius: 4, background: "var(--border)", overflow: "hidden" }}>
                <div style={{ width: `${progresso}%`, height: "100%", background: "var(--primary)", borderRadius: 4, transition: "width .6s ease" }} />
              </div>
              <p style={{ fontSize: 12, color: "var(--primary)", fontWeight: 700, marginTop: 3 }}>{progresso}%</p>
            </div>
          )}
        </div>

        {/* SVG chart */}
        <div style={{ position: "relative", marginBottom: 8 }}>
          <LineChart data={valores} color={ativa.color} height={120} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
          {datas.map((d, i) => (
            <span key={i} style={{ fontSize: 11, color: "var(--ink-faint)", fontFamily: "var(--font-mono)" }}>{d}</span>
          ))}
        </div>
      </div>

      {metrica === "peso" && paciente.meta && (
        <div className="nf-card" style={{ padding: 20, display: "flex", gap: 20, alignItems: "center", flexWrap: "wrap" }}>
          <GrowthRing value={progresso || 0} size={72}><span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 15 }}>{progresso || 0}%</span></GrowthRing>
          <div>
            <p className="nf-eyebrow" style={{ marginBottom: 4 }}>Progresso rumo à meta</p>
            <p style={{ fontWeight: 700, fontSize: 16 }}>{registros[0]?.peso} kg → {paciente.meta} kg</p>
            <p style={{ fontSize: 13.5, color: "var(--ink-soft)", marginTop: 3 }}>
              Faltam {Math.max(0, (registros[registros.length - 1]?.peso - paciente.meta)).toFixed(1)} kg para atingir a meta.
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

function TabPlano({ pacienteId, plano, savePlano }) {
  const [editando, setEditando] = useState(!plano);
  const [form, setForm] = useState(plano || {
    calorias: "", proteinas: "", carboidratos: "", gorduras: "",
    refeicoes: [{ nome: "Café da manhã", horario: "07:00", alimentos: "" }],
  });
  const setMacro = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setRef = (i, k, v) => setForm(f => { const r = [...f.refeicoes]; r[i] = { ...r[i], [k]: v }; return { ...f, refeicoes: r }; });
  const addRef = () => setForm(f => ({ ...f, refeicoes: [...f.refeicoes, { nome: "", horario: "", alimentos: "" }] }));
  const removeRef = (i) => setForm(f => ({ ...f, refeicoes: f.refeicoes.filter((_, j) => j !== i) }));

  function salvar() {
    savePlano(pacienteId, { ...form, calorias: +form.calorias, proteinas: +form.proteinas, carboidratos: +form.carboidratos, gorduras: +form.gorduras });
    setEditando(false);
  }

  const macros = [
    { k: "calorias", label: "Calorias (kcal)", color: "var(--ink)" },
    { k: "proteinas", label: "Proteínas (g)", color: "#4a8c5c" },

    { k: "gorduras", label: "Gorduras (g)", color: "var(--danger)" },

    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
        <button className="nf-btn nf-btn-ghost nf-btn-sm" onClick={() => setEditando(true)}><IconEdit width={14} height={14} />Editar plano</button>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 20 }} className="nf-macros-grid">

        {macros.map(m => (
          <div key={m.k} className="nf-card" style={{ padding: 16, textAlign: "center" }}>
            <p className="nf-eyebrow" style={{ marginBottom: 6 }}>{m.label.split(" ")[0]}</p>
            <p style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 22, color: m.color }}>{plano[m.k]}</p>
            <p style={{ fontSize: 11, color: "var(--ink-faint)", marginTop: 2 }}>{m.label.split(" ")[1]}</p>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {plano.refeicoes?.map((r, i) => (
          <div key={i} style={{ border: "1px solid var(--border)", borderRadius: 14, padding: 18 }}>
            <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 13, color: "var(--primary)", minWidth: 44 }}>{r.horario}</span>
              <span style={{ fontWeight: 700, fontSize: 14.5 }}>{r.nome}</span>
            </div>
            <p style={{ fontSize: 14, color: "var(--ink-soft)", lineHeight: 1.6 }}>{r.alimentos}</p>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12 }} className="nf-macros-grid">
        {macros.map(m => <Field key={m.k} label={m.label} type="number" value={form[m.k]} onChange={e => setMacro(m.k, e.target.value)} placeholder="0" />)}
      </div>
      <div style={{ height: 1, background: "var(--border)" }} />
      <p style={{ fontWeight: 700, fontSize: 15 }}>Refeições</p>
      {form.refeicoes.map((r, i) => (
        <div key={i} style={{ border: "1px solid var(--border)", borderRadius: 14, padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
            <div className="nf-grid-2" style={{ flex: 1 }}>
              <Field label="Nome da refeição" value={r.nome} onChange={e => setRef(i, "nome", e.target.value)} placeholder="Almoço" />
              <Field label="Horário" type="time" value={r.horario} onChange={e => setRef(i, "horario", e.target.value)} />
            </div>
            <button onClick={() => removeRef(i)} className="nf-btn nf-btn-danger" style={{ padding: 9, borderRadius: 10, marginTop: 24, flexShrink: 0 }}><IconTrash width={15} height={15} /></button>

/* ========================= ABA METAS =================================== */

        <button className="nf-btn nf-btn-primary nf-btn-sm" onClick={() => setShowModal(true)}><IconPlus width={15} height={15} />Nova meta</button>
      </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

                {concluidas.map(m => (

/* ========================= PERFIL PACIENTE (container de abas) ========== */

function PerfilPaciente({ paciente, appState }) {
  const [tab, setTab] = useState("dados");
  if (!paciente) return null;

  const { registrosPeso, consultas, anamneses, planos, metas,
    updatePaciente, addRegistroPeso, addConsulta, saveAnamnese, savePlano,
    addMeta, toggleMeta, removeMeta,
    desafiosCustom, addDesafioCustom, aprovarDesafioCustom, rejeitarDesafioCustom, removeDesafioCustom,
  } = appState;

  const pac = appState.pacientes.find(p => p.id === paciente.id) || paciente;
  const regs = registrosPeso[pac.id] || [];
  const cons = consultas[pac.id] || [];
  const anam = anamneses[pac.id] || {};
  const plano = planos[pac.id] || null;
  const metasList = metas[pac.id] || [];

function ModalNovaConsulta({ onClose, onSave, pacientes }) {
  const [form, setForm] = useState({ pacienteId: pacientes[0]?.id || "", nome: pacientes[0]?.nome || "", hora: "09:00", data: "2026-08-18", tipo: "Retorno" });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  function handlePaciente(id) {
    const p = pacientes.find(x => x.id === +id);
    set("pacienteId", +id);
    if (p) set("nome", p.nome);
  }

  function salvar(e) {
    e.preventDefault();
    onSave(form);
    onClose();
  }

  return (
    <Modal title="Nova consulta na agenda" onClose={onClose}>
      <form onSubmit={salvar} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Field label="Paciente *" select value={form.pacienteId} onChange={e => handlePaciente(e.target.value)} required>
          {pacientes.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </Field>
        <div className="nf-grid-2">
          <Field label="Data *" type="date" value={form.data} onChange={e => set("data", e.target.value)} required />
          <Field label="Horário *" type="time" value={form.hora} onChange={e => set("hora", e.target.value)} required />
        </div>
        <Field label="Tipo de consulta" select value={form.tipo} onChange={e => set("tipo", e.target.value)}>
          {["Avaliação inicial","Retorno","Reavaliação","Teleconsulta"].map(t => <option key={t}>{t}</option>)}
        </Field>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          <button type="button" onClick={onClose} className="nf-btn nf-btn-ghost">Cancelar</button>
          <button type="submit" className="nf-btn nf-btn-primary"><IconCheck width={15} height={15} />Agendar</button>
        </div>
      </form>
    </Modal>
  );
}

/* ========================= AGENDA ======================================= */

function Agenda({ agenda, addAgenda, removeAgenda, pacientes, goPaciente }) {
  const dias = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
  const datas = ["2026-08-18", "2026-08-19", "2026-08-20", "2026-08-21", "2026-08-22", "2026-08-23", "2026-08-24"];
  const [diaAtivo, setDiaAtivo] = useState(0);
  const [showModal, setShowModal] = useState(false);

  const agendaDia = agenda.filter(a => a.data === datas[diaAtivo]).sort((a, b) => a.hora.localeCompare(b.hora));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {showModal && <ModalNovaConsulta onClose={() => setShowModal(false)} onSave={addAgenda} pacientes={pacientes} />}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h2 className="nf-h1" style={{ fontSize: 19 }}>Agosto 2026</h2>
        <button className="nf-btn nf-btn-primary nf-btn-sm" onClick={() => setShowModal(true)}><IconPlus width={16} height={16} />Nova consulta</button>
      </div>

      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
        {dias.map((d, i) => (
          <button key={d} onClick={() => setDiaAtivo(i)} className="nf-focus"
            style={{ minWidth: 58, padding: "10px 0", borderRadius: 14, textAlign: "center", flexShrink: 0, border: `1.5px solid ${diaAtivo === i ? "var(--primary)" : "var(--border)"}`, background: diaAtivo === i ? "var(--primary)" : "var(--surface)", color: diaAtivo === i ? "#fff" : "var(--ink)" }}>
            <div style={{ fontSize: 11.5, fontWeight: 600, opacity: .8 }}>{d}</div>
            <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 16 }}>{18 + i}</div>
            {agenda.filter(a => a.data === datas[i]).length > 0 && (
              <div style={{ width: 5, height: 5, borderRadius: "50%", background: diaAtivo === i ? "rgba(255,255,255,.6)" : "var(--accent)", margin: "4px auto 0" }} />
            )}
          </button>
        ))}
      </div>

      <div className="nf-card" style={{ padding: 8, minHeight: 100 }}>
        {agendaDia.length === 0 ? (
          <div style={{ padding: 32, textAlign: "center", color: "var(--ink-faint)" }}>
            <p style={{ fontWeight: 600 }}>Nenhuma consulta neste dia.</p>
          </div>
        ) : agendaDia.map((a, i) => {
          const pac = pacientes.find(p => p.id === a.pacienteId);
          return (
            <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 16, padding: "16px 14px", borderTop: i === 0 ? "none" : "1px solid var(--border)" }}>
              <div style={{ textAlign: "center", width: 58, flexShrink: 0 }}>
                <p style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 15, color: "var(--primary)" }}>{a.hora}</p>
              </div>
              <div style={{ width: 3, alignSelf: "stretch", background: "var(--accent)", borderRadius: 3 }} />
              {pac ? <Avatar nome={pac.nome} size={40} /> : <div style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--surface-2)" }} />}
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontWeight: 700, fontSize: 14.5 }}>{a.nome}</p>
                <p style={{ fontSize: 13, color: "var(--ink-faint)" }}>{a.tipo}</p>
              </div>
              {pac && <button className="nf-btn nf-btn-ghost nf-btn-sm" onClick={() => goPaciente(pac)}>Ver paciente</button>}
              <button onClick={() => removeAgenda(a.id)} className="nf-btn nf-btn-ghost" style={{ padding: 8, borderRadius: 999 }}><IconTrash width={15} height={15} style={{ color: "var(--danger)" }} /></button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const pendentes = [];
  pacientes.forEach(pac => {
    const desafios = desafiosCustom?.[pac.id] || [];
    desafios.filter(d => d.submissao?.status === "pendente_aprovacao").forEach(d => {
      pendentes.push({ pac, desafio: d });
    });
  });

  // Stats per patient
  const stats = pacientes.map(pac => {
    const desafios = desafiosCustom?.[pac.id] || [];
    return {
      pac,
      total: desafios.filter(d => d.ativo).length,
      pendentes: desafios.filter(d => d.submissao?.status === "pendente_aprovacao").length,

                  )}
                  {d.tipo === "texto" && d.submissao?.texto && (
                    <div style={{ borderTop: "1px solid var(--border)", padding: "10px 14px", background: "var(--surface-2)", fontSize: 13, color: "var(--ink-soft)", lineHeight: 1.6 }}>
                      "{d.submissao.texto}"
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Overview por paciente */}
      {stats.length > 0 ? (
        <div className="nf-card" style={{ padding: 20 }}>
          <h3 className="nf-h1" style={{ fontSize: 16, marginBottom: 14 }}>Por paciente</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {stats.map(({ pac, total, pendentes: pend, aprovados }) => (
              <div key={pac.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 14px", border: "1px solid var(--border)", borderRadius: 12 }}>
                <Avatar nome={pac.nome} size={42} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontWeight: 700, fontSize: 14 }}>{pac.nome}</p>
                  <div style={{ display: "flex", gap: 12, marginTop: 4, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 12, color: "var(--ink-faint)" }}>{total} desafio{total !== 1 ? "s" : ""}</span>
                    {aprovados > 0 && <span style={{ fontSize: 12, color: "var(--primary)", fontWeight: 600 }}>{aprovados} aprovado{aprovados !== 1 ? "s" : ""}</span>}
                    {pend > 0 && <span style={{ fontSize: 12, color: "#8A6620", fontWeight: 700 }}>{pend} pendente{pend !== 1 ? "s" : ""}</span>}
                  </div>
                </div>
                <button onClick={() => goPaciente(pac)} className="nf-btn nf-btn-ghost nf-btn-sm">
                  Gerenciar
                </button>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div className="nf-card" style={{ padding: 40, textAlign: "center" }}>
          <div style={{ width: 56, height: 56, borderRadius: 16, background: "var(--primary-tint)", color: "var(--primary)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
            <IconTrophy width={26} height={26} />
          </div>
          <h3 className="nf-h1" style={{ fontSize: 18, marginBottom: 8 }}>Nenhum desafio criado ainda</h3>
          <p style={{ fontSize: 14, color: "var(--ink-soft)", maxWidth: 340, marginInline: "auto" }}>
            Abra o perfil de um paciente, vá na aba "Desafios" e crie o primeiro desafio personalizado.
          </p>
        </div>
      )}
    </div>
  );
}

/* ============================= APP ====================================== */

function NutriFlowApp() {
  /* A sessão fica salva para não ter que logar de novo a cada recarga. */
  const [authed, setAuthed] = useState(() => !!storageGet("sessao", null));
  const [role, setRole] = useState(() => storageGet("sessao", null)?.role || "nutricionista");
  const [active, setActive] = useState("dashboard");
  const [pacienteSelecionado, setPacienteSelecionado] = useState(null);
  const [painelAvisos, setPainelAvisos] = useState(false);

  const appState = useAppState();

  function handleEnter(r) {
    storageSet("sessao", { role: r, em: new Date().toISOString() });
    setRole(r); setAuthed(true); setActive("dashboard"); setPacienteSelecionado(null);
    toast(r === "nutricionista" ? "Bem-vinda, Dra. Letícia" : "Bem-vinda, Marina", "ok");
  }
  function handleLogout() {
    storageSet("sessao", null);
    setAuthed(false); setPacienteSelecionado(null); setActive("dashboard");
    setPainelAvisos(false);
    toast("Você saiu da conta", "info");
  }
  function goPaciente(p) { setPacienteSelecionado(p); setActive("paciente-detail"); }
  function handleSetActive(k) { setPacienteSelecionado(null); setActive(k); }

  /* ---------------------------------------------------------------------
     REGRA DOS HOOKS: nada de useState/useMemo/useEffect abaixo daqui.
     O `return` da tela de login corta a função, então qualquer hook que
     ficasse depois dele só rodaria quando logado — e o React quebra com
     "Rendered more hooks than during the previous render" (erro #310).
     Todo hook deste componente fica ACIMA deste comentário.
     --------------------------------------------------------------------- */
  const ehPaciente = role === "paciente";
  const pacienteAtivo = appState.pacientes[0];
  const chaveAvisos = ehPaciente ? (pacienteAtivo?.id || 1) : "nutri";

  /* A nutricionista tem a própria caixa, sob a chave "nutri". O que ela vê
     é derivado dos alertas, para o sino nunca ficar desencontrado da
     realidade dos pacientes. */
  const avisosNutri = useMemo(() => {
    if (ehPaciente) return [];
    const salvos = appState.notificacoes.nutri || [];
    const lidos = new Set(salvos.filter(n => n.lida).map(n => n.id));
    return nutriaiAlertas(appState).slice(0, 8).map((a, k) => {
      const p = appState.pacientes.find(x => x.id === a.pacienteId);
      const id = "al-" + a.pacienteId + "-" + k;
      return { id, tipo: a.nivel === "acao" ? "checkin" : "conquista", titulo: `${p?.nome}: ${a.titulo}`, texto: a.motivo, lida: lidos.has(id), ir: a.ir || "nutriai" };
    });
  }, [ehPaciente, appState.pacientes, appState.gamificacao, appState.desafiosCustom, appState.checkins, appState.notificacoes.nutri]);

  if (!authed) return (<><Tokens /><ToastHost /><AuthScreen onEnter={handleEnter} /></>);

  const pacAtual = pacienteSelecionado
    ? appState.pacientes.find(p => p.id === pacienteSelecionado.id) || pacienteSelecionado
    : null;

  const titles = {
    dashboard: ehPaciente ? "Início" : "Dashboard",
    pacientes: "Pacientes",
    "paciente-detail": pacAtual?.nome || "Paciente",
    agenda: "Agenda",
    config: "Configurações",
    jornada: "Minha jornada",
    diario: "Diário alimentar",
    checkin: "Check-in semanal",
    assinaturas: "Planos e assinatura",
    atendimento: "Atendimento Online",
    ...Object.fromEntries(Object.entries(MODULOS).map(([k, v]) => [k, v.titulo])),
  };

  /* telas com conteúdo real; o resto cai no placeholder do módulo */
  const prontas = ["dashboard", "pacientes", "paciente-detail", "agenda", "config"]
    .concat(ehPaciente ? ["jornada", "desafios", "metas", "diario", "planos", "evolucao", "checkin", "mensagens", "atendimento"] : ["desafios", "nutriai", "mensagens", "relatorios", "financeiro", "assinaturas", "atendimento"]);

  const avisos = ehPaciente ? (appState.notificacoes[pacienteAtivo?.id || 1] || []) : avisosNutri;
  const naoLidas = avisos.filter(n => !n.lida).length;

  function abrirAviso(n) {
    appState.lerNotificacao(chaveAvisos, n.id);
    if (n.ir) handleSetActive(n.ir);
    setPainelAvisos(false);
  }

  return (
    <>
      <Tokens />
      <ToastHost />
      <AppShell
        role={role}
        naoLidas={naoLidas}
        onAbrirNotificacoes={() => setPainelAvisos(true)}
        onLogout={handleLogout}
        active={active}
        setActive={handleSetActive}
        title={titles[active] || "NutriFlow"}
        chaveTela={active}
        onBack={active === "paciente-detail" ? () => setActive("pacientes") : undefined}
      >
        {active === "dashboard" && (
          <Dashboard
            role={role}
            goPaciente={goPaciente}
            setActive={handleSetActive}
            pacientes={appState.pacientes}
            agenda={appState.agenda}
            consultas={appState.consultas}
            registrosPeso={appState.registrosPeso}
            appState={appState}
          />
        )}
        {active === "pacientes" && role === "nutricionista" && (
          <Pacientes goPaciente={goPaciente} pacientes={appState.pacientes} addPaciente={appState.addPaciente} />
        )}
        {active === "paciente-detail" && <PerfilPaciente paciente={pacAtual} appState={appState} />}
        {active === "agenda" && (
          <Agenda
            agenda={appState.agenda}
            addAgenda={appState.addAgenda}
            removeAgenda={appState.removeAgenda}
            pacientes={appState.pacientes}
            goPaciente={goPaciente}
          />
        )}
        {active === "config" && <Configuracoes role={role} />}
        {ehPaciente && active === "jornada" && <TrilhaPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "desafios" && <DesafiosPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "metas" && <MetasPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "diario" && <DiarioPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "planos" && <PlanoPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "evolucao" && <EvolucaoPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "checkin" && <CheckinPaciente paciente={pacienteAtivo} appState={appState} />}
        {ehPaciente && active === "mensagens" && <MensagensPaciente paciente={pacienteAtivo} appState={appState} />}
        {!ehPaciente && active === "nutriai" && <NutriAIPage appState={appState} goPaciente={goPaciente} setActive={handleSetActive} />}
        {!ehPaciente && active === "mensagens" && <MensagensNutri appState={appState} />}
        {!ehPaciente && active === "relatorios" && <RelatoriosNutri appState={appState} />}
        {!ehPaciente && active === "financeiro" && <FinanceiroNutri appState={appState} />}
        {active === "assinaturas" && <AssinaturasDemo />}
        {active === "atendimento" && (
          <AtendimentoOnline role={role} appState={appState} pacienteAtivo={pacienteAtivo} />
        )}
        {!ehPaciente && active === "desafios" && <DesafiosNutri appState={appState} goPaciente={goPaciente} />}
        {!prontas.includes(active) && (
          MODULOS[active]
            ? <ModuloEmBreve chave={active} setActive={handleSetActive} />
            : <div className="nf-card" style={{ padding: 34, textAlign: "center" }}>
                <EmptyState title="Tela não encontrada" desc="Esse item não existe no seu perfil de acesso." />
                <button onClick={() => handleSetActive("dashboard")} className="nf-btn nf-btn-primary" style={{ marginTop: 16 }}>Voltar ao início</button>
              </div>
        )}
      </AppShell>

      {painelAvisos && (
        <PainelNotificacoes
          lista={avisos}
          onFechar={() => setPainelAvisos(false)}
          onLerTodas={() => appState.lerTodasNotificacoes(chaveAvisos, avisos.map(n => n.id))}
          onIr={abrirAviso}
        />
      )}
    </>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<NutriFlowApp />);
</script>

<script>
/* ============================================================
   Carregador com espelhos.
   Cada biblioteca tem mais de uma origem: se a primeira estiver
   bloqueada (o preview do app bloqueia algumas), tenta a próxima.
   ============================================================ */
(function () {
  var LIBS = [
    { nome: "React", teste: function () { return !!window.React; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
      "https://unpkg.com/react@18.3.1/umd/react.production.min.js"
    ]},
    { nome: "ReactDOM", teste: function () { return !!window.ReactDOM; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
      "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
    ]},
    { nome: "Babel", teste: function () { return !!window.Babel; }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js",
      "https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js",
      "https://unpkg.com/@babel/standalone@7/babel.min.js"
    ]},
    { nome: "jsPDF", teste: function () { return !!(window.jspdf && window.jspdf.jsPDF); }, urls: [
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
      "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"
    ]}
  ];

  var aviso = document.getElementById("aviso");

  function falhar(nome, detalhe) {
    aviso.innerHTML =
      "<b>Não consegui carregar " + nome + ".</b>" +
      "Esta versão baixa React e Babel na primeira abertura. " +
      "Se estiver sem internet ou atrás de um bloqueio de rede, use o arquivo " +
      "<code>NutriFlow.jsx</code> num projeto Vite." +
      (detalhe ? "<p style='margin-top:14px'><code>" + detalhe + "</code></p>" : "");
  }

  function tentar(lib, i, ok) {
    if (lib.teste()) return ok();
    if (i >= lib.urls.length) return falhar(lib.nome, "Todas as origens falharam.");
    var s = document.createElement("script");
    s.src = lib.urls[i];
    s.crossOrigin = "anonymous";
    s.onload = function () { lib.teste() ? ok() : tentar(lib, i + 1, ok); };
    s.onerror = function () { tentar(lib, i + 1, ok); };
    document.head.appendChild(s);
  }

  function emSequencia(k) {
    if (k >= LIBS.length) return iniciar();
    tentar(LIBS[k], 0, function () { emSequencia(k + 1); });
  }

  function iniciar() {
    try {
      var fonte = document.getElementById("fonte-nutriflow").textContent;
      var js = Babel.transform(fonte, { presets: ["react"] }).code;
      aviso.remove();
      new Function(js)();
    } catch (e) {
      falhar("o aplicativo", (e && e.message) ? e.message : String(e));
      console.error(e);
    }
  }

  emSequencia(0);
})();
</script>
</body>
